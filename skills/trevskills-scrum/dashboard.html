  el.innerHTML = !items.length ? "" : `<h3 data-agent-hint="Every bullet under a ## Diverged heading in this job's spec.md, build.md, assessment.md and plan.md: where an agent departed from feature.md or spec.md, and why.">Diverged</h3>
    <ul>${items.map(([f, b]) => `<li><span class="lanechip">${esc(f)}</span>${esc(b)}</li>`).join("")}</ul>`;
}

// Fetches the open needs-human job's rework.md into reworkMd and swaps only the Sent back list, so typed feedback stays.
async function loadRework(job) {
  if (job.stage !== "needs-human" || !(job.files || []).includes("rework.md")) return;
  const md = await fetch(`p/${enc(job.project)}/jobs/${enc(job.id)}/rework.md`, {cache: "no-store"})
    .then(r => r.ok ? r.text() : "").catch(() => "");
  if (md === reworkMd[job.key]) return;
  reworkMd[job.key] = md;
  const box = $("viewer").dataset.key === job.key && $("actions").querySelector(".sentback");
  if (box) box.outerHTML = reworkList(job);
}

// Abort works on any unfinished job: it stops a dashboard-started run and marks the job aborted (code is kept).
const abortForm = job => ["done", "aborted"].includes(job.stage) ? "" : `<form data-act="abort">
    <label hidden><input type="checkbox" name="requeue"> Put back in backlog</label>
    <button class="btn danger-outline" type="submit">Abort job</button></form>`;
// The one More menu: Abort sits behind it so it is never a top-level button.
const moreMenu = job => { const a = abortForm(job); return a ? `<details class="more" data-key="${esc(job.key)}"><summary>More</summary>${a}</details>` : ""; };
// Pause stops the job's session and holds it in its stage (board.py PAUSABLE); Play is the resume form below.
const PAUSABLE = ["spec", "build", "check", "review", "approve", "merging", "plan", "running"];
const pauseForm = job => !PAUSABLE.includes(job.stage) || heldByTrevor(job) ? "" : `<form data-act="pause"><button class="btn tall" type="submit">Pause</button></form>`;
// A job stopped for a resumable reason (board.py RESUMABLE) resumes; one Trevor paused (board.py PAUSED_RE) shows it as Play.
// When serve.py says a click would be refused (job.resumeRefusal), no button shows. The status line above already says
// what blocks it; a paused or stalled job with no waitingOn also gets that refusal as a note in its panel.
const RESUMABLE = ["stalled in ", "stalled: ", "bigboy off track", "bigboy review: main not updated", "bigboy blocked", "Base branch "];
const PAUSED_RE = /^stalled in \w+: paused by Trevor/;
const resumeForm = job => {
  const reason = job.reason || "";
  if (!RESUMABLE.some(p => reason.startsWith(p))) return "";
  if (job.resumeRefusal) return !(job.paused || isStalled(job)) || job.waitingOn ? "" : `<p class="note" role="status">${esc(statusLine({...job, paused: false}))}</p>`;
  return `<form data-act="resume"><button class="btn primary tall" type="submit">${PAUSED_RE.test(reason) ? "Play" : "Resume"}</button></form>`;
};
// A paused or stalled job (legacy needs-human shape included) takes the not-needs-human branch: Play or Resume goes there.
const playForm = job => heldByTrevor(job) || isStalled(job) ? resumeForm(job) : "";
// Setup done: Trevor did a BigBoy child's manual setup; serve.py marks it and starts whatever is now ready.
const setupForm = job => !setupWait(job) ? "" : `<form data-act="setup-done"><p class="note">Human setup: ${esc(job.setup_text || "—")}</p>
    <button class="btn primary tall" type="submit">Setup done</button></form>`;
// Reopen starts a new linked job from a finished one; once reopened, the button jumps to that job instead.
const reopenForm = job => !["done", "aborted"].includes(job.stage) ? ""
  : job.reopened_to ? `<form data-act="goto" data-key="${esc(`${job.project}/${job.reopened_to}`)}"><button class="btn" type="submit">Reopened as ${esc(job.reopened_to)}</button></form>`
  : `<form data-act="reopen"><textarea name="note" required maxlength="2000" placeholder="What should the follow-up job do?" aria-label="Note for the reopened job"></textarea>
    <button class="btn" type="submit">Reopen</button></form>`;

// A stop's issue in plain words: the machine prefix (board.py ask, "Hard stop: x — ") goes, the text is cut at the
// first " Fix: ", and every path is cut to its basename (the same rule as serve.py waiting_on).
const noPaths = text => text.replace(/\S*\//g, "");
const STOP_PREFIX = /^(stalled in \w+: )?(Hard stop: [^—]+ — |[a-z][\w ]{0,30}: )/;
const stopIssue = text => noPaths(String(text || "").replace(STOP_PREFIX, "").split(" Fix: ")[0]).trim() || "No reason recorded.";
const VERBS = {spec: "Writing spec", plan: "Planning", build: "Building", check: "Checking", review: "Reviewing", approve: "Approving",
  merging: "Merging", cloud: "Running in cloud", running: "Running", waiting: "Queued"};
// One plain line per job, on its card and under the modal title. job.waitingOn is serve.py's {ids, why} field, not the
// waitingOn(job) helper above; its titles run parallel to ids. A Play the machine guard queued names the reading it waits
// on, without serve.py's "waiting: " prefix; its fixed label sits outside noPaths, which would cut "CPU/".
const statusLine = job => !job.waitingOn && !job.paused && playQueued(job) && job.resumeRefusal
  ? `Waiting for CPU/RAM: ${noPaths(String(job.resumeRefusal).replace(/^waiting: /, "").split(" Fix: ")[0])}`
  : noPaths(job.stage === "done" ? "Done" : job.stage === "aborted" ? "Aborted"
  : job.waitingOn ? `Waiting on ${(job.waitingOn.ids || []).map((id, i) => job.waitingOn.titles?.[i] ? `${id} ${job.waitingOn.titles[i]}` : id).join(", ")} (${job.waitingOn.why})`
  : job.paused ? "Paused by you"
  : job.resumeRefusal ? `Waiting: ${String(job.resumeRefusal).split(" Fix: ")[0]}`
  : playQueued(job) ? "Queued, starts next"
  : isStalled(job) ? `Stalled: ${stopIssue(job.reason)}`
  : limitHeld(job) ? "Stalled: usage limit"
  : job.stage === "needs-human" ? `Waiting on you: ${stopIssue(job.question || job.reason)}`
  : paused(job) ? `Waiting on you: ${job.waiting}`
  : setupWait(job) ? "Waiting on you: setup"
  : job.buildLockWait ? "Waiting for the build lock"
  : `${VERBS[job.stage] || job.stage}, ${Math.max(0, Math.floor((Date.now() - Date.parse(job.updatedAt)) / 60000)) || 0} min`);

// A needs-human job's closed question (board.py ask): armed/pending/note-open state per job key, outside the DOM so a
// poll re-render keeps it. actionError: a refused POST's message per job key, kept across re-renders until the next
// POST for that job succeeds or its stage changes.
const answerState = {}, actionError = {};
const setActionError = (key, stage, msg) => {
  actionError[key] = {msg, stage};
  const p = $("viewer").dataset.key === key && $("actions").querySelector(":scope > .error");
  if (p) p.textContent = msg;
};
// Recommended option first, then key order.
const stopOptions = job => [...(job.options || [])].sort((a, b) =>
  (b.key === job.recommend?.key) - (a.key === job.recommend?.key) || String(a.key).localeCompare(String(b.key)));
// The one renderer of a stop: the issue once, then one large button per option (A/B/C), the rework option with an
// optional note. A session paused on a prompt gets the same box with its prompt.
function stopBox(job) {
  if (paused(job)) return `<div class="stop" role="status"
    data-agent-hint="This job's interactive session is paused on a permission prompt, a question or a reply. The first line is what it is waiting for.">
    <b>Waiting on you</b><p>${esc(job.waiting)}</p><p>Answer it in the job's terminal.</p></div>`;
  if (job.stage !== "needs-human" || playQueued(job) || isStalled(job)) return "";
  const st = answerState[job.key] || {}, run = runs[job.key], off = st.pending || (run?.alive && run.action !== "discuss");
  const rec = job.recommend, dis = off ? " disabled" : "";
  const buttons = job.play_queued ? "" : stopOptions(job).map((o, i) => {
    const armed = st.armed === o.key, top = i === 0 && !!rec && o.key === rec.key;
    return `<button class="btn tall${armed ? " danger" : ""}" type="button" data-answer="${esc(o.key)}"${dis}>${armed ? "Confirm: " : ""}${esc(o.label)}${top ? ' <span class="badge">Recommended</span>' : ""}</button>`
      + (top && rec.why ? `<p class="note">${esc(rec.why)}</p>` : "");
  }).join("");
  // Without options the reason's own fix (after " Fix: ") stays as the box's second line, as before.
  const fix = buttons ? "" : (job.reason || "").split(" Fix: ").slice(1).join(" Fix: ");
  const note = !st.noteOpen ? "" : `<div class="sendback"><textarea name="note" maxlength="2000" placeholder="Anything the builder should know? (optional)" aria-label="Note for the builder"${dis}>${esc(st.note || "")}</textarea>
    <button class="btn primary tall" type="button" data-send="${esc(st.noteOpen)}"${dis}>Send back</button></div>`;
  return `<div class="stop" role="status"
    data-agent-hint="This job stopped and needs Trevor. The first line is the agent's question in full, or what went wrong; then either the exact fix or the buttons for the ways forward, the recommended one first.">
    <b>Waiting on you</b><p>${esc(job.question || stopIssue(job.reason))}</p>${fix ? `<p>${esc(fix.charAt(0).toUpperCase() + fix.slice(1))}</p>` : ""}${buttons ? `<div class="acts">${buttons}</div>` : ""}${note}</div>`;
}

function renderActions(job) {
  const el = $("actions"), status = $("viewerStatus"), d0 = el.querySelector?.("details.more"), more = d0?.open && d0.dataset?.key === job.key;  // never carry the open menu to another job
  if (status) status.textContent = statusLine(job);
  if (actionError[job.key] && actionError[job.key].stage !== job.stage) delete actionError[job.key];
  const fail = actionError[job.key], queued = job.play_queued ? '<p class="note" role="status">queued, starts next</p>' : "";  // not an error: muted, no alert
  const err = queued + (fail ? `<p class="error" role="alert">${esc(fail.msg)}</p>` : '<p class="error" role="alert"></p>');
  el.innerHTML = actionsHtml(job, err);
  if (more) { const d = el.querySelector("details.more"); if (d) d.open = true; }
}
// The modal's actions for job; err is the error line: right under the Play/Resume part when there is one, else last, under the buttons.
function actionsHtml(job, err) {
  const run = runs[job.key], reason = job.reason || "", banner = outcomeLine(job, "p", "note") + stopBox(job);
  const log = run?.log ? ` · <a href="p/${enc(job.project)}/${esc(run.log)}" target="_blank" rel="noopener">log</a>` : "";
  const kids = waitingNote(job, "note") + childLinks(job);
  // A Discuss session runs in Terminal and may itself approve or rework, so the needs-human buttons stay while it is open.
  const now = run?.alive ? `<p class="running">${esc(runLine(run))}${log}</p>` : "";
  if (run?.alive && run.action !== "discuss") return banner + kids + now + pauseForm(job) + moreMenu(job) + err;
  const last = run && !run.alive ? `<p class="note">Last ${esc(run.action)} run ${run.exit === 0 ? "finished" : run.exit < 0 ? `stopped by ${PAUSED_RE.test(reason) ? "Pause" : "Abort"}` : `failed (exit ${esc(run.exit)})`}${log}</p>` : now;
  const why = job.stage === "aborted" && reason ? `<p class="note">${esc(reason)}</p>` : "";
  if (job.stage !== "needs-human" || isStalled(job)) { const held = heldByTrevor(job) || isStalled(job);  // Play and Reopen never show together, so err can follow both
    return banner + kids + why + last + setupForm(job) + playForm(job) + reopenForm(job) + (held ? err : "") + pauseForm(job) + moreMenu(job) + (held ? "" : err); }
  // An obsolete job has nothing to rework; a BigBoy parent has no worktree or builder (its children do the work),
  // except off track, where Send back re-runs the tracker with Trevor's decision.
  // A stalled job (board.py watchdog) never finished review or approval, so it resumes instead of merging.
  const noRework = /^obsolete/.test(reason) || (!!job.children?.length && !/^bigboy off track/.test(reason)), canApprove = job.worktree && !/^(blocked|spec writer|obsolete|stalled)/.test(reason);
  const resume = job.options?.length ? "" : resumeForm(job);
  return banner + kids + last + (job.options?.length ? "" : resume + (resume ? err : "")
    + (canApprove ? `<form data-act="approve">
      ${/Hard stop: schema/.test(reason) ? '<label><input type="checkbox" name="migrated"> I already ran /trevskills-migrate (skip it)</label>' : ""}
      <button class="btn primary" type="submit">Approve &amp; merge</button></form>` : "")
    + (noRework ? "" : `<form data-act="rework"><textarea name="feedback" required maxlength="2000" placeholder="What should the builder change?" aria-label="Feedback for the builder"></textarea>
      <button class="btn" type="submit" data-act="discuss" formnovalidate data-agent-hint="Opens an interactive Claude session in a new Terminal window that explains why the job stopped and what a rework can or cannot fix, then runs the approve or rework you agree on.">Discuss first</button>
      <button class="btn" type="submit">Send back to builder</button></form>`)) + reworkList(job) + moreMenu(job) + (resume ? "" : err);
}

$("actions").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, btn = e.submitter || form.querySelector("button"), act = btn.dataset.act || form.dataset.act, key = $("viewer").dataset.key;
  const job = jobs.find(j => j.key === key);
  if (act === "goto") { const linked = jobs.find(j => j.key === form.dataset.key); if (linked) open(linked); return; }
  if (act === "approve" && !form.dataset.armed) {
    form.dataset.armed = "1"; btn.textContent = "Confirm: merge into main";
    btn.insertAdjacentHTML("afterend", feedbackWarning($("actions").querySelector('textarea[name="feedback"]')?.value)); return;
  }
  if (act === "abort" && !form.dataset.armed) {
    form.dataset.armed = "1"; form.querySelector("label").hidden = false;
    btn.textContent = "Confirm abort"; btn.className = "btn danger"; return;
  }
  btn.disabled = true;
  try {
    const body = act === "approve" ? {migrated: !!form.migrated?.checked} : act === "abort" ? {requeue: form.requeue.checked}
      : act === "reopen" ? {note: form.note.value} : act === "resume" ? {manual: true} : act === "pause" || act === "setup-done" ? {} : {feedback: form.feedback.value};
    const out = await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/${act}`, body);
    delete actionError[key];
    if (act === "discuss") { btn.disabled = false; btn.textContent = "Opened in Terminal"; return; }
    await poll();
    const linked = act === "reopen" && jobs.find(j => j.key === `${job.project}/${out.id}`);
    if (linked) return open(linked);
    renderActions(jobs.find(j => j.key === key));
  } catch (err) {
    btn.disabled = false;
    setActionError(key, job.stage, err.message);
  }
});

// Redraws only the open modal's stop box (a poll redraws the rest), keeping focus on the note or the clicked option.
function redrawAnswer(key, k) {
  const job = jobs.find(j => j.key === key), box = $("actions");
  const stop = job && $("viewer").open && $("viewer").dataset.key === key && box.querySelector(".stop");
  if (!stop) return;
  const refocus = stop.contains(document.activeElement) || document.activeElement === document.body;
  stop.outerHTML = stopBox(job);
  const note = answerState[key]?.noteOpen && box.querySelector('.stop textarea[name="note"]');
  if (note && !note.disabled) note.focus();
  else if (refocus) [...box.querySelectorAll(".stop button[data-answer]")].find(b => b.dataset.answer === k)?.focus();
}
// An option click. A rework option opens its note first and posts {key, note} from Send back; an abort option arms
// first and posts on the second click; any other option posts {key} at once.
async function answer(key, k, note) {
  const job = jobs.find(j => j.key === key), opt = job?.options?.find(o => o.key === k), st = answerState[key] || {};
  if (!opt || st.pending) return;
  if (note === undefined && /^rework /.test(opt.command || "")) { answerState[key] = {noteOpen: k, note: st.note}; return redrawAnswer(key, k); }
  if (/^abort\b/.test(opt.command || "") && st.armed !== k) { answerState[key] = {armed: k}; return redrawAnswer(key, k); }
  const keep = note === undefined ? {} : {noteOpen: k, note};
  answerState[key] = {...keep, pending: true}; redrawAnswer(key, k);
  try {
    await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/answer`, note === undefined ? {key: k} : {key: k, note});
    delete answerState[key];
    delete actionError[key];
    await poll();
    const now = $("viewer").open && $("viewer").dataset.key === key && jobs.find(j => j.key === key);
    if (now) renderActions(now);
  } catch (err) { answerState[key] = keep; redrawAnswer(key, k); setActionError(key, job.stage, err.message); }
}
// answer() end
$("actions").addEventListener("click", e => {
  const b = e.target.closest("button[data-answer], button[data-send]"), key = $("viewer").dataset.key;
  if (b?.dataset.answer) answer(key, b.dataset.answer);
  else if (b) answer(key, b.dataset.send, $("actions").querySelector('.stop textarea[name="note"]')?.value ?? "");
});
$("actions").addEventListener("input", e => {  // the note draft lives in answerState, so a re-render keeps it
  const st = e.target.matches('.stop textarea[name="note"]') && answerState[$("viewer").dataset.key];
  if (st) st.note = e.target.value;
});

const blProject = () => $("blProject").value;
const editingBacklog = () => !!$("blList").querySelector("[data-armed]") || ($("blList").contains(document.activeElement) && /TEXTAREA|SELECT/.test(document.activeElement.tagName)) || !!$("blList").querySelector(".dragging");

// Open manual checks (scrum/manual-checks.md): human-only follow-ups that never run as jobs. Ticking one is final.
function renderManual() {
  const open = (manuals[blProject()] || []).filter(i => !i.done);
  $("blManual").hidden = !open.length;
  $("blManualList").innerHTML = open.map(it => `<li><label><input type="checkbox" data-i="${it.index}"><span>${esc(it.text)}</span></label></li>`).join("");
}

// "waits on: …" after an item's text: each needs id as that item's text from the project's backlog (open or done), cut to
// 40 chars, or #<id> when no item has it. Muted once nothing it needs still waits. Empty for an item with no needs.
function needsTag(it, all) {
  if (!it.needs?.length) return "";
  const names = it.needs.map(id => all.find(i => i.id === id)?.text || `#${id}`);
  const cut = t => t.length > 40 ? t.slice(0, 39) + "…" : t;
  return `<span class="needs${it.waits?.length ? "" : " met"}" title="${esc(names.join("; "))}">waits on: ${esc(names.map(cut).join(", "))}</span>`;
}

// Importance chip (priority 1-5, from the {p:N} marker): .badge (warning) for 4-5, .lanechip (muted) for 1-3. Nothing otherwise.
function prioTag(it) {
  return Number.isInteger(it.priority) && it.priority >= 1 && it.priority <= 5
    ? `<span class="${it.priority >= 4 ? "badge" : "lanechip"}">P${it.priority}</span>` : "";
}

// A Human setup item (" {setup: …}" in backlog.md): its checklist under the row. next and Run all skip it until Setup done.
function setupTag(it) {
  if (!it.setup?.length) return "";
  return `<div class="setup-box">waiting on you:<ul class="setup-list">${it.setup.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`;
}

function renderBacklog() {
  renderManual();
  $("blAdd").hidden = !projects.length;
  $("blRunAll").disabled = !projects.length;
  if (!projects.length) return $("blList").innerHTML = '<li class="note">No projects yet. Run /trevskills-scrum in a repo first.</li>';
  const all = backlogs[blProject()] || [], open = all.filter(i => !i.done);
  $("blRunAll").disabled = !open.length;
  $("blList").innerHTML = open.map((it, n) => `<li data-i="${it.index}"${it.setup?.length ? ' class="setup"' : ""}>
      <span class="grip" draggable="true" aria-hidden="true" data-agent-hint="Drag to reorder.">⋮⋮</span>
      <select class="pts p${it.points ?? "x"}" aria-label="Difficulty points" title="${esc(it.why || "Not estimated yet")}">
        ${ptsOptions(it.points)}</select>${prioTag(it)}
      <textarea rows="1" maxlength="2000" aria-label="Item text">${esc(it.text)}</textarea>${needsTag(it, all)}
      <button class="btn icon" type="button" data-do="up" aria-label="Move to top"${n === 0 ? " disabled" : ""}>↑</button>
      <button class="btn icon" type="button" data-do="down" aria-label="Move to bottom"${n === open.length - 1 ? " disabled" : ""}>↓</button>
      ${it.setup?.length ? '<button class="btn" type="button" data-do="setup-done">Setup done</button>'
        : '<button class="btn icon" type="button" data-do="run" aria-label="Run now">▶</button>'}
      <button class="btn icon" type="button" data-do="delete" aria-label="Delete">✕</button>${setupTag(it)}
    </li>`).join("") || '<li class="note">Backlog is empty.</li>';
}

async function backlogCall(fn) {
  $("blError").textContent = "";
  try { await fn(`api/p/${enc(blProject())}/backlog`); } catch (err) { $("blError").textContent = err.message; }
  await poll();
  renderBacklog();
}

// A dialog's project picker opens on the board filter, else the last project picked there, else the first.
function pickProject(sel, key) {
  renderSelect(sel, filter || store.get(key) || projects[0] || "", false);
  if (!sel.value && projects.length) sel.value = projects[0];
}

// The latest triage report (scrum/triage/latest.md) for the picked project, collapsed; hidden when there is none.
// Run all disarms on every open, project change and finished call, so a stale Askme picker never fires for another project.
function disarmRunAll() {
  const b = $("blRunAll"), picker = $("blRunAllAskme");
  delete b.dataset.armed; b.textContent = "Run all";
  picker.hidden = true;
  picker.querySelectorAll("button").forEach(x => x.disabled = false);
}
async function showProjectBacklog() {
  disarmRunAll();
  renderBacklog();
  const p = blProject();
  const res = p ? await fetch(`p/${enc(p)}/triage/latest.md`, {cache: "no-store"}).catch(() => null) : null;
  const md = res?.ok ? await res.text() : "";
  if (p !== blProject()) return;
  $("blTriage").hidden = !md;
  $("blTriageBody").innerHTML = !md ? "" : window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
}
$("backlogBtn").addEventListener("click", () => {
  pickProject($("blProject"), "scrum.backlogProject");
  $("blAdd").urgency.value = "later";  // each open starts on Later, so a past Now never fires by accident
  showProjectBacklog();
  $("backlog").showModal();
});
$("blProject").addEventListener("change", e => { store.set("scrum.backlogProject", e.target.value); showProjectBacklog(); });
// Run all asks once: the first click shows the Askme picker (and reads Cancel), picking a level is the confirmation.
$("blRunAll").addEventListener("click", e => {
  const b = e.currentTarget;
  if (b.dataset.armed) return disarmRunAll();
  b.dataset.armed = "1"; b.textContent = "Cancel"; $("blRunAllAskme").hidden = false;
});
$("blRunAllAskme").addEventListener("click", e => {
  const pick = e.target.closest("button[data-askme]");
  if (!pick) return;
  const askme = pick.dataset.askme ? +pick.dataset.askme : null;
  $("blRunAll").disabled = true;
  $("blRunAllAskme").querySelectorAll("button").forEach(x => x.disabled = true);
  backlogCall(url => post(`${url}/run-all`, askme ? {askme} : {}).then(() => $("backlog").close())).then(disarmRunAll);
});
// The add form's points pick: "?" leaves the item to the estimator, a number skips it.
const paintPts = sel => sel.className = `pts p${sel.value || "x"}`;
$("blAdd").points.innerHTML = ptsOptions(null);
$("blAdd").points.addEventListener("change", e => paintPts(e.target));
$("blAdd").addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target, points = form.points.value, urgency = form.urgency.value;
  backlogCall(async url => {
    await post(url, {op: "add", text: form.text.value, urgency, ...(points && {points: +points})});
    form.reset(); paintPts(form.points);
    if (urgency === "now") $("backlog").close();
  });
});
// Images dropped or pasted on the add input upload to scrum/attachments/ and append a [screenshot: path] token.
const toBase64 = file => new Promise((ok, fail) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => fail(r.error);
  r.readAsDataURL(file);
});
let uploads = 0;
async function attachImages(files) {
  const form = $("blAdd"), add = form.querySelector("button[type=submit]"), url = `api/p/${enc(blProject())}/attachments`;
  $("blError").textContent = "";
  for (const file of files) {
    if (!file.type.startsWith("image/")) { $("blError").textContent = "Only images can be attached"; continue; }
    uploads++; add.disabled = $("blProject").disabled = true;  // a token must land in the project it uploaded to
    try {
      const {path} = await post(url, {data: await toBase64(file), type: file.type});
      const text = form.text.value, token = `[screenshot: ${path}]`, next = text + (text ? " " : "") + token;
      if (next.length > form.text.maxLength) $("blError").textContent = "Item is too long to add another screenshot";
      else form.text.value = next;
    } catch (err) { $("blError").textContent = err.message; }
    finally { if (!--uploads) add.disabled = $("blProject").disabled = false; }
  }
}
$("blAdd").text.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("blAdd").requestSubmit(); } });
$("blAdd").text.addEventListener("dragover", e => e.preventDefault());
$("blAdd").text.addEventListener("drop", e => {  // a text drag keeps the browser's own insert
  if (e.dataTransfer?.files.length) { e.preventDefault(); attachImages([...e.dataTransfer.files]); }
});
$("blAdd").text.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); attachImages(files); }
});
$("blList").addEventListener("click", e => {
  const b = e.target.closest("button[data-do]");
  if (!b) return;
  const index = +b.closest("li").dataset.i, act = b.dataset.do;
  // Run, Setup done and Delete ask once on the button itself; no native confirm().
  if ((act === "run" || act === "setup-done" || act === "delete") && !b.dataset.armed) {
    b.dataset.armed = "1"; b.textContent = {run: "Run?", "setup-done": "Setup done?", delete: "Delete?"}[act];
    b.classList.add(act === "delete" ? "danger" : "primary");
    return;
  }
  b.disabled = true;
  backlogCall(url => act === "run" ? post(`${url}/run`, {index}).then(() => $("backlog").close())
    : post(url, act === "delete" ? {op: "delete", index} : act === "setup-done" ? {op: "setup-done", index}
      : {op: "move", index, to: openIndexes().at(act === "up" ? 0 : -1)}));
});
$("blList").addEventListener("change", e => {
  const index = +e.target.closest("li").dataset.i;
  backlogCall(url => post(url, e.target.tagName === "SELECT"
    ? {op: "edit", index, points: e.target.value ? +e.target.value : null} : {op: "edit", index, text: e.target.value}));
});
$("blList").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "TEXTAREA") { e.preventDefault(); e.target.blur(); }
});
// Rows reorder by dragging the grip: the dropped item takes the target row's place (board.py move `to`).
const openIndexes = () => [...$("blList").querySelectorAll(":scope > li[data-i]")].map(li => +li.dataset.i);
let dragFrom = null;
$("blList").addEventListener("dragstart", e => {
  const li = e.target.closest?.(".grip") && e.target.closest("li");
  if (!li) return;
  dragFrom = +li.dataset.i; li.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setDragImage(li, 20, 20);
});
const clearDrop = () => $("blList").querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
$("blList").addEventListener("dragover", e => {
  const li = dragFrom !== null && e.target.closest("#blList > li[data-i]");
  if (!li) return;
  e.preventDefault();
  clearDrop();
  const to = +li.dataset.i;
  if (to !== dragFrom) li.classList.add(to < dragFrom ? "drop-before" : "drop-after");
});
$("blList").addEventListener("drop", e => {
  const li = dragFrom !== null && e.target.closest("#blList > li[data-i]");
  if (!li) return;
  e.preventDefault();
  const index = dragFrom, to = +li.dataset.i;
  if (to !== index) backlogCall(url => post(url, {op: "move", index, to}));
});
$("blList").addEventListener("dragend", () => {
  dragFrom = null; clearDrop();
  $("blList").querySelector(".dragging")?.classList.remove("dragging");
});
$("blManualList").addEventListener("change", async e => {
  const p = blProject(), box = e.target;
  box.disabled = true;
  $("blError").textContent = "";
  try { manuals[p] = await post(`api/p/${enc(p)}/manual-checks`, {index: +box.dataset.i}); }
  catch (err) { $("blError").textContent = err.message; box.checked = false; box.disabled = false; return; }
  renderBacklog();
});

// Digest: proposals from scrum/digests/<NNN>/proposals.json, shown as a log. serve.py's digest_auto has already applied,
// queued or skipped each one; Revert undoes an applied one through serve.py's digest_revert.
let digestData = null, digestText = "";
const dgProject = () => $("dgProject").value;
const diffHtml = (old, now) => `<div class="diff"><div><span class="note">Old</span><pre>${esc(old)}</pre></div><div><span class="note">New</span><pre>${esc(now)}</pre></div></div>`;
// One proposal as a log row. pending and rejected only appear in digests from before digest_auto.
const propRow = (digestId, p) => `<div class="prop" data-digest="${esc(digestId)}" data-pid="${esc(p.id)}">
    <span class="id">${esc(p.id)} <span class="chip ${esc(p.status)}">${esc(p.status)}</span></span>
    ${p.kind === "backlog" ? "" : `<span class="path">${esc(p.target)}</span>`}<span>${esc(p.why)}</span>
    ${p.kind === "backlog" ? `<span>${esc(p.backlog)}</span>` : ""}
    ${["skipped", "queued"].includes(p.status) && p.reason ? `<span class="note">${esc(p.reason)}</span>` : ""}
    ${p.kind === "backlog" ? "" : diffHtml(p.old ?? "", p.new ?? "")}
    ${p.status === "applied" && p.kind !== "backlog" ? `<div class="acts"><button class="btn" type="button" data-revert data-agent-hint="Puts the old text back through the path that applied it: a repo file gets its own commit after the contract tests, any other file is restored after a backup. It stays applied when the file has changed since.">Revert</button></div>` : ""}
    <p class="error" role="alert"></p></div>`;

function renderDigests() {
  $("dgNow").hidden = !projects.length;
  if (!projects.length) return $("dgList").innerHTML = '<p class="note">No projects</p>';
  const d = digestData;
  $("dgNow").disabled = !d || d.running || !(d.undigested || d.due);
  $("dgNow").textContent = d?.running ? "Digesting…" : "Digest now";
  if (!d) return $("dgList").innerHTML = '<p class="empty">loading…</p>';
  $("dgList").innerHTML = d.digests.map(g => `<section class="dg"><h3>Digest ${esc(g.id)} · ${g.jobs.length} job${g.jobs.length === 1 ? "" : "s"}</h3>
      ${g.error ? `<p class="error">${esc(g.error)}</p>` : g.proposals.map(p => propRow(g.id, p)).join("") || '<p class="empty">No proposals</p>'}</section>`).join("")
    || '<p class="empty">No digests</p>';
}

async function loadDigests() {
  const p = dgProject();
  if (!p) return renderDigests();
  const data = await getJson(`api/p/${enc(p)}/digests`, null, STALE);
  if (dgProject() !== p) return;  // a newer project pick is already loading
  if (!data?.digests) return $("dgError").textContent = data || "Couldn't load digests. Is serve.py running?";
  const text = JSON.stringify(data);
  if (text === digestText) return;  // unchanged: keep the DOM (and focus) as it is
  digestText = text; digestData = data;
  renderDigests();
}

async function digestCall(url, body) {
  $("dgError").textContent = "";
  try { await post(url, body); } catch (err) { $("dgError").textContent = err.message; }
  digestText = "";  // re-render even if nothing changed, so a failed click's buttons come back
  await loadDigests();
}

$("digestBtn").addEventListener("click", () => {
  pickProject($("dgProject"), "scrum.digestProject");
  digestData = null; digestText = ""; $("dgError").textContent = "";
  renderDigests();
  $("digest").showModal();
  loadDigests();
});
$("dgProject").addEventListener("change", e => {
  store.set("scrum.digestProject", e.target.value);
  digestData = null; digestText = ""; $("dgError").textContent = "";
  renderDigests(); loadDigests();
});
$("dgNow").addEventListener("click", () => {
  $("dgNow").disabled = true;
  digestCall(`api/p/${enc(dgProject())}/digest`, {});
});
$("dgList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-revert]");
  if (!b) return;
  const {digest, pid} = b.closest(".prop").dataset;
  // A poll may re-render the list while the post is in flight, so the row is looked up again afterwards.
  const row = () => [...$("dgList").querySelectorAll(".prop")].find(r => r.dataset.digest === digest && r.dataset.pid === pid);
  b.disabled = true;
  row().querySelector(".error").textContent = "";
  try {
    await post(`api/p/${enc(dgProject())}/digests/${enc(digest)}/${enc(pid)}`, {decision: "revert"});
  } catch (err) {
    const r = row();
    if (r) { r.querySelector(".error").textContent = err.message; r.querySelector("button[data-revert]")?.removeAttribute("disabled"); }
    return;
  }
  digestText = "";  // re-render from fresh data: the row now shows reverted and no button
  await loadDigests();
});

// Pipelines: the order is fixed by SKILL.md, so it lives here; everything about each agent comes from api/agents.
// Item format: string = agent, {agent, note} = agent with a note, array = parallel row, {step, note, hint} = step node,
// {tab, step, note, hint} = a dashed button that switches to that tab. The Orchestrator is drawn by the renderer.
const ORCH = {step: "Orchestrator", note: "main session", hint: "The /trevskills-scrum skill runs in the main Claude session, spawns every agent and moves the job between stages."};
const CHECK = {step: "Check gate", note: "test · lint · build", hint: "Runs the project's test, typecheck, lint and build commands; a failure goes back to the builder."};
const MERGE = {step: "PR / merge", note: "squash-merge", hint: "The orchestrator pushes scrum/<id>, opens a PR, waits for CI and squash-merges."};
const CODEX = {step: "Codex", note: "read-only", hint: "codex exec review runs alongside scrum-review-code; the reviewer confirms each finding and tags it (codex)."};
const PROMOTE = {tab: "standard", step: "→ Standard", note: ">100 lines · >3 files · UI · schema",
  hint: "A fast job is promoted to the standard pipeline when its check fails twice in a round, or after a passing check when the diff has more than 100 lines or a binary file, more than 3 files, a UI glob file, or a schema/migration/.sql/.env file. It then carries on as standard from where it is."};
const REVIEWS = ["scrum-review-security", "scrum-review-ux", "scrum-review-ui", "scrum-review-code"];
const PIPELINES = {
  fast: ["scrum-spec-writer", "scrum-builder", [CHECK, PROMOTE], "scrum-review-code", MERGE],
  standard: ["scrum-spec-writer", "scrum-builder", CHECK, REVIEWS, "scrum-approver", MERGE],
  debug: ["scrum-spec-writer", "scrum-debugger", {agent: "scrum-builder", note: "allowed files only"},
    {...CHECK, note: "test · lint · build + repro must pass", hint: "As the standard check gate, plus the debugger's repro test must now pass."}, REVIEWS, "scrum-approver", MERGE],
  bigboy: ["scrum-planner", {agent: "scrum-spec-writer", note: "per child"},
    {step: "Children", note: "each runs its own pipeline", links: ["fast", "standard", "debug"], hint: "Each child ticket runs as its own job, in its own pipeline, with its own PR."},
    {agent: "scrum-tracker", note: "after each child merge"}, "scrum-bigboy-reviewer",
    {step: "Fix ticket", note: "one, on gaps", hint: "When the final review finds gaps, one FIX ticket is added to the backlog."}],
  roadmap: [{step: "Draft", note: "roadmap.md · you approve once", hint: "/trevskills-scrum roadmap <brief> drafts roadmap.md as ordered phases of bigboy and standard steps; Trevor approves the draft once."},
    {step: "Steps", note: "one job per step", links: ["standard", "bigboy"], hint: "Each step runs as its own standard or bigboy job and stops only where that job would stop."},
    {step: "Next step", note: "after each merge", hint: "After a step's job merges, the next todo step starts with no prompt. A step stopped on needs-human shows as the roadmap's blocker."}]};
const MAINTENANCE = {
  "Run all": ["scrum-triager", {step: "Jobs", note: "backlog, one by one", hint: "After triage every open backlog item runs as a job, one after another."}],
  "Digest": ["scrum-digest-reader", "scrum-digester", {step: "Digest dialog", note: "log", hint: "Each proposal is applied automatically; an applied one can be reverted in the Digest dialog."}]};
// Single-pipeline tabs draw a loop from `from` back up to scrum-builder.
const LOOPS = {fast: ["scrum-review-code", "changes", "When the code review asks for CHANGES, the job goes back to the builder for another round."],
  standard: ["scrum-approver", "changes · rework", "When the approver decides CHANGES or REWORK, the job goes back to the builder for another round."]};
LOOPS.debug = LOOPS.standard;
const TABS = {all: "All", fast: "Fast", standard: "Standard", debug: "Debug", bigboy: "BigBoy", roadmap: "Roadmap", maintenance: "Maintenance"};
const ZOOMS = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150];
let agents = [], skills = null;
let adding = null;  // skill whose add POST is in flight; renderSkills() locks the picker while set
const modelLabel = a => a.name === "scrum-approver" ? `${a.model} · sonnet if all green` : a.model || "—";
let pipelineTab = "all", zoom = ZOOMS.includes(+store.get("scrum.zoom")) ? +store.get("scrum.zoom") : 100;
const tabBtn = k => `<button class="btn" type="button" data-tab="${k}">${TABS[k]}</button>`;
const stepNode = s => s.tab
  ? `<button class="node step" type="button" data-tab="${esc(s.tab)}" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span></button>`
  : `<div class="node step" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span>${s.links ? `<span class="links">${s.links.map(tabBtn).join("")}</span>` : ""}</div>`;
const agentNode = (name, note) => {
  const a = agents.find(x => x.name === name);
  return a ? `<button class="node" type="button" data-agent="${esc(a.name)}"><b>${esc(a.name)}</b><span>${esc(modelLabel(a))}${note ? ` · ${esc(note)}` : ""}</span></button>` : "";
};
const ARROW = '<div class="arrow" aria-hidden="true">↓</div>';
// The code reviewer always has Codex under it. `all` drops the promotion link.
const item = x => typeof x === "string" || x.agent
  ? (x === "scrum-review-code" ? `<div class="lane">${agentNode(x)}${stepNode(CODEX)}</div>` : agentNode(x.agent || x, x.note))
  : stepNode(x);
const row = (x, all) => {
  const xs = Array.isArray(x) ? x.filter(y => !(all && y.tab)) : [x];
  return xs.length > 1 ? `<div class="lanes">${xs.map(item).join("")}</div>` : item(xs[0]);
};
const chain = (seq, all) => seq.map(x => row(x, all)).join(ARROW);
const column = (title, body, top = "") => `<section class="pcol">${top}<h3>${esc(title)}</h3>${body}</section>`;
const charted = [...Object.values(PIPELINES), ...Object.values(MAINTENANCE)].flat(2).map(x => typeof x === "string" ? x : x.agent).filter(Boolean);

function renderFlow() {
  const tab = pipelineTab, loop = LOOPS[tab];
  $("pipeTabs").querySelectorAll("[role=tab]").forEach(b => {  // roving tabindex: Tab reaches the selected tab only
    b.setAttribute("aria-selected", b.dataset.tab === tab); b.setAttribute("tabindex", b.dataset.tab === tab ? 0 : -1);
  });
  const other = agents.map(a => a.name).filter(n => !charted.includes(n));
  $("flow").innerHTML = tab === "all"
    ? stepNode(ORCH) + '<div class="fan" aria-hidden="true"></div><div class="pcols">'
      + Object.entries(PIPELINES).map(([k, seq]) => column(TABS[k], chain(seq, true), ARROW)).join("") + "</div>"
    : tab === "maintenance"
    ? '<div class="pcols">' + Object.entries(MAINTENANCE).map(([h, seq]) => column(h, chain(seq))).join("") + "</div>"
      + (other.length ? column("Other", other.map(n => agentNode(n)).join("")) : "")
    : stepNode(ORCH) + ARROW + chain(PIPELINES[tab])
      + (loop ? `<div class="loop" data-from="${loop[0]}" data-agent-hint="${esc(loop[2])}"><span>${esc(loop[1])}</span></div>` : "");
  alignLoop();
}

// The loop's ends meet the middle of scrum-builder and its `from` node, whose heights change when a label wraps.
// Its left edge sits at the narrower node's right edge; it runs behind the wider one (nodes sit above it), and --tip
// moves the arrowhead out to the builder's own edge. Offsets are all inside #flow, so the chart's zoom cancels out.
function alignLoop() {
  const flow = $("flow"), loop = flow.querySelector(".loop"), node = n => flow.querySelector(`[data-agent="${n}"]`);
  const b = node("scrum-builder"), a = loop && node(loop.dataset.from);
  if (!b || !a || flow.hidden) return;
  const mid = n => n.offsetTop + n.offsetHeight / 2, right = n => n.offsetLeft + n.offsetWidth;
  const left = Math.min(right(b), right(a)) - 2;
  Object.assign(loop.style, {top: `${mid(b) - 1}px`, height: `${mid(a) - mid(b) + 2}px`, left: `${left}px`});
  loop.style.setProperty("--tip", `${right(b) - left}px`);
}
window.addEventListener("resize", () => { if ($("agents").open) alignLoop(); });

function setZoom(z) {
  zoom = z; store.set("scrum.zoom", z);
  $("flow").style.zoom = z / 100;
  $("agZoom").textContent = `${z}%`;
  $("agZoomOut").disabled = z === ZOOMS[0]; $("agZoomIn").disabled = z === ZOOMS[ZOOMS.length - 1];
  alignLoop();
}
function setTab(k, focus) {
  pipelineTab = k; renderFlow();
  if (focus) $("pipeTabs").querySelector(`[data-tab="${k}"]`).focus();
}
$("pipeTabs").innerHTML = Object.keys(TABS).map(k => `<button type="button" role="tab" aria-controls="flow" data-tab="${k}" aria-selected="false">${TABS[k]}</button>`).join("");
$("pipeTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });

function showAgents(name) {
  const a = name && agents.find(x => x.name === name);
  $("flow").hidden = !!a; $("agDetail").hidden = !a; $("agBack").hidden = !a; $("pipeBar").hidden = !!a || !agents.length;
  if (!a) return alignLoop();
  $("agDetail").innerHTML = `<dl class="facts">
      <dt>Agent</dt><dd><b>${esc(a.name)}</b></dd>
      <dt>Model</dt><dd>${esc(modelLabel(a))}</dd>
      <dt>Tools</dt><dd>${esc(a.tools || "—")}</dd>
      <dt>Description</dt><dd>${esc(a.description || "—")}</dd>
      <dt>Skills</dt><dd>${a.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("") || '<span class="empty">None</span>'}
        <button class="btn icon" id="agAdd" type="button" aria-label="Add skill" aria-expanded="false">+</button></dd></dl>
    <form id="agPicker" hidden><input type="text" id="agFilter" placeholder="Filter skills" aria-label="Filter skills" autocomplete="off">
      <div id="agSkills"></div></form>
    <div class="md">${window.marked ? marked.parse(a.body) : `<pre>${esc(a.body)}</pre>`}</div>`;
  $("agDetail").dataset.agent = a.name;
}

function renderSkills() {
  const a = agents.find(x => x.name === $("agDetail").dataset.agent), f = $("agFilter");
  if (!a || !f || $("agDetail").hidden) return;  // a late call (addSkill's catch) after Back or a reopen: no live picker
  const q = f.value.trim().toLowerCase();
  const left = (skills || []).filter(s => !a.skills.includes(s.name));
  const hits = left.filter(s => s.name.toLowerCase().includes(q));
  $("agSkills").innerHTML = !skills ? '<p class="empty">loading…</p>'
    : hits.map(s => `<button class="btn" type="button" data-skill="${esc(s.name)}"${adding ? " disabled" : ""}>${s.name === adding ? "Adding…" : esc(s.name)}</button>`).join("")
      || `<p class="empty">${left.length ? "No match." : "No other skills installed."}</p>`;
}

async function addSkill(skill) {
  if (adding) return;  // one add in flight at a time, even across filter re-renders
  const name = $("agDetail").dataset.agent;
  $("agError").textContent = ""; adding = skill; renderSkills();
  try {
    const updated = await post(`api/agents/${enc(name)}/skills`, {skill});
    adding = null;
    agents = agents.map(x => x.name === name ? updated : x);
    renderFlow(); showAgents(name);
  } catch (err) { adding = null; $("agError").textContent = err.message; renderSkills(); }
}

// AI-Settings: items come from api/ai-settings; precedence is managed > local > project > user. Every `editable` item
// (everything outside managed scope) gets a textarea; a JSON item must parse, and a permissions or hooks change shows an
// Old/New diff and needs a second click. serve.py backs up every save, and Undo restores the newest backup. Managed
// items are a read-only <pre>.
const AI_GROUPS = [["global", "Global"], ["registered", "Registered"], ["mac", "This Mac"]];
const AI_LOADING = '<p class="empty">loading…</p>';
let aiData = null, aiCat = "", aiItem = null;  // aiItem: the editable item on screen, with its last saved version
let aiOpenedId = "";  // data-id of the last item opened, so Back can refocus its row
// Moves focus to el only when focus was lost (body, the dialog, a removed node, or `also`), never away from where the user went.
const aiRefocus = (el, also) => { const a = document.activeElement; if (el && (!a || a === document.body || a === $("aiSettings") || a === also || !a.isConnected)) el.focus(); };
let aiFindings = null;  // the last Security scan; it covers every scope, so a scope change keeps it
let aiAudit = null, aiOff = new Set();  // the current scope's audit, and rows Disabled on this visit (they offer Undo)
let aiScopeId = "";  // the scope last loaded, so a blocked scope pick can put #aiScope back
const aiFail = () => { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't load AI settings. Is serve.py running?"; };
const aiRow = it => `<button class="node${it.status === "overridden" ? " over" : ""}" type="button" data-id="${esc(it.id)}">
    <b>${esc(it.name)}</b><span><span class="skill">${esc(it.scope)}</span>${it.status ? ` <span class="chip ${it.status === "wins" ? "PASS" : "pending"}">${esc(it.status)}</span>` : ""}</span>
    <span class="path">${esc(it.path)}</span></button>`;

function renderAi() {
  $("aiBack").hidden = true;
  $("aiCats").innerHTML = aiData.categories.map(c => `<button type="button" data-cat="${esc(c.key)}" aria-pressed="${c.key === aiCat}"><span>${esc(c.label)}</span><span>${c.count}</span></button>`).join("")
    + `<button type="button" data-cat="security" aria-pressed="${aiCat === "security"}" data-agent-hint="Scans every scope's config files for risky hooks, allow rules, skills and MCP secrets. Reads files only."><span>Security</span><span>${aiFindings ? aiFindings.length : ""}</span></button>`
    + `<button type="button" data-cat="audit" aria-pressed="${aiCat === "audit"}" data-agent-hint="Usage, always-loaded tokens and problems per item, with a Keep / Improve / Retire / Merge verdict. Disable flips one settings key and can be undone."><span>Audit</span><span>${aiAudit ? aiAudit.rows.length : ""}</span></button>`;
  if (aiCat === "security") return renderFindings();
  if (aiCat === "audit") return renderAudit();
  const cat = aiData.categories.find(c => c.key === aiCat);
  $("aiList").innerHTML = cat.items.map(aiRow).join("") || '<p class="empty">None</p>';
}

async function aiLoadScope() {
  const sid = aiScopeId = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = true; $("aiList").innerHTML = AI_LOADING;
  aiAudit = null; aiOff.clear();
  const data = await getJson(`api/ai-settings?scope=${enc(sid)}`, null);
  if ($("aiScope").value !== sid) return;  // a newer scope pick is already loading
  if (!data) return aiFail();
  aiData = data;
  if (!["security", "audit"].includes(aiCat) && !aiData.categories.some(c => c.key === aiCat)) aiCat = aiData.categories[0].key;
  renderAi();
}

$("aiBtn").addEventListener("click", async () => {
  $("aiError").textContent = ""; $("aiScope").innerHTML = ""; $("aiCats").innerHTML = ""; $("aiBack").hidden = true;
  $("aiList").innerHTML = AI_LOADING; aiData = null; aiCat = ""; aiScopeId = ""; aiFindings = null; aiAudit = null; aiOff.clear();
  $("aiSettings").showModal();

  if (!scopes) return aiFail();
  $("aiScope").innerHTML = AI_GROUPS.filter(([g]) => scopes[g]?.length).map(([g, label]) => `<optgroup label="${label}">${
    scopes[g].map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
  $("aiScope").value = "global";

// A <select> has already changed when `change` fires, so a blocked pick puts the loaded scope back.
$("aiScope").addEventListener("change", () => {

// Leaving an editor with unsaved text asks once, like backlog Run/Delete: the first Back, ✕, backdrop click, Escape,
// category click or scope pick only warns, and the second (through any of them) goes through. Typing again re-arms it.
function aiBlockLeave() {
  const form = $("aiEdit");
  if (!form?.isConnected || !aiItem || $("aiText").value === aiItem.baseline || form.dataset.leave) return false;
  form.dataset.leave = "1"; $("aiError").textContent = "Unsaved changes. Press again to discard.";
  return true;
}
$("aiSettings").addEventListener("cancel", e => { if (aiBlockLeave()) e.preventDefault(); });
$("aiBack").addEventListener("click", () => {
  if (aiBlockLeave()) return;
  $("aiError").textContent = "";
  renderAi();  // hides Back while it still has focus, so Back itself counts as lost focus
  aiRefocus([...$("aiList").querySelectorAll("button[data-id]")].find(x => x.dataset.id === aiOpenedId)
    || $("aiCats").querySelector('[aria-pressed="true"]'), $("aiBack"));
});
$("aiCats").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b || !aiData || aiBlockLeave()) return;
  aiCat = b.dataset.cat; $("aiError").textContent = "";
  if (aiCat === "security") aiFindings = null;  // every click runs a fresh scan
  aiAudit = null; aiOff.clear();  // leaving or re-entering Audit reloads it and drops Undo
  renderAi();
});
const findingRow = f => `<div class="node finding"><span class="chip ${f.severity === "low" ? "pending" : esc(f.severity)}">${esc(f.severity)}</span>
    <b>${esc(f.file)}${f.line == null ? "" : `:${esc(f.line)}`}</b>${f.rule ? ` <span class="note">${esc(f.rule)}</span>` : ""}<span class="path">${esc(f.fix)}</span></div>`;
async function renderFindings() {
  if (aiFindings) {
    $("aiList").innerHTML = aiFindings.map(findingRow).join("") || '<p class="empty">No risky config found</p>';
    return;
  }
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson("api/ai-settings/security", null);
  if (aiCat !== "security" || !$("aiBack").hidden || aiFindings) return;  // moved on, or a newer scan already landed
  if (!data?.findings) { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't run the security scan. Is serve.py running?"; return; }
  aiFindings = data.findings;
  renderAi();
}
const AUDIT_GROUPS = ["Retire", "Merge", "Improve", "Keep"];
const auditFlag = f => f.startsWith("overlap:") ? `overlap: ${aiAudit.rows.find(r => r.id === f.slice(8))?.name ?? "?"}` : f;
const auditRow = r => `<div class="node audit"><b>${esc(r.name)}</b><span><span class="skill">${esc(r.scope)}</span> ${esc(r.category)}</span>
    <span>uses ${r.lifetime ?? "—"} · recent ${r.recent ?? "—"} · ${r.tokens == null ? "—" : `~${r.tokens}`} tok</span>${r.flags.length ? `<span>${esc(r.flags.map(auditFlag).join(", "))}</span>` : ""}
    <span class="acts">${researchActs(r)}${aiOff.has(r.id) ? `<span class="note" role="status">Disabled</span><button class="btn" type="button" data-toggle="enable" data-row="${esc(r.id)}">Undo</button>`
      : r.disable ? `<button class="btn" type="button" data-toggle="disable" data-row="${esc(r.id)}">Disable</button>` : ""}</span>
    <span class="path">${esc(r.verdict.startsWith("Merge") ? `${r.verdict}. ${r.reason}` : r.reason)}</span></div>`;
// Research this: a read-only claude run per row whose log holds the suggested edits; Edit opens the 2/5 editor to apply them.
const researchActs = r => {
  const rs = r.research, log = rs && `p/${enc(rs.project)}/${esc(rs.log)}`;
  return (rs?.alive ? `<span class="note" role="status">Researching…</span><a href="${log}" target="_blank" rel="noopener">log</a>`
      : rs ? `<a href="${log}" target="_blank" rel="noopener">Suggestions</a>` : "")
    + `<button class="btn" type="button" data-research="${esc(r.id)}"${rs?.alive ? " disabled" : ""} data-agent-hint="Starts a read-only claude run that compares this item with current Anthropic docs and top repos and replies with suggested edits. It changes no files.">Research this</button>`
    + (r.editable ? `<button class="btn" type="button" data-id="${esc(r.id)}">Edit</button>` : "");
};
// Called by poll(): flips a row from Researching… to Suggestions once its run has ended; no extra polling.
function auditRunsChanged() {
  let changed = false;
  for (const r of aiAudit?.rows || []) {
    const run = r.research && runs[`${r.research.project}/${r.research.key}`];
    if (run && run.alive !== r.research.alive) { r.research.alive = run.alive; changed = true; }
  }
  if (changed && aiCat === "audit" && $("aiBack").hidden && $("aiSettings").open) renderAudit();
}
async function renderAudit() {
  if (aiAudit) {
    $("aiList").innerHTML = AUDIT_GROUPS.map(g => [g, aiAudit.rows.filter(r => r.verdict.split(" ")[0] === g)]).filter(([, rows]) => rows.length)
      .map(([g, rows]) => `<h3>${g} (${rows.length})</h3>${rows.map(auditRow).join("")}`).join("") || '<p class="empty">Nothing to audit</p>';
    return;
  }
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson(`api/ai-settings/audit?scope=${enc(sid)}`, null, {});
  if (aiCat !== "audit" || $("aiScope").value !== sid || !$("aiBack").hidden || aiAudit) return;  // moved on while loading
  if (!data?.rows) { $("aiList").innerHTML = ""; $("aiError").textContent = data ? STALE : "Couldn't run the audit. Is serve.py running?"; return; }
  aiAudit = data;
  renderAi();
}
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-research]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.research;
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const out = await post("api/ai-settings/research", {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows.find(r => r.id === id).research = {...out, alive: true};
    if ($("aiBack").hidden && aiCat === "audit") renderAudit();  // an open editor keeps its unsaved text; Back re-renders
  } catch (err) {
    if (aiAudit !== audit) return;
    b.disabled = false;
    $("aiError").textContent = err.status === 409 && /already running/.test(err.message) ? "Research is already running for this item."
      : err.status === 409 ? err.message : "Couldn't start research. Is serve.py running?";
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-toggle]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.row, on = b.dataset.toggle === "enable";
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const row = await post(`api/ai-settings/${b.dataset.toggle}`, {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows = audit.rows.map(r => r.id === id ? row : r);
    on ? aiOff.delete(id) : aiOff.add(id);
    renderAudit();
    aiRefocus([...$("aiList").querySelectorAll("button[data-toggle]")].find(x => x.dataset.row === id)
      || [...$("aiList").querySelectorAll("button[data-research]")].find(x => x.dataset.research === id));
  } catch {
    if (aiAudit !== audit) return;
    b.disabled = false; $("aiError").textContent = "Couldn't change this setting. Is serve.py running?";
    aiRefocus(b);
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const sid = $("aiScope").value;
  aiOpenedId = b.dataset.id;
  $("aiError").textContent = ""; $("aiBack").hidden = false; $("aiList").innerHTML = AI_LOADING;
  aiRefocus($("aiBack"));
  const it = await getJson(`api/ai-settings/item?id=${enc(b.dataset.id)}`, null);
  if ($("aiScope").value !== sid || $("aiBack").hidden) return;  // moved on while loading
  if (!it) return aiFail();
  aiItem = it.editable ? it : null;
  $("aiList").innerHTML = `<dl class="facts"><dt>Name</dt><dd><b>${esc(it.name)}</b></dd><dt>Scope</dt><dd><span class="skill">${esc(it.scope)}</span></dd>
    <dt>Path</dt><dd>${esc(it.path)}</dd></dl>${it.editable ? `<form id="aiEdit">
    <textarea id="aiText" spellcheck="false" aria-label="${esc(it.name)} content">${esc(it.content)}</textarea><div id="aiDiff"></div>
    <div><button class="btn primary" id="aiSave" type="submit" disabled>Save</button>
    <button class="btn" id="aiUndo" type="button" hidden>Undo</button><span class="note" id="aiStatus" role="status"></span></div></form>`
    : `<pre>${esc(it.content)}</pre>`}`;
  if (aiItem) aiItem.baseline = $("aiText").value;  // the textarea's own copy: browsers turn \r\n into \n
});
// Save and Undo both answer with the fresh item; a reply for an item the user already left is dropped.
async function aiWrite(route, body, busy, fail) {
  const form = $("aiEdit"), item = aiItem;
  delete form.dataset.leave; $("aiError").textContent = ""; $("aiStatus").textContent = busy; $("aiSave").disabled = $("aiUndo").disabled = true;
  try {
    const it = await post(`api/ai-settings/${route}`, {id: item.id, ...body});
    if (!form.isConnected) return;
    aiItem = Object.assign(it, {baseline: it.content.replace(/\r\n?/g, "\n")});
    return true;
  } catch (err) {
    if (!form.isConnected) return;
    $("aiStatus").textContent = "";
    $("aiError").textContent = err.status === 409 ? "This file changed on disk. Go back and reopen it." : err.status === 400 ? err.message : fail;
  } finally {
    if (form.isConnected) { $("aiSave").disabled = $("aiText").value === aiItem.baseline; $("aiUndo").disabled = false; }
  }
}
// A save that changes what Claude Code may run (a hook or plugin entry, an MCP server's command/args/type/url, or a
// settings file's permissions/hooks/statusLine/apiKeyHelper/otelHeadersHelper/awsAuthRefresh/awsCredentialExport)
// asks once on the Save button itself, like backlog Run/Delete; serve.py refuses it without confirm too.
const AI_JSON = ["settings", "hooks", "mcp", "plugins"];
const AI_GUARD_KEYS = {mcp: ["command", "args", "type", "url"],
  settings: ["permissions", "hooks", "statusLine", "apiKeyHelper", "otelHeadersHelper", "awsAuthRefresh", "awsCredentialExport"]};
const aiGuarded = (cat, old, now) => cat === "hooks" || cat === "plugins" ? JSON.stringify(old) !== JSON.stringify(now)
  : (AI_GUARD_KEYS[cat] || []).some(k => JSON.stringify(old?.[k]) !== JSON.stringify(now?.[k]));
function aiDisarm() {
  delete $("aiEdit").dataset.armed; $("aiDiff").innerHTML = "";
  $("aiSave").textContent = "Save"; $("aiSave").classList.remove("danger");
}
$("aiList").addEventListener("input", e => {
  if (e.target.id !== "aiText") return;
  $("aiSave").disabled = e.target.value === aiItem.baseline;
  if ($("aiEdit").dataset.armed) aiDisarm();
  if ($("aiEdit").dataset.leave) { delete $("aiEdit").dataset.leave; $("aiError").textContent = ""; }
});
$("aiList").addEventListener("submit", async e => {
  e.preventDefault();
  const form = $("aiEdit"), text = $("aiText").value, body = {content: text, version: aiItem.version};
  if (AI_JSON.includes(aiItem.category)) {
    let now;
    try { now = JSON.parse(text); } catch (err) { $("aiError").textContent = `Invalid JSON: ${err.message}`; return; }
    if (form.dataset.armed) body.confirm = true;
    else if (aiGuarded(aiItem.category, JSON.parse(aiItem.baseline), now)) {
      form.dataset.armed = "1"; $("aiError").textContent = "";
      $("aiSave").textContent = "Confirm save"; $("aiSave").classList.add("danger");
      $("aiDiff").innerHTML = diffHtml(aiItem.baseline, text); $("aiSave").scrollIntoView({block: "end"});
      return;
    }
  }
  const ok = await aiWrite("save", body, "Saving…", "Couldn't save. Is serve.py running?");
  if (form.isConnected) aiDisarm();
  if (!ok) return;
  if (AI_JSON.includes(aiItem.category)) {  // reformat to the saved file, unless the user typed on while it saved
    if ($("aiText").value === text) { $("aiText").value = aiItem.content; aiItem.baseline = $("aiText").value; }
    $("aiSave").disabled = $("aiText").value === aiItem.baseline;
  }
  $("aiStatus").textContent = "Saved"; $("aiUndo").hidden = false;
});
$("aiList").addEventListener("click", async e => {
  if (e.target.id !== "aiUndo") return;
  if (await aiWrite("undo", {version: aiItem.version}, "Undoing…", "Couldn't undo. Is serve.py running?")) {
    $("aiText").value = aiItem.content; aiItem.baseline = $("aiText").value; $("aiSave").disabled = true; aiDisarm();
    $("aiStatus").textContent = "Undone"; $("aiUndo").hidden = true;
  }
});

  if ((e.target === d || e.target.closest(".close")) && !(d.id === "aiSettings" && aiBlockLeave())) d.close();
}));

// The colour dialog: 12 hue swatches (the projectHues slots), a custom #rrggbb and Reset. Each POSTs
// api/p/<project>/colour, which writes `- Colour:` to that project's scrum/project.md, so every browser sees it.
const HUE_NAMES = ["Red", "Orange", "Yellow", "Chartreuse", "Green", "Spring green", "Cyan", "Azure", "Blue", "Violet", "Magenta", "Rose"];
// hsl(h 50% 42%), the tag's own colour, as #rrggbb for the colour input.
const hueHex = h => "#" + [0, 8, 4].map(n => { const k = (n + h / 30) % 12, v = .42 - .5 * Math.min(.42, .58) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
// Repaints every tag in the page (board, viewer tabs) and the open colour dialog from projectColour.
function paintTags() {
  document.querySelectorAll(".tag[data-project]").forEach(t => t.setAttribute("style", tagStyle(t.dataset.project)));
  if ($("colour")?.open) renderColour();
}
function renderColour() {
  const p = $("colour").dataset.project, c = projectColour[p], cur = typeof c === "string" ? null : Number.isInteger(c) ? c : hue(p);
  const box = $("colourSwatches");
  if (!box) return;
  if (!box.childElementCount) box.innerHTML = HUE_NAMES.map((n, i) => `<button type="button" data-hue="${i * 30}" style="--h:${i * 30}" aria-label="${n} (${i * 30}°)"></button>`).join("");
  box.querySelectorAll("[data-hue]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.hue) === cur)));
  const input = $("colourInput");
  if (input && document.activeElement !== input) input.value = typeof c === "string" ? c : hueHex(cur);
}
function openColour(p) {
  const d = $("colour");
  if (!d) return;
  d.dataset.project = p;
  colourSeq++;
  $("colourTitle").textContent = `${p} colour`;
  $("colourError").textContent = "";
  renderColour();
  if (!d.open) d.showModal();
}
// colourSeq counts opens: a reply that lands after the dialog closed or reopened (maybe on another project) still
// repaints the tags, but never closes or writes an error into the dialog now showing.
let colouring = false, colourSeq = 0;
async function saveColour(colour) {
  const p = $("colour").dataset.project, seq = colourSeq;
  if (colouring || !p) return;
  colouring = true;
  const same = () => seq === colourSeq && $("colour").open;
  try {
    const out = await post(`api/p/${enc(p)}/colour`, {colour});
    projectColour[p] = out.colour;
    paintTags();
    if (same()) $("colour").close();
  } catch (err) {
    if (same()) $("colourError").textContent = err.message;
  } finally {
    colouring = false;
  }
}
$("colourSwatches").addEventListener("click", e => { const b = e.target.closest("[data-hue]"); if (b) saveColour(Number(b.dataset.hue)); });
$("colourInput").addEventListener("change", e => saveColour(e.target.value));
$("colourReset").addEventListener("click", () => saveColour(null));

// Pinned by test_dashboard_routing.
function routingText(s) {
  return `Claude 5h ${pct(s.claude?.["5h"])} · wk ${pct(s.claude?.weekly)} · Codex 5h ${pct(s.codex?.["5h"])} · wk ${pct(s.codex?.weekly)}`;
}
// The Usage dialog's rows, one per AI the scrum calls. Pinned by test_dashboard_routing.
function usageRows(s) {
  const c = s.claude || {}, x = s.codex || {}, j = s.jev || {};
  const cell = (v, reset) => `<td${reset ? ` title="resets ${esc(when(reset))}"` : ""}>${esc(v)}</td>`;
  const row = (ai, five, week, latest) => `<tr><th scope="row">${ai}</th>${five}${week}<td>${esc(latest)}</td></tr>`;
  return row("Claude", cell(pct(c["5h"]), c["5h_resets_at"]), cell(pct(c.weekly), c.weekly_resets_at), when(c.as_of))
    + row("Codex", cell(pct(x["5h"])), cell(pct(x.weekly)), "—")
    + row("Jev", cell("—"), cell("—"), `${Number.isInteger(j.today) ? j.today : "—"} today · last ${when(j.last)}`);
}
// The Usage dialog's window scorecard rows: one per project per window, 5h then 7d. Pinned by test_dashboard_routing.
function windowRows(list) {
  const num = v => typeof v === "number" && isFinite(v), n = (v, one) => `${num(v) ? v : "—"} ${one}${v === 1 ? "" : "s"}`;
  return list.map(({project, windows}) => [["five_hour", "5h"], ["seven_day", "7d"]].map(([key, label]) => {
    const c = windows?.[key], head = `<tr><th scope="row">${esc(project)}</th>`;
    if (!c) return `${head}<td>${esc(`Last ${label} window: No scorecard yet`)}</td></tr>`;
    const text = `Last ${label} window: ${n(c.points_done, "point")}, ${pct(c.budget?.used_pct)} budget, `
      + `${num(c.headline) ? `${Math.round(c.headline * 100) / 100}/%` : "—"}. First pass `
      + `${pct(num(c.first_pass_rate) ? c.first_pass_rate * 100 : null)}, waste ${pct(c.wasted_pct)}, ${n(c.escapes, "escape")}`;
    return `${head}<td title="ended ${esc(when(c.resets_at))}">${esc(text)}</td></tr>`;
  }).join("")).join("");
}
// Status reads a rollout file, usage.json and every jev.log: too much for the 2 s poll. A 404 (older
// serve.py) or an error hides the button; an open Usage dialog keeps its last rows until a status arrives.
let usage = null;
async function loadRouting() {
  const s = await getJson("api/routing-status", null);
  $("routing").hidden = !s;
  if (!s) return;
  usage = s;
  $("routing").textContent = routingText(s);
  $("usageRows").innerHTML = usageRows(s);
}
// Scorecards change once per window, so they are fetched only when the dialog opens. A reply that lands after the
// dialog closed, the filter changed or a newer open started is dropped.
let windowsSeq = 0;
async function loadWindows() {
  const seq = ++windowsSeq, f = filter, list = f ? [f] : projects;
  const res = await Promise.all(list.map(p => getJson(`api/p/${enc(p)}/windows`, null)));
  const body = $("windowRows");
  if (!body || seq !== windowsSeq || filter !== f || !$("usage").open) return;
  body.innerHTML = windowRows(list.map((project, i) => ({project, windows: res[i]})));
}
$("routing").addEventListener("click", () => { if (usage) { $("usage").showModal(); loadWindows(); } });
// The Rank dialog: one row per project in projects (rank) order. A poll re-renders it only when the order changed, and
// keeps keyboard focus on the same project's button.
function renderRank(keep) {
  const list = $("rankList");
  if (!list) return;
  const want = projects.join("\n");
  if (list.dataset.list === want && list.childElementCount) return;
  const a = document.activeElement;
  keep = keep || (list.contains(a) && a.dataset.rank ? [a.dataset.rank, a.dataset.dir] : null);
  list.dataset.list = want;
  const btn = (p, dir, label, off) => `<button class="btn" type="button" data-rank="${esc(p)}" data-dir="${dir}" aria-label="Move ${esc(p)} ${dir}"${off ? " disabled" : ""}>${label}</button>`;
  list.innerHTML = projects.length ? projects.map((p, i) => `<li><span class="rnum">${i + 1}.</span><span class="rname">${esc(p)}</span>`
    + btn(p, "up", "↑", i === 0) + btn(p, "down", "↓", i === projects.length - 1) + "</li>").join("") : `<li class="note">No projects yet.</li>`;
  if (!keep) return;
  const mine = [...list.querySelectorAll("button[data-rank]")].filter(b => b.dataset.rank === keep[0] && !b.disabled);
  (mine.find(b => b.dataset.dir === keep[1]) || mine[0])?.focus();  // the pressed one, or its other button once that is disabled
}
let ranking = false;
$("rankBtn").addEventListener("click", () => { $("rankError").textContent = ""; renderRank(); $("rank").showModal(); });
$("rankList").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-rank]");
  if (!btn || btn.disabled || ranking) return;
  const name = btn.dataset.rank, dir = btn.dataset.dir;
  ranking = true;
  try {
    const out = await post("api/projects/rank", {name, to: projects.indexOf(name) + (dir === "up" ? -1 : 1)});
    projects = out.map(p => p.name);
    $("rankError").textContent = "";
    renderRank([name, dir]);
    renderSelect($("filter"), filter, true);
  } catch (err) {
    $("rankError").textContent = err.message;  // the list stays as the last poll had it
  } finally {
    ranking = false;
  }
});
$("cooldown").addEventListener("click", async e => {
  const btn = e.currentTarget, focused = document.activeElement === btn;  // disabling drops focus; give it back
  btn.disabled = true;
  try {
    const out = await post("api/cooldown", {on: !btn.dataset.on});
    renderCooldown({cooldown: out.cooldown, sessions: Number(btn.dataset.sessions) || 0});
  } catch (err) {
    $("cooldownState").textContent = err.message;
  } finally {
    btn.disabled = false;
    if (focused) btn.focus();
  }
});

poll();
setInterval(single(poll), 2000);
loadRouting();
setInterval(single(loadRouting), 60000);

// Scrum sounds are afplay runs in board.py/serve.py, so the setting lives server-side too: POST /api/volume.
let level = 100, muted = false;
function readVolume() {
  const v = store.get("scrum.volume");
  level = /^\d{1,3}$/.test(v) && Number(v) <= 100 ? Number(v) : 100;
  muted = store.get("scrum.muted") === "1";
}
function renderVolume() {
  const btn = $("volume"), input = $("volumeLevel"), off = muted || !level;
  if (btn) {
    btn.setAttribute("aria-pressed", String(off));
    btn.setAttribute("aria-label", off ? "Unmute sounds" : "Mute sounds");
  }
  if (input && input.value !== String(level)) input.value = String(level);
}
function sendVolume() {
  post("api/volume", {level, muted}).catch(() => {});  // an older serve.py 404s: the UI still works, no error shown
}
$("volume").addEventListener("click", () => {
  muted = !muted;
  store.set("scrum.muted", muted ? "1" : "");
  renderVolume();
  sendVolume();
});
$("volumeLevel").addEventListener("input", e => {
  level = Number(e.currentTarget.value);
  muted = false;
  store.set("scrum.volume", String(level));
  store.set("scrum.muted", "");
  renderVolume();
});
$("volumeLevel").addEventListener("change", () => {
  sendVolume();
});
readVolume();
renderVolume();
if (store.get("scrum.volume") || store.get("scrum.muted")) sendVolume();
</script>
</body>
</html>
