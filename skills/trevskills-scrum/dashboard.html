<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevskills Scrum</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#76736b;--line:#e3e0d8;--accent:#2457d6;
  --pass:#1e8449;--changes:#c4520f;--invalid:#7a3fd6;--human:#d32f2f;--pending:#c8c4ba;
  --p1:#1e8449;--p2:#2f9e6a;--p3:#1f8fa6;--p5:#d4a514;--p8:#d9661a;--p13:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#1d1c1a;--ink:#ecebe6;--muted:#9b978e;--line:#2f2d2a;--pending:#55524c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px}
h1{font-size:16px;margin:0}
#status{color:var(--muted);font-size:12px}
main{display:grid;gap:12px;padding:0 16px 16px;overflow-x:auto}
.col h2 span{white-space:nowrap}
.col h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.col.human h2{color:var(--human)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card.human{border:2px solid var(--human);box-shadow:0 0 0 3px color-mix(in srgb,var(--human) 15%,transparent)}
.id{font:12px ui-monospace,monospace;color:var(--muted)}
.title{display:block;margin:2px 0 4px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.row b{font:600 11px ui-monospace,monospace;color:var(--muted);width:22px}
.chip{font-size:11px;padding:1px 5px;border-radius:99px;color:#fff;background:var(--pending)}
.chip.PASS{background:var(--pass)}.chip.CHANGES,.chip.FAIL{background:var(--changes)}.chip.INVALID{background:var(--invalid)}
.chip.pending{background:transparent;color:var(--muted);border:1px dashed var(--pending)}
.meta{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.reason{display:block;font-size:12px;color:var(--human);margin-top:6px}
.stale{color:var(--changes)}
.empty{color:var(--muted);font-size:12px}
dialog{width:min(900px,94vw);max-height:88dvh;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:#0007}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.tabs button,#aiCats button{font:12px ui-monospace,monospace;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
.tabs button[aria-pressed="true"],#aiCats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .close{margin-left:auto}
article{padding:4px 20px 20px;overflow-wrap:anywhere}
article pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:6px;white-space:pre-wrap}
article a{color:var(--accent)}
body:has(dialog[open]){overflow:hidden}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--human);border-color:var(--human);color:#fff}
.btn.danger-outline{background:transparent;border-color:var(--human);color:var(--human)}
.card.aborted{opacity:.55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{min-width:32px;padding:6px 8px}
#filter{margin-left:auto}
#filter,#blProject,#aiScope{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:32px}
.tag{display:inline-block;font:600 10px system-ui,sans-serif;letter-spacing:.03em;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;background:hsl(var(--h) 50% 42%)}
header{flex-wrap:wrap}
.running{display:block;font-size:12px;color:var(--accent);margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:0}
.error{font-size:12px;color:var(--human);margin:0}
.error:empty{display:none}
#actions{display:grid;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.waiting{border:1px solid var(--human);border-radius:8px;padding:8px 12px;background:color-mix(in srgb,var(--human) 8%,var(--card))}
.waiting b{color:var(--human)}.waiting p{margin:4px 0 0;overflow-wrap:anywhere}
#actions:empty{display:none}
#actions form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{flex:1 1 320px;min-height:64px;resize:vertical}
#backlog article{display:grid;gap:10px;padding-top:14px}
#blAdd{display:flex;gap:6px}
#blAdd input{flex:1;min-width:0}
#blList{list-style:none;margin:0;padding:0}
#blList li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#blList li input{flex:1;min-width:0}
.pts{font:600 12px ui-monospace,monospace;width:46px;min-height:32px;border:0;border-radius:6px;color:#fff;background:var(--pending);text-align:center;cursor:pointer}
.pts.p1{background:var(--p1)}.pts.p2{background:var(--p2)}.pts.p3{background:var(--p3)}.pts.p5{background:var(--p5);color:#1c1b19}
.pts.p8{background:var(--p8)}.pts.p13{background:var(--p13)}
#agents,#aiSettings{width:min(1400px,96vw);max-width:none;max-height:92dvh;overflow-x:hidden;overscroll-behavior:contain}
#agents .tabs,#aiSettings .tabs{align-items:center}
#agents [hidden],#aiSettings [hidden]{display:none}
#agents .tabs button,#agents .btn,#aiSettings .tabs button,#aiCats button{min-height:44px;min-width:44px}
#agents article{display:grid;gap:10px;padding-top:14px}
#flow{display:grid;grid-template-columns:minmax(0,1fr) 44px;position:relative}
#flow>*{grid-column:1;min-width:0}
.node{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:44px;text-align:left;
  font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.node{cursor:pointer;touch-action:manipulation}
button.node:hover,button.node:focus-visible{border-color:var(--accent);outline:none}
.node b{font:600 13px ui-monospace,monospace;overflow-wrap:anywhere}
.node span{font-size:12px;color:var(--muted)}
.node.step{background:var(--bg);border-style:dashed}
#flow>.node{width:auto;max-width:100%;justify-self:center}
.arrow{text-align:center;color:var(--muted);font-size:16px;line-height:24px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:start}
.lane{display:grid;gap:4px}
#flow>.loop{grid-column:2;position:relative;border:2px solid var(--changes);border-left:0;border-radius:0 8px 8px 0;margin:21px 8px 21px 0}
.loop::before{content:"";position:absolute;left:var(--tip,-2px);top:-7px;border:6px solid transparent;border-right:8px solid var(--changes);border-left:0}
.loop span{position:absolute;top:50%;right:4px;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;color:var(--changes)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.facts dt{color:var(--muted);font-size:12px;line-height:44px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.skill{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
#agPicker{display:grid;gap:8px}
#agSkills{display:flex;flex-wrap:wrap;gap:6px}
.md{border-top:1px solid var(--line)}
#aiScope{flex:1 1 160px;min-width:0;max-width:420px;min-height:44px;text-overflow:ellipsis}
#aiSettings>.error{padding:10px 20px 0}
#aiBody{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
#aiCats{display:grid;gap:4px;padding:14px 10px}
#aiCats button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#aiList{display:grid;gap:6px;padding-top:14px}
.node .chip{color:#fff}.node .chip.pending{color:var(--muted)}
.node .path{flex-basis:100%;overflow-wrap:anywhere}
.node.over{opacity:.55}
@media (max-width:640px){#agents,#aiSettings{width:100%;max-height:100dvh;border-radius:0;border-inline:0}#agents article,#aiSettings article{padding-inline:12px}
  #aiBody{grid-template-columns:minmax(0,1fr)}#aiCats{display:flex;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
  #aiCats button{flex:none}#aiScope{font-size:16px}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:minmax(0,1fr)}.facts dt{line-height:1.45}}
@media (max-width:640px){main{grid-template-columns:1fr!important}#blList li{flex-wrap:wrap}#blList li input{flex-basis:100%;order:-1}}
</style>
</head>
<body>
<header><h1>Trevskills Scrum</h1><span id="status" aria-live="polite">loading…</span>
  <select id="filter" aria-label="Show project"><option value="">All projects</option></select>
  <button class="btn" id="backlogBtn" type="button">Backlog</button>
  <button class="btn" id="agentsBtn" type="button">Agents</button>
  <button class="btn" id="aiBtn" type="button">AI-Settings</button></header>
<main id="board"></main>
<dialog id="viewer" aria-label="Job files"><div class="tabs" id="tabs"></div><div id="actions"></div><article id="doc"></article></dialog>
<dialog id="backlog" aria-label="Backlog">
  <div class="tabs"><b>Backlog</b><select id="blProject" aria-label="Backlog project"></select><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <form id="blAdd"><input type="text" name="text" maxlength="300" required placeholder="Add a backlog item" aria-label="New backlog item"><button class="btn primary icon" type="submit" aria-label="Add item">+</button></form>
    <p class="error" id="blError" role="alert"></p>
    <ol id="blList"></ol>
  </article>
</dialog>
<dialog id="agents" aria-label="Agents">
  <div class="tabs"><button id="agBack" type="button" hidden>← Back</button><b>Agents</b><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <p class="error" id="agError" role="alert"></p>
    <div id="flow"></div>
    <div id="agDetail" hidden></div>
  </article>
</dialog>
<dialog id="aiSettings" aria-label="AI-Settings">
  <div class="tabs"><button id="aiBack" type="button" hidden>← Back</button><b>AI-Settings</b>
    <select id="aiScope" aria-label="Scope" data-agent-hint="Global shows managed and user config. A project shows everything that applies inside it: managed, local, project and user."></select>
    <button class="close" type="button" aria-label="Close">✕</button></div>
  <p class="error" id="aiError" role="alert"></p>
  <div id="aiBody"><nav id="aiCats" aria-label="Categories"></nav><article id="aiList"></article></div>
</dialog>
<script>
const STAGES = ["spec", "build", "check", "review", "approve", "merging", "needs-human", "done"];
// Aborted jobs are finished too: they sit, dimmed, in the done column rather than a ninth column.
const colOf = job => job.stage === "aborted" ? "done" : job.stage;
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const STALE_MS = 30 * 60 * 1000; // ponytail: fixed threshold; make it a URL param if long builds trip it
const PTS = [null, 1, 2, 3, 5, 8, 13];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Agents write the markdown, so any raw HTML in it is shown as text, never run.
if (window.marked) marked.use({renderer: {html: h => esc(typeof h === "object" ? h.text : h)}});
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
  .then(async r => { const data = await r.json().catch(() => ({})); if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`); return data; });
// A 404 from one of our own routes means serve.py predates this dashboard.html; callers pass STALE as `missing` to say so.
const STALE = "Dashboard server is out of date. Restart serve.py.";
const getJson = (url, fallback, missing = fallback) => fetch(url, {cache: "no-store"})
  .then(r => r.ok ? r.json() : r.status === 404 ? missing : fallback).catch(() => fallback);

let projects = [], jobs = [], runs = {}, backlogs = {}, lastText = "", filter = store.get("scrum.filter");
const shown = () => jobs.filter(j => !filter || j.project === filter);
const hue = p => [...p].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 17);
const tag = p => `<span class="tag" style="--h:${hue(p)}">${esc(p)}</span>`;

const chip = (verdict, label) => `<span class="chip ${esc(verdict)}" title="${esc(label)}: ${esc(verdict)}">${esc(label)}</span>`;
const roundRow = (r, i) => `<span class="row"><b>R${i + 1}</b>${chip(r.check || "pending", "check")}${REVIEWERS.map(([k, l]) => chip(r[k] || "pending", l)).join("")}</span>`;

function card(job) {
  const human = job.stage === "needs-human", run = runs[job.key];
  const stale = !["done", "needs-human", "aborted"].includes(job.stage) && Date.now() - Date.parse(job.updatedAt) > STALE_MS;
  return `<button class="card${human ? " human" : ""}${job.stage === "aborted" ? " aborted" : ""}" data-key="${esc(job.key)}">
    ${tag(job.project)}<span class="id">${esc(job.id)}</span><span class="title">${esc(job.title)}</span>
    ${(job.rounds || []).map(roundRow).join("")}
    ${human && job.reason ? `<span class="reason">${esc(job.reason)}</span>` : ""}
    ${job.stage === "aborted" ? '<span class="reason">Aborted</span>' : ""}
    ${run?.alive ? `<span class="running">● ${esc(run.action)} running…</span>` : ""}
    <span class="meta">${job.pr ? "PR ready · " : ""}${stale ? `<span class="stale">stale since ${esc(new Date(job.updatedAt).toLocaleString())}</span>` : esc(new Date(job.updatedAt).toLocaleTimeString())}</span>
  </button>`;
}

function render() {
  const list = shown();
  const cols = [...STAGES, ...new Set(list.map(colOf).filter(s => !STAGES.includes(s)))];
  // Empty stages stay visible but narrow, so the columns holding jobs get the room.
  $("board").style.gridTemplateColumns = cols.map(s => list.some(j => colOf(j) === s) ? "minmax(230px,2fr)" : "minmax(96px,.5fr)").join(" ");
  $("board").innerHTML = cols.map(stage => {
    const inCol = list.filter(j => colOf(j) === stage);
    return `<section class="col${stage === "needs-human" ? " human" : ""}"><h2><span>${esc(stage)}</span> <span>· ${inCol.length}</span></h2>
      ${inCol.map(card).join("") || '<p class="empty">—</p>'}</section>`;
  }).join("");
  const open = projects.filter(p => !filter || p === filter).reduce((n, p) => n + (backlogs[p] || []).filter(i => !i.done).length, 0);
  $("backlogBtn").textContent = `Backlog · ${open}`;
  $("status").textContent = projects.length
    ? `${list.length} job${list.length === 1 ? "" : "s"} · ${projects.length} project${projects.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`
    : "No projects yet. Run /trevskills-scrum in a repo and it shows up here.";
}

function renderSelect(sel, value, withAll) {
  const want = (withAll ? [""] : []).concat(projects).join("\n");
  if (sel.dataset.list !== want) {
    sel.dataset.list = want;
    sel.innerHTML = (withAll ? '<option value="">All projects</option>' : "") + projects.map(p => `<option>${esc(p)}</option>`).join("");
  }
  sel.value = value;
}

async function poll() {
  try {
    const res = await fetch("api/projects", {cache: "no-store"});
    if (res.status === 404) return $("status").textContent = STALE;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    projects = (await res.json()).map(p => p.name);
    if (filter && !projects.includes(filter)) filter = "";
    const [boards, items, runList] = await Promise.all([
      Promise.all(projects.map(p => getJson(`p/${enc(p)}/board.json`, {jobs: []}))),
      Promise.all(projects.map(p => getJson(`api/p/${enc(p)}/backlog`, []))),
      getJson("api/runs", [])]);
    const all = boards.flatMap((b, i) => (b.jobs || []).map(j => ({...j, project: projects[i], key: `${projects[i]}/${j.id}`})));
    runs = Object.fromEntries(runList.map(r => [`${r.project}/${r.id}`, r]));
    const nextBacklogs = Object.fromEntries(projects.map((p, i) => [p, items[i]]));
    const backlogChanged = JSON.stringify(nextBacklogs) !== JSON.stringify(backlogs);
    backlogs = nextBacklogs;
    renderSelect($("filter"), filter, true);
    const text = JSON.stringify([all, runs, backlogs, filter]);
    if (text !== lastText) {
      jobs = all; lastText = text; render();
      const openJob = $("viewer").open && jobs.find(j => j.key === $("viewer").dataset.key);
      if (openJob && !$("actions").contains(document.activeElement)) renderActions(openJob);
    }
    if (backlogChanged && $("backlog").open && !editingBacklog()) renderBacklog();
  } catch (e) {
    $("status").textContent = `Can't reach the dashboard server (${e.message}). Open the Trevskills Scrum app, or run python3 ~/.claude/skills/trevskills-scrum/serve.py`;
  }
}

$("filter").addEventListener("change", e => { filter = e.target.value; store.set("scrum.filter", filter); lastText = ""; poll(); });

async function show(job, file) {
  [...$("tabs").querySelectorAll("button[data-file]")].forEach(b => b.setAttribute("aria-pressed", b.dataset.file === file));
  const url = `p/${enc(job.project)}/jobs/${enc(job.id)}/${file.split("/").map(enc).join("/")}`;
  try {
    const res = await fetch(url, {cache: "no-store"});
    if (!res.ok) throw new Error(`${res.status}`);
    const md = await res.text();
    $("doc").innerHTML = window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
  } catch (e) {
    $("doc").innerHTML = `<p class="empty">Couldn't load ${esc(file)} (${esc(e.message)}).</p>`;
  }
}

function open(job) {
  $("viewer").dataset.key = job.key;
  const files = job.files || [];
  const pr = job.pr ? `<a href="${esc(job.pr)}" target="_blank" rel="noopener">PR ↗</a>` : "";
  $("tabs").innerHTML = tag(job.project) + files.map(f => `<button data-file="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("")
    + pr + '<button class="close" aria-label="Close">✕</button>';
  $("doc").innerHTML = files.length ? "" : '<p class="empty">No files yet.</p>';
  renderActions(job);
  $("viewer").showModal();
  const first = files.includes("decision.md") ? "decision.md" : files.includes("spec.md") ? "spec.md" : files[0];
  if (first) show(job, first);
}

// Abort works on any unfinished job: it stops a dashboard-started run and marks the job aborted (code is kept).
const abortForm = job => ["done", "aborted"].includes(job.stage) ? "" : `<form data-act="abort">
    <label hidden><input type="checkbox" name="requeue"> Put back in backlog</label>
    <button class="btn danger-outline" type="submit">Abort job</button></form>`;

// Next step for a needs-human job, picked from the reason prefix the orchestrator writes.
const nextStep = (reason, worktree) =>
  /^obsolete/.test(reason) ? "Abort this job."
  : /^(blocked|spec writer)/.test(reason) ? "Send back to builder with feedback, or abort."
  : /Hard stop: schema/.test(reason) ? "Run /trevskills-migrate in the worktree, tick the box, then Approve & merge."
  : worktree ? "Approve & merge, or send back to builder."
  : "Send back to builder, or abort.";
const waitingBanner = job => job.stage !== "needs-human" ? "" : `<div class="waiting"
    data-agent-hint="This job stopped and needs Trevor. The first line is the reason the orchestrator recorded; the second is the suggested next action.">
    <b>Waiting on you</b><p>${esc(job.reason || "No reason recorded.")}</p><p>${esc(nextStep(job.reason || "", job.worktree))}</p></div>`;

function renderActions(job) {
  const el = $("actions"), run = runs[job.key], reason = job.reason || "", banner = waitingBanner(job);
  const log = run ? ` · <a href="p/${enc(job.project)}/${esc(run.log)}" target="_blank" rel="noopener">log</a>` : "";
  const err = '<p class="error" role="alert"></p>';
  if (run?.alive) return el.innerHTML = banner + `<p class="running">● ${esc(run.action)} running…${log}</p>` + abortForm(job) + err;
  const last = run ? `<p class="note">Last ${esc(run.action)} run ${run.exit === 0 ? "finished" : run.exit < 0 ? "stopped by Abort" : `failed (exit ${esc(run.exit)})`}${log}</p>` : "";
  if (job.stage !== "needs-human") return el.innerHTML = last + abortForm(job) + err;
  const obsolete = /^obsolete/.test(reason), canApprove = job.worktree && !/^(blocked|spec writer|obsolete)/.test(reason);
  el.innerHTML = banner + last + (canApprove ? `<form data-act="approve">
      ${/Hard stop: schema/.test(reason) ? '<label><input type="checkbox" name="migrated" required> I ran /trevskills-migrate for this job</label>' : ""}
      <button class="btn primary" type="submit">Approve &amp; merge</button></form>` : "")
    + (obsolete ? "" : `<form data-act="rework"><textarea name="feedback" required maxlength="2000" placeholder="What should the builder change?" aria-label="Feedback for the builder"></textarea>
      <button class="btn" type="submit">Send back to builder</button></form>`) + abortForm(job) + err;
}

$("actions").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, act = form.dataset.act, key = $("viewer").dataset.key, btn = form.querySelector("button");
  const job = jobs.find(j => j.key === key);
  if (act === "approve" && !form.dataset.armed) { form.dataset.armed = "1"; btn.textContent = "Confirm: merge into main"; return; }
  if (act === "abort" && !form.dataset.armed) {
    form.dataset.armed = "1"; form.querySelector("label").hidden = false;
    btn.textContent = "Confirm abort"; btn.className = "btn danger"; return;
  }
  btn.disabled = true;
  try {
    const body = act === "approve" ? {migrated: !!form.migrated?.checked} : act === "abort" ? {requeue: form.requeue.checked} : {feedback: form.feedback.value};
    await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/${act}`, body);
    await poll();
    renderActions(jobs.find(j => j.key === key));
  } catch (err) {
    btn.disabled = false;
    $("actions").querySelector(".error").textContent = err.message;
  }
});

const blProject = () => $("blProject").value;
const editingBacklog = () => !!$("blList").querySelector("[data-armed]") || ($("blList").contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName));

function renderBacklog() {
  $("blAdd").hidden = !projects.length;
  if (!projects.length) return $("blList").innerHTML = '<li class="note">No projects yet. Run /trevskills-scrum in a repo first.</li>';
  const open = (backlogs[blProject()] || []).filter(i => !i.done);
  $("blList").innerHTML = open.map((it, n) => `<li data-i="${it.index}">
      <select class="pts p${it.points ?? "x"}" aria-label="Difficulty points" title="${esc(it.why || "Not estimated yet")}">
        ${PTS.map(p => `<option value="${p ?? ""}"${p === it.points ? " selected" : ""}>${p ?? "?"}</option>`).join("")}</select>
      <input type="text" value="${esc(it.text)}" maxlength="300" aria-label="Item text">
      <button class="btn icon" type="button" data-do="up" aria-label="Move up"${n === 0 ? " disabled" : ""}>↑</button>
      <button class="btn icon" type="button" data-do="down" aria-label="Move down"${n === open.length - 1 ? " disabled" : ""}>↓</button>
      <button class="btn icon" type="button" data-do="run" aria-label="Run now">▶</button>
      <button class="btn icon" type="button" data-do="delete" aria-label="Delete">✕</button>
    </li>`).join("") || '<li class="note">Backlog is empty.</li>';
}

async function backlogCall(fn) {
  $("blError").textContent = "";
  try { await fn(`api/p/${enc(blProject())}/backlog`); } catch (err) { $("blError").textContent = err.message; }
  await poll();
  renderBacklog();
}

$("backlogBtn").addEventListener("click", () => {
  renderSelect($("blProject"), filter || store.get("scrum.backlogProject") || projects[0] || "", false);
  if (!$("blProject").value && projects.length) $("blProject").value = projects[0];
  renderBacklog();
  $("backlog").showModal();
});
$("blProject").addEventListener("change", e => { store.set("scrum.backlogProject", e.target.value); renderBacklog(); });
$("blAdd").addEventListener("submit", e => {
  e.preventDefault();
  const input = e.target.text;
  backlogCall(async url => { await post(url, {op: "add", text: input.value}); input.value = ""; });
});
$("blList").addEventListener("click", e => {
  const b = e.target.closest("button[data-do]");
  if (!b) return;
  const index = +b.closest("li").dataset.i, act = b.dataset.do;
  // Run and Delete ask once on the button itself; no native confirm().
  if ((act === "run" || act === "delete") && !b.dataset.armed) {
    b.dataset.armed = "1"; b.textContent = act === "run" ? "Run?" : "Delete?"; b.classList.add(act === "run" ? "primary" : "danger");
    return;
  }
  b.disabled = true;
  backlogCall(url => act === "run" ? post(`${url}/run`, {index}).then(() => $("backlog").close())
    : post(url, act === "delete" ? {op: "delete", index} : {op: "move", index, delta: act === "up" ? -1 : 1}));
});
$("blList").addEventListener("change", e => {
  const index = +e.target.closest("li").dataset.i;
  backlogCall(url => post(url, e.target.tagName === "SELECT"
    ? {op: "edit", index, points: e.target.value ? +e.target.value : null} : {op: "edit", index, text: e.target.value}));
});
$("blList").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur(); });

// The pipeline order is fixed by SKILL.md, so it lives here; everything about each agent comes from api/agents.
const PIPELINE = [
  {step: "Orchestrator", note: "main session", hint: "The /trevskills-scrum skill runs in the main Claude session, spawns every agent and moves the job between stages."},
  "scrum-spec-writer", "scrum-builder",
  {step: "Check gate", note: "test · lint · build", hint: "Runs the project's test, typecheck, lint and build commands; a failure goes back to the builder."},
  ["scrum-review-security", "scrum-review-ux", "scrum-review-ui", "scrum-review-code"],
  "scrum-approver",
  {step: "PR / merge", note: "squash-merge", hint: "On APPROVE the orchestrator pushes scrum/<id>, opens a PR, waits for CI and squash-merges."}];
const CODEX = {step: "Codex", note: "read-only", hint: "codex exec review runs alongside scrum-review-code; the reviewer confirms each finding and tags it (codex)."};
let agents = [], skills = null;
const modelLabel = a => a.name === "scrum-approver" ? `${a.model} · sonnet if all green` : a.model || "—";
const stepNode = s => `<div class="node step" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span></div>`;
const agentNode = name => {
  const a = agents.find(x => x.name === name);
  return a ? `<button class="node" type="button" data-agent="${esc(a.name)}"><b>${esc(a.name)}</b><span>${esc(modelLabel(a))}</span></button>` : "";
};
const ARROW = '<div class="arrow" aria-hidden="true">↓</div>';

function renderFlow() {
  const known = PIPELINE.flat().filter(x => typeof x === "string");
  const extra = agents.map(a => a.name).filter(n => !known.includes(n));
  const rows = [...PIPELINE, ...extra].map(x => typeof x === "string" ? agentNode(x) : Array.isArray(x)
    ? `<div class="lanes">${x.map(n => `<div class="lane">${agentNode(n)}${n === "scrum-review-code" ? stepNode(CODEX) : ""}</div>`).join("")}</div>`
    : stepNode(x));
  const row = name => 2 * PIPELINE.indexOf(name) + 1;  // every node row is followed by an arrow row
  $("flow").innerHTML = rows.join(ARROW) + `<div class="loop" style="grid-row:${row("scrum-builder")}/${row("scrum-approver") + 1}"
    data-agent-hint="When the approver decides CHANGES or REWORK, the job goes back to the builder for another round."><span>changes · rework</span></div>`;
  alignLoop();
}

// The loop's ends meet the middle of the builder and approver nodes, whose height changes when a label wraps.
// Nodes are centred and content-sized, so a negative left margin stretches the loop from its own column back to the
// narrower node's right edge; it runs behind the wider one (nodes sit above it), and --tip moves the arrowhead out to
// the builder's own edge. Spanning both columns instead would push the auto-placed nodes out of the loop's rows.
function alignLoop() {
  const flow = $("flow"), loop = flow.querySelector(".loop"), node = n => flow.querySelector(`[data-agent="${n}"]`);
  const b = node("scrum-builder"), a = node("scrum-approver");
  if (!loop || !b || !a || flow.hidden) return;
  const left = Math.min(b.offsetLeft + b.offsetWidth, a.offsetLeft + a.offsetWidth) - 2;
  const col = parseFloat(getComputedStyle(flow).gridTemplateColumns);  // width of the node column = where the loop's column starts
  loop.style.margin = `${b.offsetHeight / 2 - 1}px 8px ${a.offsetHeight / 2 - 1}px ${left - col}px`;
  loop.style.setProperty("--tip", `${b.offsetLeft + b.offsetWidth - left}px`);
}
window.addEventListener("resize", () => { if ($("agents").open) alignLoop(); });

function showAgents(name) {
  const a = name && agents.find(x => x.name === name);
  $("flow").hidden = !!a; $("agDetail").hidden = !a; $("agBack").hidden = !a;
  if (!a) return alignLoop();
  $("agDetail").innerHTML = `<dl class="facts">
      <dt>Agent</dt><dd><b>${esc(a.name)}</b></dd>
      <dt>Model</dt><dd>${esc(modelLabel(a))}</dd>
      <dt>Tools</dt><dd>${esc(a.tools || "—")}</dd>
      <dt>Description</dt><dd>${esc(a.description || "—")}</dd>
      <dt>Skills</dt><dd>${a.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("") || '<span class="empty">None</span>'}
        <button class="btn icon" id="agAdd" type="button" aria-label="Add skill" aria-expanded="false">+</button></dd></dl>
    <form id="agPicker" hidden><input type="text" id="agFilter" placeholder="Filter skills" aria-label="Filter skills" autocomplete="off">
      <div id="agSkills"></div></form>
    <div class="md">${window.marked ? marked.parse(a.body) : `<pre>${esc(a.body)}</pre>`}</div>`;
  $("agDetail").dataset.agent = a.name;
}

function renderSkills() {
  const a = agents.find(x => x.name === $("agDetail").dataset.agent), q = $("agFilter").value.trim().toLowerCase();
  const left = (skills || []).filter(s => !a.skills.includes(s.name));
  const hits = left.filter(s => s.name.toLowerCase().includes(q));
  $("agSkills").innerHTML = !skills ? '<p class="empty">loading…</p>'
    : hits.map(s => `<button class="btn" type="button" data-skill="${esc(s.name)}">${esc(s.name)}</button>`).join("")
      || `<p class="empty">${left.length ? "No match." : "No other skills installed."}</p>`;
}

async function addSkill(skill, btn) {
  if (btn.disabled) return;  // already pending: one POST per button
  const name = $("agDetail").dataset.agent;
  $("agError").textContent = ""; btn.disabled = true; btn.textContent = "Adding…";
  try {
    const updated = await post(`api/agents/${enc(name)}/skills`, {skill});
    agents = agents.map(x => x.name === name ? updated : x);
    renderFlow(); showAgents(name);
  } catch (err) { btn.disabled = false; btn.textContent = skill; $("agError").textContent = err.message; }
}

$("agentsBtn").addEventListener("click", async () => {
  $("agError").textContent = ""; skills = null;
  $("flow").innerHTML = '<p class="empty">loading…</p>';
  showAgents(null);
  $("agents").showModal();
  const list = await getJson("api/agents", null, STALE);
  if (!Array.isArray(list)) {
    $("flow").innerHTML = "";
    return $("agError").textContent = list || "Couldn't load agents. Is serve.py running?";
  }
  agents = list;
  renderFlow();
});
$("agBack").addEventListener("click", () => showAgents(null));
$("flow").addEventListener("click", e => {
  const b = e.target.closest("[data-agent]");
  if (b) { $("agError").textContent = ""; showAgents(b.dataset.agent); }
});
$("agDetail").addEventListener("click", async e => {
  if (e.target.id === "agAdd") {
    const open = $("agPicker").hidden;
    $("agPicker").hidden = !open; e.target.setAttribute("aria-expanded", open);
    if (!open) return;
    renderSkills(); $("agFilter").focus();
    if (!skills) {
      const list = await getJson("api/skills", null, STALE);
      if (!Array.isArray(list)) { $("agError").textContent = list || "Couldn't load installed skills."; return $("agPicker").hidden = true; }
      skills = list;
      renderSkills();
    }
  }
  const b = e.target.closest("button[data-skill]");
  if (b) addSkill(b.dataset.skill, b);
});
$("agDetail").addEventListener("input", e => { if (e.target.id === "agFilter") renderSkills(); });
$("agDetail").addEventListener("submit", e => {  // Enter in the filter picks the first match
  e.preventDefault();
  const b = $("agSkills").querySelector("button[data-skill]");
  if (b) addSkill(b.dataset.skill, b);
});

// AI-Settings: read-only. Items come from api/ai-settings; precedence is managed > local > project > user.
const AI_GROUPS = [["global", "Global"], ["registered", "Registered"], ["mac", "This Mac"]];
const AI_LOADING = '<p class="empty">loading…</p>';
let aiData = null, aiCat = "";
const aiFail = () => { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't load AI settings. Is serve.py running?"; };
const aiRow = it => `<button class="node${it.status === "overridden" ? " over" : ""}" type="button" data-id="${esc(it.id)}">
    <b>${esc(it.name)}</b><span><span class="skill">${esc(it.scope)}</span>${it.status ? ` <span class="chip ${it.status === "wins" ? "PASS" : "pending"}">${esc(it.status)}</span>` : ""}</span>
    <span class="path">${esc(it.path)}</span></button>`;

function renderAi() {
  $("aiBack").hidden = true;
  $("aiCats").innerHTML = aiData.categories.map(c => `<button type="button" data-cat="${esc(c.key)}" aria-pressed="${c.key === aiCat}"><span>${esc(c.label)}</span><span>${c.count}</span></button>`).join("");
  const cat = aiData.categories.find(c => c.key === aiCat);
  $("aiList").innerHTML = cat.items.map(aiRow).join("") || '<p class="empty">None</p>';
}

async function aiLoadScope() {
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = true; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson(`api/ai-settings?scope=${enc(sid)}`, null);
  if ($("aiScope").value !== sid) return;  // a newer scope pick is already loading
  if (!data) return aiFail();
  aiData = data;
  if (!aiData.categories.some(c => c.key === aiCat)) aiCat = aiData.categories[0].key;
  renderAi();
}

$("aiBtn").addEventListener("click", async () => {
  $("aiError").textContent = ""; $("aiScope").innerHTML = ""; $("aiCats").innerHTML = ""; $("aiBack").hidden = true;
  $("aiList").innerHTML = AI_LOADING; aiData = null; aiCat = "";
  $("aiSettings").showModal();
  const scopes = await getJson("api/ai-settings", null);
  if (!scopes) return aiFail();
  $("aiScope").innerHTML = AI_GROUPS.filter(([g]) => scopes[g]?.length).map(([g, label]) => `<optgroup label="${label}">${
    scopes[g].map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
  $("aiScope").value = "global";
  aiLoadScope();
});
$("aiScope").addEventListener("change", aiLoadScope);
$("aiBack").addEventListener("click", renderAi);
$("aiCats").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (b && aiData) { aiCat = b.dataset.cat; renderAi(); }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = false; $("aiList").innerHTML = AI_LOADING;
  const it = await getJson(`api/ai-settings/item?id=${enc(b.dataset.id)}`, null);
  if ($("aiScope").value !== sid || $("aiBack").hidden) return;  // moved on while loading
  if (!it) return aiFail();
  $("aiList").innerHTML = `<dl class="facts"><dt>Name</dt><dd><b>${esc(it.name)}</b></dd><dt>Scope</dt><dd><span class="skill">${esc(it.scope)}</span></dd>
    <dt>Path</dt><dd>${esc(it.path)}</dd></dl><pre>${esc(it.content)}</pre>`;
});

$("board").addEventListener("click", e => {
  const el = e.target.closest(".card");
  const job = el && jobs.find(j => j.key === el.dataset.key);
  if (job) open(job);
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-file]");
  const job = b && jobs.find(j => j.key === $("viewer").dataset.key);
  if (job) show(job, b.dataset.file);
});
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => {
  if (e.target === d || e.target.closest(".close")) d.close();
}));

poll();
setInterval(poll, 2000);
</script>
</body>
