});

// Pipelines: the order is fixed by SKILL.md, so it lives here; everything about each agent comes from api/agents.
// Item format: string = agent, {agent, note} = agent with a note, array = parallel row, {step, note, hint} = step node,
// {tab, step, note, hint} = a dashed button that switches to that tab. The Orchestrator is drawn by the renderer.
const ORCH = {step: "Orchestrator", note: "main session", hint: "The /trevskills-scrum skill runs in the main Claude session, spawns every agent and moves the job between stages."};
const CHECK = {step: "Check gate", note: "test · lint · build", hint: "Runs the project's test, typecheck, lint and build commands; a failure goes back to the builder."};
const MERGE = {step: "PR / merge", note: "squash-merge", hint: "The orchestrator pushes scrum/<id>, opens a PR, waits for CI and squash-merges."};
const CODEX = {step: "Codex", note: "read-only", hint: "codex exec review runs alongside scrum-review-code; the reviewer confirms each finding and tags it (codex)."};
const PROMOTE = {tab: "standard", step: "→ Standard", note: ">100 lines · >3 files · UI · schema",
  hint: "A fast job is promoted to the standard pipeline when its check fails twice in a round, or after a passing check when the diff has more than 100 lines or a binary file, more than 3 files, a UI glob file, or a schema/migration/.sql/.env file. It then carries on as standard from where it is."};
const REVIEWS = ["scrum-review-security", "scrum-review-ux", "scrum-review-ui", "scrum-review-code"];
const PIPELINES = {
  fast: ["scrum-spec-writer", "scrum-builder", [CHECK, PROMOTE], "scrum-review-code", MERGE],
  standard: ["scrum-spec-writer", "scrum-builder", CHECK, REVIEWS, "scrum-approver", MERGE],
  debug: ["scrum-spec-writer", "scrum-debugger", {agent: "scrum-builder", note: "allowed files only"},
    {...CHECK, note: "test · lint · build + repro must pass", hint: "As the standard check gate, plus the debugger's repro test must now pass."}, REVIEWS, "scrum-approver", MERGE],
  bigboy: ["scrum-planner", {agent: "scrum-spec-writer", note: "per child"},
    {step: "Children", note: "each runs its own pipeline", links: ["fast", "standard", "debug"], hint: "Each child ticket runs as its own job, in its own pipeline, with its own PR."},
    {agent: "scrum-tracker", note: "after each child merge"}, "scrum-bigboy-reviewer",
    {step: "Fix ticket", note: "one, on gaps", hint: "When the final review finds gaps, one FIX ticket is added to the backlog."}]};
const MAINTENANCE = {
  "Run all": ["scrum-triager", {step: "Jobs", note: "backlog, one by one", hint: "After triage every open backlog item runs as a job, one after another."}],
  "Digest": ["scrum-digest-reader", "scrum-digester", {step: "Digest dialog", note: "you decide", hint: "Each proposed edit waits in the Digest dialog for Approve or Reject."}]};
// Single-pipeline tabs draw a loop from `from` back up to scrum-builder.
const LOOPS = {fast: ["scrum-review-code", "changes", "When the code review asks for CHANGES, the job goes back to the builder for another round."],
  standard: ["scrum-approver", "changes · rework", "When the approver decides CHANGES or REWORK, the job goes back to the builder for another round."]};
LOOPS.debug = LOOPS.standard;
const TABS = {all: "All", fast: "Fast", standard: "Standard", debug: "Debug", bigboy: "BigBoy", maintenance: "Maintenance"};
const ZOOMS = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150];
let agents = [], skills = null;
let adding = null;  // skill whose add POST is in flight; renderSkills() locks the picker while set
const modelLabel = a => a.name === "scrum-approver" ? `${a.model} · sonnet if all green` : a.model || "—";
let pipelineTab = "all", zoom = ZOOMS.includes(+store.get("scrum.zoom")) ? +store.get("scrum.zoom") : 100;
const tabBtn = k => `<button class="btn" type="button" data-tab="${k}">${TABS[k]}</button>`;
const stepNode = s => s.tab
  ? `<button class="node step" type="button" data-tab="${esc(s.tab)}" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span></button>`
  : `<div class="node step" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span>${s.links ? `<span class="links">${s.links.map(tabBtn).join("")}</span>` : ""}</div>`;
const agentNode = (name, note) => {
  const a = agents.find(x => x.name === name);
  return a ? `<button class="node" type="button" data-agent="${esc(a.name)}"><b>${esc(a.name)}</b><span>${esc(modelLabel(a))}${note ? ` · ${esc(note)}` : ""}</span></button>` : "";
};
const ARROW = '<div class="arrow" aria-hidden="true">↓</div>';
// The code reviewer always has Codex under it. `all` drops the promotion link.
const item = x => typeof x === "string" || x.agent
  ? (x === "scrum-review-code" ? `<div class="lane">${agentNode(x)}${stepNode(CODEX)}</div>` : agentNode(x.agent || x, x.note))
  : stepNode(x);
const row = (x, all) => {
  const xs = Array.isArray(x) ? x.filter(y => !(all && y.tab)) : [x];
  return xs.length > 1 ? `<div class="lanes">${xs.map(item).join("")}</div>` : item(xs[0]);
};
const chain = (seq, all) => seq.map(x => row(x, all)).join(ARROW);
const column = (title, body, top = "") => `<section class="pcol">${top}<h3>${esc(title)}</h3>${body}</section>`;
const charted = [...Object.values(PIPELINES), ...Object.values(MAINTENANCE)].flat(2).map(x => typeof x === "string" ? x : x.agent).filter(Boolean);

function renderFlow() {
  const tab = pipelineTab, loop = LOOPS[tab];
  $("pipeTabs").querySelectorAll("[role=tab]").forEach(b => {  // roving tabindex: Tab reaches the selected tab only
    b.setAttribute("aria-selected", b.dataset.tab === tab); b.setAttribute("tabindex", b.dataset.tab === tab ? 0 : -1);
  });
  const other = agents.map(a => a.name).filter(n => !charted.includes(n));
  $("flow").innerHTML = tab === "all"
    ? stepNode(ORCH) + '<div class="fan" aria-hidden="true"></div><div class="pcols">'
      + Object.entries(PIPELINES).map(([k, seq]) => column(TABS[k], chain(seq, true), ARROW)).join("") + "</div>"
    : tab === "maintenance"
    ? '<div class="pcols">' + Object.entries(MAINTENANCE).map(([h, seq]) => column(h, chain(seq))).join("") + "</div>"
      + (other.length ? column("Other", other.map(n => agentNode(n)).join("")) : "")
    : stepNode(ORCH) + ARROW + chain(PIPELINES[tab])
      + (loop ? `<div class="loop" data-from="${loop[0]}" data-agent-hint="${esc(loop[2])}"><span>${esc(loop[1])}</span></div>` : "");
  alignLoop();
}

// The loop's ends meet the middle of scrum-builder and its `from` node, whose heights change when a label wraps.
// Its left edge sits at the narrower node's right edge; it runs behind the wider one (nodes sit above it), and --tip
// moves the arrowhead out to the builder's own edge. Offsets are all inside #flow, so the chart's zoom cancels out.
function alignLoop() {
  const flow = $("flow"), loop = flow.querySelector(".loop"), node = n => flow.querySelector(`[data-agent="${n}"]`);
  const b = node("scrum-builder"), a = loop && node(loop.dataset.from);
  if (!b || !a || flow.hidden) return;
  const mid = n => n.offsetTop + n.offsetHeight / 2, right = n => n.offsetLeft + n.offsetWidth;
  const left = Math.min(right(b), right(a)) - 2;
  Object.assign(loop.style, {top: `${mid(b) - 1}px`, height: `${mid(a) - mid(b) + 2}px`, left: `${left}px`});
  loop.style.setProperty("--tip", `${right(b) - left}px`);
}
window.addEventListener("resize", () => { if ($("agents").open) alignLoop(); });

function setZoom(z) {
  zoom = z; store.set("scrum.zoom", z);
  $("flow").style.zoom = z / 100;
  $("agZoom").textContent = `${z}%`;
  $("agZoomOut").disabled = z === ZOOMS[0]; $("agZoomIn").disabled = z === ZOOMS[ZOOMS.length - 1];
  alignLoop();
}
function setTab(k, focus) {
  pipelineTab = k; renderFlow();
  if (focus) $("pipeTabs").querySelector(`[data-tab="${k}"]`).focus();
}
$("pipeTabs").innerHTML = Object.keys(TABS).map(k => `<button type="button" role="tab" aria-controls="flow" data-tab="${k}" aria-selected="false">${TABS[k]}</button>`).join("");
$("pipeTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
$("pipeTabs").addEventListener("keydown", e => {  // arrow keys move between tabs, as the ARIA tabs pattern expects
  const keys = Object.keys(TABS), d = {ArrowRight: 1, ArrowLeft: -1}[e.key];
  if (d) setTab(keys[(keys.indexOf(pipelineTab) + d + keys.length) % keys.length], true);
});
$("agZoomOut").addEventListener("click", () => setZoom(ZOOMS[ZOOMS.indexOf(zoom) - 1]));
$("agZoomIn").addEventListener("click", () => setZoom(ZOOMS[ZOOMS.indexOf(zoom) + 1]));
setZoom(zoom);

function showAgents(name) {
  const a = name && agents.find(x => x.name === name);
  $("flow").hidden = !!a; $("agDetail").hidden = !a; $("agBack").hidden = !a; $("pipeBar").hidden = !!a || !agents.length;
  if (!a) return alignLoop();
  $("agDetail").innerHTML = `<dl class="facts">
      <dt>Agent</dt><dd><b>${esc(a.name)}</b></dd>
      <dt>Model</dt><dd>${esc(modelLabel(a))}</dd>
      <dt>Tools</dt><dd>${esc(a.tools || "—")}</dd>
      <dt>Description</dt><dd>${esc(a.description || "—")}</dd>
      <dt>Skills</dt><dd>${a.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("") || '<span class="empty">None</span>'}
        <button class="btn icon" id="agAdd" type="button" aria-label="Add skill" aria-expanded="false">+</button></dd></dl>
    <form id="agPicker" hidden><input type="text" id="agFilter" placeholder="Filter skills" aria-label="Filter skills" autocomplete="off">
      <div id="agSkills"></div></form>
    <div class="md">${window.marked ? marked.parse(a.body) : `<pre>${esc(a.body)}</pre>`}</div>`;
  $("agDetail").dataset.agent = a.name;
}

function renderSkills() {
  const a = agents.find(x => x.name === $("agDetail").dataset.agent), f = $("agFilter");
  if (!a || !f || $("agDetail").hidden) return;  // a late call (addSkill's catch) after Back or a reopen: no live picker
  const q = f.value.trim().toLowerCase();
  const left = (skills || []).filter(s => !a.skills.includes(s.name));
  const hits = left.filter(s => s.name.toLowerCase().includes(q));
  $("agSkills").innerHTML = !skills ? '<p class="empty">loading…</p>'
    : hits.map(s => `<button class="btn" type="button" data-skill="${esc(s.name)}"${adding ? " disabled" : ""}>${s.name === adding ? "Adding…" : esc(s.name)}</button>`).join("")
      || `<p class="empty">${left.length ? "No match." : "No other skills installed."}</p>`;
}

async function addSkill(skill) {
  if (adding) return;  // one add in flight at a time, even across filter re-renders
  const name = $("agDetail").dataset.agent;
  $("agError").textContent = ""; adding = skill; renderSkills();
  try {
    const updated = await post(`api/agents/${enc(name)}/skills`, {skill});
    adding = null;
    agents = agents.map(x => x.name === name ? updated : x);
    renderFlow(); showAgents(name);
  } catch (err) { adding = null; $("agError").textContent = err.message; renderSkills(); }
}

$("agentsBtn").addEventListener("click", async () => {
  $("agError").textContent = ""; skills = null; agents = []; pipelineTab = "all";
  $("flow").innerHTML = '<p class="empty">loading…</p>';
  showAgents(null);  // the tab row stays hidden until api/agents loads
  $("agents").showModal();
  const list = await getJson("api/agents", null, STALE);
  if (!Array.isArray(list)) {
    $("flow").innerHTML = "";
    return $("agError").textContent = list || "Couldn't load agents. Is serve.py running?";
  }
  agents = list;
  $("pipeBar").hidden = false;
  renderFlow();
});
$("agBack").addEventListener("click", () => showAgents(null));
$("flow").addEventListener("click", e => {
  const b = e.target.closest("[data-agent]"), t = e.target.closest("[data-tab]");
  if (b) { $("agError").textContent = ""; showAgents(b.dataset.agent); }
  if (t) setTab(t.dataset.tab, true);
});
$("agDetail").addEventListener("click", async e => {
  if (e.target.id === "agAdd") {
    const open = $("agPicker").hidden;
    $("agPicker").hidden = !open; e.target.setAttribute("aria-expanded", open);
    if (!open) return;
    renderSkills(); $("agFilter").focus();
    if (!skills) {
      const list = await getJson("api/skills", null, STALE);
      if (!Array.isArray(list)) { $("agError").textContent = list || "Couldn't load installed skills."; return $("agPicker").hidden = true; }
      skills = list;
      renderSkills();
    }
  }
  const b = e.target.closest("button[data-skill]");
  if (b) addSkill(b.dataset.skill);
});
$("agDetail").addEventListener("input", e => { if (e.target.id === "agFilter") renderSkills(); });
$("agDetail").addEventListener("submit", e => {  // Enter in the filter picks the first match
  e.preventDefault();
  const b = $("agSkills").querySelector("button[data-skill]");
  if (b) addSkill(b.dataset.skill);
});

// AI-Settings: items come from api/ai-settings; precedence is managed > local > project > user. Every `editable` item
// (everything outside managed scope) gets a textarea; a JSON item must parse, and a permissions or hooks change shows an
// Old/New diff and needs a second click. serve.py backs up every save, and Undo restores the newest backup. Managed
// items are a read-only <pre>.
const AI_GROUPS = [["global", "Global"], ["registered", "Registered"], ["mac", "This Mac"]];
const AI_LOADING = '<p class="empty">loading…</p>';
let aiData = null, aiCat = "", aiItem = null;  // aiItem: the editable item on screen, with its last saved version
let aiOpenedId = "";  // data-id of the last item opened, so Back can refocus its row
// Moves focus to el only when focus was lost (body, the dialog, a removed node, or `also`), never away from where the user went.
const aiRefocus = (el, also) => { const a = document.activeElement; if (el && (!a || a === document.body || a === $("aiSettings") || a === also || !a.isConnected)) el.focus(); };
let aiFindings = null;  // the last Security scan; it covers every scope, so a scope change keeps it
let aiAudit = null, aiOff = new Set();  // the current scope's audit, and rows Disabled on this visit (they offer Undo)
let aiScopeId = "";  // the scope last loaded, so a blocked scope pick can put #aiScope back
const aiFail = () => { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't load AI settings. Is serve.py running?"; };
const aiRow = it => `<button class="node${it.status === "overridden" ? " over" : ""}" type="button" data-id="${esc(it.id)}">
    <b>${esc(it.name)}</b><span><span class="skill">${esc(it.scope)}</span>${it.status ? ` <span class="chip ${it.status === "wins" ? "PASS" : "pending"}">${esc(it.status)}</span>` : ""}</span>
    <span class="path">${esc(it.path)}</span></button>`;

function renderAi() {
  $("aiBack").hidden = true;
  $("aiCats").innerHTML = aiData.categories.map(c => `<button type="button" data-cat="${esc(c.key)}" aria-pressed="${c.key === aiCat}"><span>${esc(c.label)}</span><span>${c.count}</span></button>`).join("")
    + `<button type="button" data-cat="security" aria-pressed="${aiCat === "security"}" data-agent-hint="Scans every scope's config files for risky hooks, allow rules, skills and MCP secrets. Reads files only."><span>Security</span><span>${aiFindings ? aiFindings.length : ""}</span></button>`
    + `<button type="button" data-cat="audit" aria-pressed="${aiCat === "audit"}" data-agent-hint="Usage, always-loaded tokens and problems per item, with a Keep / Improve / Retire / Merge verdict. Disable flips one settings key and can be undone."><span>Audit</span><span>${aiAudit ? aiAudit.rows.length : ""}</span></button>`;
  if (aiCat === "security") return renderFindings();
  if (aiCat === "audit") return renderAudit();
  const cat = aiData.categories.find(c => c.key === aiCat);
  $("aiList").innerHTML = cat.items.map(aiRow).join("") || '<p class="empty">None</p>';
}

async function aiLoadScope() {
  const sid = aiScopeId = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = true; $("aiList").innerHTML = AI_LOADING;
  aiAudit = null; aiOff.clear();
  const data = await getJson(`api/ai-settings?scope=${enc(sid)}`, null);
  if ($("aiScope").value !== sid) return;  // a newer scope pick is already loading
  if (!data) return aiFail();
  aiData = data;
  if (!["security", "audit"].includes(aiCat) && !aiData.categories.some(c => c.key === aiCat)) aiCat = aiData.categories[0].key;
  renderAi();
}

$("aiBtn").addEventListener("click", async () => {
  $("aiError").textContent = ""; $("aiScope").innerHTML = ""; $("aiCats").innerHTML = ""; $("aiBack").hidden = true;
  $("aiList").innerHTML = AI_LOADING; aiData = null; aiCat = ""; aiScopeId = ""; aiFindings = null; aiAudit = null; aiOff.clear();
  $("aiSettings").showModal();
  const scopes = await getJson("api/ai-settings", null);
  if (!scopes) return aiFail();
  $("aiScope").innerHTML = AI_GROUPS.filter(([g]) => scopes[g]?.length).map(([g, label]) => `<optgroup label="${label}">${
    scopes[g].map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
  $("aiScope").value = "global";
  aiLoadScope();
});
// A <select> has already changed when `change` fires, so a blocked pick puts the loaded scope back.
$("aiScope").addEventListener("change", () => {
  if (aiBlockLeave()) { $("aiScope").value = aiScopeId; return; }
  aiLoadScope();
});
// Leaving an editor with unsaved text asks once, like backlog Run/Delete: the first Back, ✕, backdrop click, Escape,
// category click or scope pick only warns, and the second (through any of them) goes through. Typing again re-arms it.
function aiBlockLeave() {
  const form = $("aiEdit");
  if (!form?.isConnected || !aiItem || $("aiText").value === aiItem.baseline || form.dataset.leave) return false;
  form.dataset.leave = "1"; $("aiError").textContent = "Unsaved changes. Press again to discard.";
  return true;
}
$("aiSettings").addEventListener("cancel", e => { if (aiBlockLeave()) e.preventDefault(); });
$("aiBack").addEventListener("click", () => {
  if (aiBlockLeave()) return;
  $("aiError").textContent = "";
  renderAi();  // hides Back while it still has focus, so Back itself counts as lost focus
  aiRefocus([...$("aiList").querySelectorAll("button[data-id]")].find(x => x.dataset.id === aiOpenedId)
    || $("aiCats").querySelector('[aria-pressed="true"]'), $("aiBack"));
});
$("aiCats").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b || !aiData || aiBlockLeave()) return;
  aiCat = b.dataset.cat; $("aiError").textContent = "";
  if (aiCat === "security") aiFindings = null;  // every click runs a fresh scan
  aiAudit = null; aiOff.clear();  // leaving or re-entering Audit reloads it and drops Undo
  renderAi();
});
const findingRow = f => `<div class="node finding"><span class="chip ${f.severity === "low" ? "pending" : esc(f.severity)}">${esc(f.severity)}</span>
    <b>${esc(f.file)}${f.line == null ? "" : `:${esc(f.line)}`}</b>${f.rule ? ` <span class="note">${esc(f.rule)}</span>` : ""}<span class="path">${esc(f.fix)}</span></div>`;
async function renderFindings() {
  if (aiFindings) {
    $("aiList").innerHTML = aiFindings.map(findingRow).join("") || '<p class="empty">No risky config found</p>';
    return;
  }
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson("api/ai-settings/security", null);
  if (aiCat !== "security" || !$("aiBack").hidden || aiFindings) return;  // moved on, or a newer scan already landed
  if (!data?.findings) { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't run the security scan. Is serve.py running?"; return; }
  aiFindings = data.findings;
  renderAi();
}
const AUDIT_GROUPS = ["Retire", "Merge", "Improve", "Keep"];
const auditFlag = f => f.startsWith("overlap:") ? `overlap: ${aiAudit.rows.find(r => r.id === f.slice(8))?.name ?? "?"}` : f;
const auditRow = r => `<div class="node audit"><b>${esc(r.name)}</b><span><span class="skill">${esc(r.scope)}</span> ${esc(r.category)}</span>
    <span>uses ${r.lifetime ?? "—"} · recent ${r.recent ?? "—"} · ${r.tokens == null ? "—" : `~${r.tokens}`} tok</span>${r.flags.length ? `<span>${esc(r.flags.map(auditFlag).join(", "))}</span>` : ""}
    <span class="acts">${researchActs(r)}${aiOff.has(r.id) ? `<span class="note" role="status">Disabled</span><button class="btn" type="button" data-toggle="enable" data-row="${esc(r.id)}">Undo</button>`
      : r.disable ? `<button class="btn" type="button" data-toggle="disable" data-row="${esc(r.id)}">Disable</button>` : ""}</span>
    <span class="path">${esc(r.verdict.startsWith("Merge") ? `${r.verdict}. ${r.reason}` : r.reason)}</span></div>`;
// Research this: a read-only claude run per row whose log holds the suggested edits; Edit opens the 2/5 editor to apply them.
const researchActs = r => {
  const rs = r.research, log = rs && `p/${enc(rs.project)}/${esc(rs.log)}`;
  return (rs?.alive ? `<span class="note" role="status">Researching…</span><a href="${log}" target="_blank" rel="noopener">log</a>`
      : rs ? `<a href="${log}" target="_blank" rel="noopener">Suggestions</a>` : "")
    + `<button class="btn" type="button" data-research="${esc(r.id)}"${rs?.alive ? " disabled" : ""} data-agent-hint="Starts a read-only claude run that compares this item with current Anthropic docs and top repos and replies with suggested edits. It changes no files.">Research this</button>`
    + (r.editable ? `<button class="btn" type="button" data-id="${esc(r.id)}">Edit</button>` : "");
};
// Called by poll(): flips a row from Researching… to Suggestions once its run has ended; no extra polling.
function auditRunsChanged() {
  let changed = false;
  for (const r of aiAudit?.rows || []) {
    const run = r.research && runs[`${r.research.project}/${r.research.key}`];
    if (run && run.alive !== r.research.alive) { r.research.alive = run.alive; changed = true; }
  }
  if (changed && aiCat === "audit" && $("aiBack").hidden && $("aiSettings").open) renderAudit();
}
async function renderAudit() {
  if (aiAudit) {
    $("aiList").innerHTML = AUDIT_GROUPS.map(g => [g, aiAudit.rows.filter(r => r.verdict.split(" ")[0] === g)]).filter(([, rows]) => rows.length)
      .map(([g, rows]) => `<h3>${g} (${rows.length})</h3>${rows.map(auditRow).join("")}`).join("") || '<p class="empty">Nothing to audit</p>';
    return;
  }
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson(`api/ai-settings/audit?scope=${enc(sid)}`, null, {});
  if (aiCat !== "audit" || $("aiScope").value !== sid || !$("aiBack").hidden || aiAudit) return;  // moved on while loading
  if (!data?.rows) { $("aiList").innerHTML = ""; $("aiError").textContent = data ? STALE : "Couldn't run the audit. Is serve.py running?"; return; }
  aiAudit = data;
  renderAi();
}
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-research]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.research;
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const out = await post("api/ai-settings/research", {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows.find(r => r.id === id).research = {...out, alive: true};
    if ($("aiBack").hidden && aiCat === "audit") renderAudit();  // an open editor keeps its unsaved text; Back re-renders
  } catch (err) {
    if (aiAudit !== audit) return;
    b.disabled = false;
    $("aiError").textContent = err.status === 409 && /already running/.test(err.message) ? "Research is already running for this item."
      : err.status === 409 ? err.message : "Couldn't start research. Is serve.py running?";
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-toggle]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.row, on = b.dataset.toggle === "enable";
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const row = await post(`api/ai-settings/${b.dataset.toggle}`, {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows = audit.rows.map(r => r.id === id ? row : r);
    on ? aiOff.delete(id) : aiOff.add(id);
    renderAudit();
    aiRefocus([...$("aiList").querySelectorAll("button[data-toggle]")].find(x => x.dataset.row === id)
      || [...$("aiList").querySelectorAll("button[data-research]")].find(x => x.dataset.research === id));
  } catch {
    if (aiAudit !== audit) return;
    b.disabled = false; $("aiError").textContent = "Couldn't change this setting. Is serve.py running?";
    aiRefocus(b);
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const sid = $("aiScope").value;
  aiOpenedId = b.dataset.id;
  $("aiError").textContent = ""; $("aiBack").hidden = false; $("aiList").innerHTML = AI_LOADING;
  aiRefocus($("aiBack"));
  const it = await getJson(`api/ai-settings/item?id=${enc(b.dataset.id)}`, null);
  if ($("aiScope").value !== sid || $("aiBack").hidden) return;  // moved on while loading
  if (!it) return aiFail();
  aiItem = it.editable ? it : null;
  $("aiList").innerHTML = `<dl class="facts"><dt>Name</dt><dd><b>${esc(it.name)}</b></dd><dt>Scope</dt><dd><span class="skill">${esc(it.scope)}</span></dd>
    <dt>Path</dt><dd>${esc(it.path)}</dd></dl>${it.editable ? `<form id="aiEdit">
    <textarea id="aiText" spellcheck="false" aria-label="${esc(it.name)} content">${esc(it.content)}</textarea><div id="aiDiff"></div>
    <div><button class="btn primary" id="aiSave" type="submit" disabled>Save</button>
    <button class="btn" id="aiUndo" type="button" hidden>Undo</button><span class="note" id="aiStatus" role="status"></span></div></form>`
    : `<pre>${esc(it.content)}</pre>`}`;
  if (aiItem) aiItem.baseline = $("aiText").value;  // the textarea's own copy: browsers turn \r\n into \n
});
// Save and Undo both answer with the fresh item; a reply for an item the user already left is dropped.
async function aiWrite(route, body, busy, fail) {
  const form = $("aiEdit"), item = aiItem;
  delete form.dataset.leave; $("aiError").textContent = ""; $("aiStatus").textContent = busy; $("aiSave").disabled = $("aiUndo").disabled = true;
  try {
    const it = await post(`api/ai-settings/${route}`, {id: item.id, ...body});
    if (!form.isConnected) return;
    aiItem = Object.assign(it, {baseline: it.content.replace(/\r\n?/g, "\n")});
    return true;
  } catch (err) {
    if (!form.isConnected) return;
    $("aiStatus").textContent = "";
    $("aiError").textContent = err.status === 409 ? "This file changed on disk. Go back and reopen it." : err.status === 400 ? err.message : fail;
  } finally {
    if (form.isConnected) { $("aiSave").disabled = $("aiText").value === aiItem.baseline; $("aiUndo").disabled = false; }
  }
}
// A save that changes what Claude Code may run (a hook or plugin entry, an MCP server's command/args/type/url, or a
// settings file's permissions/hooks/statusLine/apiKeyHelper/otelHeadersHelper/awsAuthRefresh/awsCredentialExport)
// asks once on the Save button itself, like backlog Run/Delete; serve.py refuses it without confirm too.
const AI_JSON = ["settings", "hooks", "mcp", "plugins"];
const AI_GUARD_KEYS = {mcp: ["command", "args", "type", "url"],
  settings: ["permissions", "hooks", "statusLine", "apiKeyHelper", "otelHeadersHelper", "awsAuthRefresh", "awsCredentialExport"]};
const aiGuarded = (cat, old, now) => cat === "hooks" || cat === "plugins" ? JSON.stringify(old) !== JSON.stringify(now)
  : (AI_GUARD_KEYS[cat] || []).some(k => JSON.stringify(old?.[k]) !== JSON.stringify(now?.[k]));
function aiDisarm() {
  delete $("aiEdit").dataset.armed; $("aiDiff").innerHTML = "";
  $("aiSave").textContent = "Save"; $("aiSave").classList.remove("danger");
}
$("aiList").addEventListener("input", e => {
  if (e.target.id !== "aiText") return;
  $("aiSave").disabled = e.target.value === aiItem.baseline;
  if ($("aiEdit").dataset.armed) aiDisarm();
  if ($("aiEdit").dataset.leave) { delete $("aiEdit").dataset.leave; $("aiError").textContent = ""; }
});
$("aiList").addEventListener("submit", async e => {
  e.preventDefault();
  const form = $("aiEdit"), text = $("aiText").value, body = {content: text, version: aiItem.version};
  if (AI_JSON.includes(aiItem.category)) {
    let now;
    try { now = JSON.parse(text); } catch (err) { $("aiError").textContent = `Invalid JSON: ${err.message}`; return; }
    if (form.dataset.armed) body.confirm = true;
    else if (aiGuarded(aiItem.category, JSON.parse(aiItem.baseline), now)) {
      form.dataset.armed = "1"; $("aiError").textContent = "";
      $("aiSave").textContent = "Confirm save"; $("aiSave").classList.add("danger");
      $("aiDiff").innerHTML = diffHtml(aiItem.baseline, text); $("aiSave").scrollIntoView({block: "end"});
      return;
    }
  }
  const ok = await aiWrite("save", body, "Saving…", "Couldn't save. Is serve.py running?");
  if (form.isConnected) aiDisarm();
  if (!ok) return;
  if (AI_JSON.includes(aiItem.category)) {  // reformat to the saved file, unless the user typed on while it saved
    if ($("aiText").value === text) { $("aiText").value = aiItem.content; aiItem.baseline = $("aiText").value; }
    $("aiSave").disabled = $("aiText").value === aiItem.baseline;
  }
  $("aiStatus").textContent = "Saved"; $("aiUndo").hidden = false;
});
$("aiList").addEventListener("click", async e => {
  if (e.target.id !== "aiUndo") return;
  if (await aiWrite("undo", {version: aiItem.version}, "Undoing…", "Couldn't undo. Is serve.py running?")) {
    $("aiText").value = aiItem.content; aiItem.baseline = $("aiText").value; $("aiSave").disabled = true; aiDisarm();
    $("aiStatus").textContent = "Undone"; $("aiUndo").hidden = true;
  }
});

$("board").addEventListener("click", async e => {
  const b = e.target.closest("button[data-decide]");
  if (!b) return;
  const c = b.closest(".dcard"), btns = c.querySelectorAll("button");
  btns.forEach(x => { x.disabled = true; });
  c.querySelector(".error").textContent = "";
  try {
    await post(`api/p/${enc(c.dataset.project)}/digests/${enc(c.dataset.digest)}/${enc(c.dataset.pid)}`, {decision: b.dataset.decide});
    poll();  // the card leaves once the proposal is no longer pending
  } catch (err) {
    c.querySelector(".error").textContent = err.message;
    btns.forEach(x => { x.disabled = false; });
  }
});
$("board").addEventListener("click", e => {
  const el = e.target.closest(".card");
  const job = el && jobs.find(j => j.key === el.dataset.key);
  if (job) open(job);
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-file]");
  const job = b && jobs.find(j => j.key === $("viewer").dataset.key);
  if (job) show(job, b.dataset.file);
});
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => {
  if ((e.target === d || e.target.closest(".close")) && !(d.id === "aiSettings" && aiBlockLeave())) d.close();
}));

// Pinned by test_dashboard_routing.
function routingText(s) {
  const pct = v => typeof v === "number" ? `${Math.round(v)}%` : "—";
  return `Codex 5h ${pct(s.codex?.["5h"])} · wk ${pct(s.codex?.weekly)} · Ollama ${s.ollama === "up" ? "up" : "down"}`;
}
// Status reads a rollout file and pings Ollama, too much for the 2 s poll. A 404 (older serve.py) or an error hides it.
async function loadRouting() {
  const s = await getJson("api/routing-status", null);
  $("routing").hidden = !s;
  if (s) $("routing").textContent = routingText(s);
}

poll();
setInterval(poll, 2000);
loadRouting();
setInterval(loadRouting, 60000);
</script>
