<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevskills Scrum</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#76736b;--line:#e3e0d8;--accent:#2457d6;
  --pass:#1e8449;--changes:#c4520f;--invalid:#7a3fd6;--human:#d32f2f;--pending:#c8c4ba;
  --p1:#1e8449;--p2:#2f9e6a;--p3:#1f8fa6;--p5:#d4a514;--p8:#d9661a;--p13:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#1d1c1a;--ink:#ecebe6;--muted:#9b978e;--line:#2f2d2a;--pending:#55524c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px}
h1{font-size:16px;margin:0}
#status{color:var(--muted);font-size:12px}
main{display:grid;gap:12px;padding:0 16px 16px;overflow-x:auto}
.col h2 span{white-space:nowrap}
.col h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.col.human h2{color:var(--human)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card.human{border:2px solid var(--human);box-shadow:0 0 0 3px color-mix(in srgb,var(--human) 15%,transparent)}
.id{font:12px ui-monospace,monospace;color:var(--muted)}
.title{display:block;margin:2px 0 4px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.row b{font:600 11px ui-monospace,monospace;color:var(--muted);width:22px}
.chip{font-size:11px;padding:1px 5px;border-radius:99px;color:#fff;background:var(--pending)}
.chip.PASS{background:var(--pass)}.chip.CHANGES,.chip.FAIL{background:var(--changes)}.chip.INVALID{background:var(--invalid)}
.chip.pending{background:transparent;color:var(--muted);border:1px dashed var(--pending)}
.meta{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.meta.activity{display:flex;gap:4px;white-space:nowrap}.activity>span{flex:none}
.activity .what{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:3px;margin-top:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}.bar.done>span{background:var(--pass)}.bar.human>span{background:var(--human)}
.reason{display:block;font-size:12px;color:var(--human);margin-top:6px}
.stale{color:var(--changes)}
.empty{color:var(--muted);font-size:12px}
dialog{width:min(900px,94vw);max-height:88dvh;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:#0007}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.tabs button,#aiCats button{font:12px ui-monospace,monospace;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
.tabs button[aria-pressed="true"],#aiCats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .close{margin-left:auto}
.vhead{position:sticky;top:0;z-index:1;background:var(--card)}.vhead .tabs{position:static}
#viewerTitle{margin:0;padding:10px 10px 0;font-size:16px;overflow-wrap:anywhere;color:var(--ink)}
article{padding:4px 20px 20px;overflow-wrap:anywhere}
article pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:6px;white-space:pre-wrap}
article a{color:var(--accent)}
body:has(dialog[open]){overflow:hidden}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--human);border-color:var(--human);color:#fff}
.btn.danger-outline{background:transparent;border-color:var(--human);color:var(--human)}
.card.aborted{opacity:.55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{min-width:32px;padding:6px 8px}
#filter{margin-left:auto}
#filter,#laneFilter,#blProject,#blAskme,#aiScope,#dgProject{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:32px}
.lanechip,.badge{display:inline-block;font:600 10px system-ui,sans-serif;padding:0 5px;border-radius:4px;margin-right:6px;white-space:nowrap}
.lanechip{color:var(--muted);border:1px solid var(--line)}
.badge{color:var(--changes);border:1px solid var(--changes)}
#diverged{padding:12px 20px;border-bottom:1px solid var(--line)}#diverged:empty{display:none}
#diverged h3{font-size:13px;margin:0 0 4px}#diverged ul{margin:0;padding-left:18px;overflow-wrap:anywhere}
.tag{display:inline-block;font:600 10px system-ui,sans-serif;letter-spacing:.03em;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;background:hsl(var(--h) 50% 42%)}
header{flex-wrap:wrap}
.running{display:block;font-size:12px;color:var(--accent);margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:0}
.error{font-size:12px;color:var(--human);margin:0}
.error:empty{display:none}
#actions{display:grid;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.waiting{border:1px solid var(--human);border-radius:8px;padding:8px 12px;background:color-mix(in srgb,var(--human) 8%,var(--card))}
.waiting b{color:var(--human)}.waiting p{margin:4px 0 0;overflow-wrap:anywhere}
#actions:empty{display:none}
#actions form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{flex:1 1 320px;min-height:64px;resize:vertical}
#backlog article{display:grid;gap:10px;padding-top:14px}
#backlog .tabs{align-items:center}#blAskmeLabel{display:flex;align-items:center;gap:4px;font-size:13px}#backlog .tabs select{min-height:44px}
#blAdd{display:flex;gap:6px}
#blRunAll{font:inherit;font-size:13px;min-height:44px;min-width:44px}  /* .btn look; .tabs button would make it mono */
#blTriage summary{display:flex;align-items:center;min-height:44px;cursor:pointer;color:var(--muted);font-size:13px}
#blTriageBody{font-size:13px;overflow-wrap:anywhere}
#blAdd input{flex:1;min-width:0}
#blList{list-style:none;margin:0;padding:0}
#blList li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#blList li input{flex:1;min-width:0}
.pts{font:600 12px ui-monospace,monospace;width:46px;min-height:32px;border:0;border-radius:6px;color:#fff;background:var(--pending);text-align:center;cursor:pointer}
.pts.p1{background:var(--p1)}.pts.p2{background:var(--p2)}.pts.p3{background:var(--p3)}.pts.p5{background:var(--p5);color:#1c1b19}
.pts.p8{background:var(--p8)}.pts.p13{background:var(--p13)}
#agents,#aiSettings{width:min(1400px,96vw);max-width:none;max-height:92dvh;overflow-x:hidden;overscroll-behavior:contain}
#agents .tabs,#aiSettings .tabs,#digest .tabs{align-items:center}
#agents [hidden],#aiSettings [hidden]{display:none}
#agents .tabs button,#agents .btn,#aiSettings .tabs button,#aiCats button{min-height:44px;min-width:44px}
#agents article{display:grid;gap:10px;padding-top:14px}
#flow{display:grid;grid-template-columns:minmax(0,1fr) 44px;position:relative}
#flow>*{grid-column:1;min-width:0}
.node{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:44px;text-align:left;
  font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.node{cursor:pointer;touch-action:manipulation}
button.node:hover,button.node:focus-visible{border-color:var(--accent);outline:none}
.node b{font:600 13px ui-monospace,monospace;overflow-wrap:anywhere}
.node span{font-size:12px;color:var(--muted)}
.node.step{background:var(--bg);border-style:dashed}
#flow>.node{width:auto;max-width:100%;justify-self:center}
.arrow{text-align:center;color:var(--muted);font-size:16px;line-height:24px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:start}
.lane{display:grid;gap:4px}
#flow>.loop{grid-column:2;position:relative;border:2px solid var(--changes);border-left:0;border-radius:0 8px 8px 0;margin:21px 8px 21px 0}
.loop::before{content:"";position:absolute;left:var(--tip,-2px);top:-7px;border:6px solid transparent;border-right:8px solid var(--changes);border-left:0}
.loop span{position:absolute;top:50%;right:4px;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;color:var(--changes)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.facts dt{color:var(--muted);font-size:12px;line-height:44px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.skill{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
#agPicker{display:grid;gap:8px}
#agSkills{display:flex;flex-wrap:wrap;gap:6px}
.md{border-top:1px solid var(--line)}
#aiScope{flex:1 1 160px;min-width:0;max-width:420px;min-height:44px;text-overflow:ellipsis}
#aiSettings>.error{padding:10px 20px 0}
#aiBody{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
#aiCats{display:grid;gap:4px;padding:14px 10px}
#aiCats button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#aiList{display:grid;gap:6px;padding-top:14px}
.node .chip{color:#fff}.node .chip.pending{color:var(--muted)}
.node .path{flex-basis:100%;overflow-wrap:anywhere}
.node.over{opacity:.55}
.node.finding{justify-content:flex-start}.finding .path{color:var(--ink)}
.node .chip.high{background:var(--human)}.node .chip.medium{background:var(--changes)}
#aiEdit{display:grid;gap:8px}
#aiText{width:100%;min-height:50dvh;font:13px/1.5 ui-monospace,monospace}
#aiEdit div{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#aiEdit .btn,.audit .btn{min-height:44px;min-width:44px}
#aiList h3{font-size:13px;margin:10px 0 0}
.node.audit{justify-content:flex-start}.audit .acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.audit .acts a{display:inline-flex;align-items:center;min-height:44px}
#digest{overscroll-behavior:contain}
#digest article{display:grid;gap:10px;padding-top:14px}
#digest .btn,#digest .tabs button,#dgProject{min-height:44px;min-width:44px}
#dgNow{justify-self:start}
.dg{display:grid;gap:8px}.dg h3{font-size:13px;margin:6px 0 0}
.prop{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.prop .path{font:600 12px ui-monospace,monospace;overflow-wrap:anywhere}
.prop .diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prop .diff div{min-width:0}.prop pre{margin:4px 0 0}
.prop .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:640px){#agents,#aiSettings,#digest{width:100%;max-width:none;max-height:100dvh;border-radius:0;border-inline:0}#agents article,#aiSettings article,#digest article{padding-inline:12px}
  .prop .diff{grid-template-columns:minmax(0,1fr)}#dgProject{font-size:16px}
  #aiBody{grid-template-columns:minmax(0,1fr)}#aiCats{display:flex;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
  #aiCats button{flex:none}#aiScope,#aiText{font-size:16px}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:minmax(0,1fr)}.facts dt{line-height:1.45}}
@media (max-width:640px){main{grid-template-columns:1fr!important}#blList li{flex-wrap:wrap}#blList li input{flex-basis:100%;order:-1}#backlog .tabs select,#filter,#laneFilter{font-size:16px}}
</style>
</head>
<body>
<header><h1>Trevskills Scrum</h1><span id="status" aria-live="polite">loading…</span>
  <select id="filter" aria-label="Show project"><option value="">All projects</option></select>
  <select id="laneFilter" aria-label="Show lane"><option value="">All lanes</option><option>fast</option><option>standard</option><option>debug</option></select>
  <button class="btn" id="backlogBtn" type="button">Backlog</button>
  <button class="btn" id="digestBtn" type="button">Digest</button>
  <button class="btn" id="agentsBtn" type="button">Agents</button>
  <button class="btn" id="aiBtn" type="button">AI-Settings</button></header>
<main id="board"></main>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="vhead"><h2 id="viewerTitle"></h2><div class="tabs" id="tabs"></div></div><div id="diverged"></div><div id="actions"></div><article id="doc"></article></dialog>
<dialog id="backlog" aria-label="Backlog">
  <div class="tabs"><b>Backlog</b><select id="blProject" aria-label="Backlog project"></select><label id="blAskmeLabel">Askme <select id="blAskme" aria-label="Askme" data-agent-hint="Askme level for Run now. Off starts the job headless. 1 asks only what blocks the build, 2 a moderate number, 3 is thorough: Run now then opens an interactive Terminal window that asks Trevor questions before the spec writer runs, and saves the answers to feature.md under ## Q&amp;A."><option value="">Off</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><button class="btn" id="blRunAll" type="button" data-agent-hint="Opens /trevskills-scrum run-all in a new Terminal window: a triage first merges near-duplicates, retires items already done and estimates unpointed ones, then every open item runs as a job, one after another. Disabled when this project has no open items. Stop it by closing that window.">Run all</button><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <form id="blAdd"><input type="text" name="text" maxlength="2000" required placeholder="Add a backlog item" aria-label="New backlog item"><button class="btn primary icon" type="submit" aria-label="Add item">+</button></form>
    <p class="error" id="blError" role="alert"></p>
    <ol id="blList"></ol>
    <details id="blTriage" hidden><summary>Last triage</summary><div id="blTriageBody"></div></details>
  </article>
</dialog>
<dialog id="digest" aria-label="Digest">
  <div class="tabs"><b>Digest</b><select id="dgProject" aria-label="Digest project"></select><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <button class="btn primary" id="dgNow" type="button" data-agent-hint="Starts /trevskills-scrum digest headless: a Sonnet agent reads every done job not yet digested, and an Opus agent proposes edits to agents, rules, skills and memory. Disabled while one runs or when there is nothing new.">Digest now</button>
    <p class="error" id="dgError" role="alert"></p>
    <div id="dgList"></div>
  </article>
</dialog>
<dialog id="agents" aria-label="Agents">
  <div class="tabs"><button id="agBack" type="button" hidden>← Back</button><b>Agents</b><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <p class="error" id="agError" role="alert"></p>
    <div id="flow"></div>
    <div id="agDetail" hidden></div>
  </article>
</dialog>
<dialog id="aiSettings" aria-label="AI-Settings">
  <div class="tabs"><button id="aiBack" type="button" hidden>← Back</button><b>AI-Settings</b>
    <select id="aiScope" aria-label="Scope" data-agent-hint="Global shows managed and user config. A project shows everything that applies inside it: managed, local, project and user."></select>
    <button class="close" type="button" aria-label="Close">✕</button></div>
  <p class="error" id="aiError" role="alert"></p>
  <div id="aiBody"><nav id="aiCats" aria-label="Categories"></nav><article id="aiList"></article></div>
</dialog>
<script>
const STAGES = ["spec", "build", "check", "review", "approve", "merging", "needs-human", "done"];
// Aborted jobs are finished too: they sit, dimmed, in the done column rather than a ninth column.
const colOf = job => job.stage === "aborted" ? "done" : job.stage;
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const STALE_MS = 30 * 60 * 1000; // ponytail: fixed threshold; make it a URL param if long builds trip it
const PTS = [null, 1, 2, 3, 5, 8, 13];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Agents write the markdown, so any raw HTML in it is shown as text, never run.
if (window.marked) marked.use({renderer: {html: h => esc(typeof h === "object" ? h.text : h)}});
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
  .then(async r => { const data = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), {status: r.status}); return data; });
// A 404 from one of our own routes means serve.py predates this dashboard.html; callers pass STALE as `missing` to say so.
const STALE = "Dashboard server is out of date. Restart serve.py.";
const getJson = (url, fallback, missing = fallback) => fetch(url, {cache: "no-store"})
  .then(r => r.ok ? r.json() : r.status === 404 ? missing : fallback).catch(() => fallback);

let projects = [], jobs = [], runs = {}, backlogs = {}, lastText = "", filter = store.get("scrum.filter"), laneFilter = store.get("scrum.lane");
// No lane key = standard; a promoted fast job is standard too.
const laneOf = job => job.lane || "standard";
const shown = () => jobs.filter(j => (!filter || j.project === filter) && (!laneFilter || laneOf(j) === laneFilter));
const hue = p => [...p].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 17);
const tag = p => `<span class="tag" style="--h:${hue(p)}">${esc(p)}</span>`;

// Pinned by test_dashboard_lane_label.
function laneLabel(job) {
  const lane = laneOf(job);
  return lane === "standard" && (job.files || []).includes("promoted.md") ? "fast→standard" : lane;
}
// Bullet texts under a `## Diverged` heading, minus a lone "none". Pinned by test_dashboard_extracts_diverged_bullets.
function divergedBullets(md) {
  let inside = false;
  const out = [];
  for (const line of md.split(/\r?\n/)) {
    if (line.startsWith("## ")) inside = line === "## Diverged";
    else if (inside && line.startsWith("- ") && line.slice(2).trim().toLowerCase() !== "none") out.push(line.slice(2).trim());
  }
  return out;
}

const chip = (verdict, label) => `<span class="chip ${esc(verdict)}" title="${esc(label)}: ${esc(verdict)}">${esc(label)}</span>`;
const roundRow = (r, i) => `<span class="row"><b>R${i + 1}</b>${chip(r.check || "pending", "check")}${REVIEWERS.map(([k, l]) => chip(r[k] || "pending", l)).join("")}</span>`;
// Rough % done from the card's own data, or null for no bar (aborted / unknown stage). Pinned by test_dashboard_progress_estimate.
function progress(job) {
  const rounds = job.rounds || [], last = rounds[rounds.length - 1] || {};
  const reviewed = REVIEWERS.filter(([k]) => last[k] && last[k] !== "pending").length;
  const table = {spec: 5, build: 15, check: 30, review: 45 + 30 * reviewed / 4, approve: 80, merging: 90,
                 "needs-human": rounds.length ? 85 : 10, done: 100};
  if (!Object.hasOwn(table, job.stage)) return null;
  let pct = table[job.stage];
  // A rework round never drops the card back below where round 1 left it.
  if (job.round >= 1 && ["build", "check", "review"].includes(job.stage))
    pct = Math.max(pct, Math.min(70, 30 + 20 * job.round / Math.max(job.limit || 0, 1)));
  return Math.round(pct);
}

const ago = at => {
  const s = Math.max(0, Math.round(Date.now() / 1000 - at));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
};
const tickAgo = () => document.querySelectorAll("[data-at]").forEach(el => { el.textContent = ago(+el.dataset.at); });

function card(job) {
  const human = job.stage === "needs-human", run = runs[job.key], act = job.activity, pct = progress(job);
  const stale = !["done", "needs-human", "aborted"].includes(job.stage) && Date.now() - Date.parse(job.updatedAt) > STALE_MS;
  const staleText = `<span class="stale">stale since ${esc(new Date(job.updatedAt).toLocaleString())}</span>`;
  return `<button class="card${human ? " human" : ""}${job.stage === "aborted" ? " aborted" : ""}" data-key="${esc(job.key)}">
    ${tag(job.project)}<span class="lanechip">${esc(laneLabel(job))}</span>${job.diverged ? '<span class="badge">diverged</span>' : ""}<span class="id">${esc(job.id)}</span><span class="title">${esc(job.title)}</span>
    ${(job.rounds || []).map(roundRow).join("")}
    ${pct == null ? "" : `<span class="bar${job.stage === "done" ? " done" : human ? " human" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Estimated progress" title="~${pct}% (estimate)"><span style="width:${pct}%"></span></span>`}
    ${human && job.reason ? `<span class="reason">${esc(job.reason)}</span>` : ""}
    ${job.stage === "aborted" ? `<span class="reason">${esc(job.reason || "Aborted")}</span>` : ""}
    ${job.stage === "done" && (job.reason || "").startsWith("merged, not live") ? `<span class="reason" role="status">${esc(job.reason)}</span>` : ""}
    ${job.reopened_to ? `<span class="meta">Reopened as ${esc(job.reopened_to)}</span>` : ""}
    ${run?.alive ? `<span class="running">● ${esc(run.action)} running…</span>` : ""}
    ${act && !["done", "aborted"].includes(job.stage)
      ? `<span class="meta activity"><span class="what" title="${esc(act.text)}">${esc(act.text)}</span><span>·</span>${stale ? staleText : `<span data-at="${+act.at}">${ago(act.at)}</span>`}</span>`
      : `<span class="meta">${job.pr ? "PR ready · " : ""}${stale ? staleText : esc(new Date(job.updatedAt).toLocaleTimeString())}</span>`}
  </button>`;
}

function render() {
  const list = shown();
  const cols = [...STAGES, ...new Set(list.map(colOf).filter(s => !STAGES.includes(s)))];
  // Empty stages stay visible but narrow, so the columns holding jobs get the room.
  $("board").style.gridTemplateColumns = cols.map(s => list.some(j => colOf(j) === s) ? "minmax(230px,2fr)" : "minmax(96px,.5fr)").join(" ");
  $("board").innerHTML = cols.map(stage => {
    const inCol = list.filter(j => colOf(j) === stage);
    return `<section class="col${stage === "needs-human" ? " human" : ""}"><h2><span>${esc(stage)}</span> <span>· ${inCol.length}</span></h2>
      ${inCol.map(card).join("") || '<p class="empty">—</p>'}</section>`;
  }).join("");
  const open = projects.filter(p => !filter || p === filter).reduce((n, p) => n + (backlogs[p] || []).filter(i => !i.done).length, 0);
  $("backlogBtn").textContent = `Backlog · ${open}`;
  $("status").textContent = projects.length
    ? `${list.length} job${list.length === 1 ? "" : "s"} · ${projects.length} project${projects.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`
    : "No projects yet. Run /trevskills-scrum in a repo and it shows up here.";
}

function renderSelect(sel, value, withAll) {
  const want = (withAll ? [""] : []).concat(projects).join("\n");
  if (sel.dataset.list !== want) {
    sel.dataset.list = want;
    sel.innerHTML = (withAll ? '<option value="">All projects</option>' : "") + projects.map(p => `<option>${esc(p)}</option>`).join("");
  }
  sel.value = value;
}

async function poll() {
  try {
    const res = await fetch("api/projects", {cache: "no-store"});
    if (res.status === 404) return $("status").textContent = STALE;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    projects = (await res.json()).map(p => p.name);
    if (filter && !projects.includes(filter)) filter = "";
    const [boards, items, runList] = await Promise.all([
      Promise.all(projects.map(p => getJson(`p/${enc(p)}/board.json`, {jobs: []}))),
      Promise.all(projects.map(p => getJson(`api/p/${enc(p)}/backlog`, []))),
      getJson("api/runs", [])]);
    const all = boards.flatMap((b, i) => (b.jobs || []).map(j => ({...j, project: projects[i], key: `${projects[i]}/${j.id}`})));
    runs = Object.fromEntries(runList.map(r => [`${r.project}/${r.id}`, r]));
    auditRunsChanged();
    const nextBacklogs = Object.fromEntries(projects.map((p, i) => [p, items[i]]));
    const backlogChanged = JSON.stringify(nextBacklogs) !== JSON.stringify(backlogs);
    backlogs = nextBacklogs;
    renderSelect($("filter"), filter, true);
    const text = JSON.stringify([all, runs, backlogs, filter]);
    if (text !== lastText) {
      jobs = all; lastText = text; render();
      const openJob = $("viewer").open && jobs.find(j => j.key === $("viewer").dataset.key);
      if (openJob && !$("actions").contains(document.activeElement)) renderActions(openJob);
    }
    if (backlogChanged && $("backlog").open && !editingBacklog()) renderBacklog();
    if ($("digest").open) loadDigests();
    tickAgo();
  } catch (e) {
    $("status").textContent = `Can't reach the dashboard server (${e.message}). Open the Trevskills Scrum app, or run python3 ~/.claude/skills/trevskills-scrum/serve.py`;
  }
}

$("filter").addEventListener("change", e => { filter = e.target.value; store.set("scrum.filter", filter); lastText = ""; poll(); });
$("laneFilter").value = laneFilter;
if ($("laneFilter").value !== laneFilter) laneFilter = "";  // a stored value that is no longer an option
$("laneFilter").addEventListener("change", e => { laneFilter = e.target.value; store.set("scrum.lane", laneFilter); render(); });

async function show(job, file) {
  [...$("tabs").querySelectorAll("button[data-file]")].forEach(b => b.setAttribute("aria-pressed", b.dataset.file === file));
  const url = `p/${enc(job.project)}/jobs/${enc(job.id)}/${file.split("/").map(enc).join("/")}`;
  try {
    const res = await fetch(url, {cache: "no-store"});
    if (!res.ok) throw new Error(`${res.status}`);
    const md = await res.text();
    $("doc").innerHTML = window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
  } catch (e) {
    $("doc").innerHTML = `<p class="empty">Couldn't load ${esc(file)} (${esc(e.message)}).</p>`;
  }
}

function open(job) {
  $("viewer").dataset.key = job.key;
  $("viewerTitle").textContent = job.title || job.id;
  const files = job.files || [];
  const pr = job.pr ? `<a href="${esc(job.pr)}" target="_blank" rel="noopener">PR ↗</a>` : "";
  $("tabs").innerHTML = tag(job.project) + files.map(f => `<button data-file="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("")
    + pr + '<button class="close" aria-label="Close">✕</button>';
  $("doc").innerHTML = files.length ? "" : '<p class="empty">No files yet.</p>';
  if (!termState[job.key]?.pending) delete termState[job.key];
  renderActions(job);
  renderDiverged(job);
  if (!$("viewer").open) $("viewer").showModal();
  const first = files.includes("decision.md") ? "decision.md" : files.includes("spec.md") ? "spec.md" : files[0];
  if (first) show(job, first);
}

// Diverged bullets are read from the served files, not board.json; a file that fails to load is skipped.
async function renderDiverged(job) {
  const el = $("diverged");
  el.innerHTML = "";
  if (!job.diverged) return;
  const files = ["spec.md", "build.md", "assessment.md"].filter(f => (job.files || []).includes(f));
  const found = await Promise.all(files.map(f => fetch(`p/${enc(job.project)}/jobs/${enc(job.id)}/${f}`, {cache: "no-store"})
    .then(r => r.ok ? r.text() : "").catch(() => "").then(md => divergedBullets(md).map(b => [f, b]))));
  const items = found.flat();
  if ($("viewer").dataset.key !== job.key || !items.length) return;
  el.innerHTML = `<h3 data-agent-hint="Every bullet under a ## Diverged heading in this job's spec.md, build.md and assessment.md: where an agent departed from feature.md or spec.md, and why.">Diverged</h3>
    <ul>${items.map(([f, b]) => `<li><span class="lanechip">${esc(f)}</span>${esc(b)}</li>`).join("")}</ul>`;
}

// Abort works on any unfinished job: it stops a dashboard-started run and marks the job aborted (code is kept).
const abortForm = job => ["done", "aborted"].includes(job.stage) ? "" : `<form data-act="abort">
    <label hidden><input type="checkbox" name="requeue"> Put back in backlog</label>
    <button class="btn danger-outline" type="submit">Abort job</button></form>`;
// Reopen starts a new linked job from a finished one; once reopened, the button jumps to that job instead.
const reopenForm = job => !["done", "aborted"].includes(job.stage) ? ""
  : job.reopened_to ? `<form data-act="goto" data-key="${esc(`${job.project}/${job.reopened_to}`)}"><button class="btn" type="submit">Reopened as ${esc(job.reopened_to)}</button></form>`
  : `<form data-act="reopen"><textarea name="note" required maxlength="2000" placeholder="What should the follow-up job do?" aria-label="Note for the reopened job"></textarea>
    <button class="btn" type="submit">Reopen</button></form>`;

// Open terminal: kept per job outside the DOM, so a polling re-render keeps the pending state and the message.
const termState = {};
function termForm(job) {
  if (!job.tty && !job.runlog && !runs[job.key]?.log) return "";
  const st = termState[job.key] || {};
  return `<form data-act="terminal"><button class="btn" type="submit"${st.pending ? " disabled" : ""}>Open terminal</button>${
    st.err ? `<span class="error" role="alert">${esc(st.err)}</span>` : st.msg ? `<span class="note" role="status">${esc(st.msg)}</span>` : ""}</form>`;
}
const redrawTerm = key => {
  const job = jobs.find(j => j.key === key), form = $("actions").querySelector('form[data-act="terminal"]');
  if (job && form && $("viewer").dataset.key === key) form.outerHTML = termForm(job);
};
async function openTerminal(key) {
  const job = jobs.find(j => j.key === key);
  if (!job || termState[key]?.pending) return;
  termState[key] = {pending: true}; redrawTerm(key);
  try {
    const out = await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/terminal`, {});
    termState[key] = {msg: out.message || ""};
  } catch (err) { termState[key] = {err: err.message}; }
  redrawTerm(key);
}

// Next step for a needs-human job, picked from the reason prefix the orchestrator writes.
const nextStep = (reason, worktree) =>
  /^obsolete/.test(reason) ? "Abort this job."
  : /^(blocked|spec writer)/.test(reason) ? "Send back to builder with feedback, or abort."
  : /Hard stop: schema/.test(reason) ? "Approve & merge runs /trevskills-migrate first. Tick the box only if you already ran it."
  : worktree ? "Approve & merge, or send back to builder."
  : "Send back to builder, or abort.";
const waitingBanner = job => job.stage !== "needs-human" ? "" : `<div class="waiting"
    data-agent-hint="This job stopped and needs Trevor. The first line is the reason the orchestrator recorded; the second is the suggested next action.">
    <b>Waiting on you</b><p>${esc(job.reason || "No reason recorded.")}</p><p>${esc(nextStep(job.reason || "", job.worktree))}</p></div>`;

function renderActions(job) {
  const el = $("actions"), run = runs[job.key], reason = job.reason || "", banner = waitingBanner(job);
  const log = run ? ` · <a href="p/${enc(job.project)}/${esc(run.log)}" target="_blank" rel="noopener">log</a>` : "";
  const err = '<p class="error" role="alert"></p>';
  if (run?.alive) return el.innerHTML = banner + `<p class="running">● ${esc(run.action)} running…${log}</p>` + termForm(job) + abortForm(job) + err;
  const last = run ? `<p class="note">Last ${esc(run.action)} run ${run.exit === 0 ? "finished" : run.exit < 0 ? "stopped by Abort" : `failed (exit ${esc(run.exit)})`}${log}</p>` : "";
  const why = job.stage === "aborted" && reason ? `<p class="note">${esc(reason)}</p>` : "";
  if (job.stage !== "needs-human") return el.innerHTML = why + last + reopenForm(job) + termForm(job) + abortForm(job) + err;
  const obsolete = /^obsolete/.test(reason), canApprove = job.worktree && !/^(blocked|spec writer|obsolete)/.test(reason);
  el.innerHTML = banner + last + (canApprove ? `<form data-act="approve">
      ${/Hard stop: schema/.test(reason) ? '<label><input type="checkbox" name="migrated"> I already ran /trevskills-migrate (skip it)</label>' : ""}
      <button class="btn primary" type="submit">Approve &amp; merge</button></form>` : "")
    + (obsolete ? "" : `<form data-act="rework"><textarea name="feedback" required maxlength="2000" placeholder="What should the builder change?" aria-label="Feedback for the builder"></textarea>
      <button class="btn" type="submit" data-act="discuss" formnovalidate data-agent-hint="Opens an interactive Claude session in a new Terminal window that explains why the job stopped and what a rework can or cannot fix, then runs the approve or rework you agree on.">Discuss first</button>
      <button class="btn" type="submit">Send back to builder</button></form>`) + termForm(job) + abortForm(job) + err;
}

$("actions").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, btn = e.submitter || form.querySelector("button"), act = btn.dataset.act || form.dataset.act, key = $("viewer").dataset.key;
  const job = jobs.find(j => j.key === key);
  if (act === "terminal") return openTerminal(key);
  if (act === "goto") { const linked = jobs.find(j => j.key === form.dataset.key); if (linked) open(linked); return; }
  if (act === "approve" && !form.dataset.armed) { form.dataset.armed = "1"; btn.textContent = "Confirm: merge into main"; return; }
  if (act === "abort" && !form.dataset.armed) {
    form.dataset.armed = "1"; form.querySelector("label").hidden = false;
    btn.textContent = "Confirm abort"; btn.className = "btn danger"; return;
  }
  btn.disabled = true;
  try {
    const body = act === "approve" ? {migrated: !!form.migrated?.checked} : act === "abort" ? {requeue: form.requeue.checked}
      : act === "reopen" ? {note: form.note.value} : {feedback: form.feedback.value};
    const out = await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/${act}`, body);
    if (act === "discuss") { btn.disabled = false; btn.textContent = "Opened in Terminal"; return; }
    await poll();
    const linked = act === "reopen" && jobs.find(j => j.key === `${job.project}/${out.id}`);
    if (linked) return open(linked);
    renderActions(jobs.find(j => j.key === key));
  } catch (err) {
    btn.disabled = false;
    $("actions").querySelector(".error").textContent = err.message;
  }
});

const blProject = () => $("blProject").value;
const editingBacklog = () => !!$("blList").querySelector("[data-armed]") || ($("blList").contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName));

function renderBacklog() {
  $("blAdd").hidden = !projects.length;
  $("blRunAll").disabled = !projects.length;
  if (!projects.length) return $("blList").innerHTML = '<li class="note">No projects yet. Run /trevskills-scrum in a repo first.</li>';
  const open = (backlogs[blProject()] || []).filter(i => !i.done);
  $("blRunAll").disabled = !open.length;
  $("blList").innerHTML = open.map((it, n) => `<li data-i="${it.index}">
      <select class="pts p${it.points ?? "x"}" aria-label="Difficulty points" title="${esc(it.why || "Not estimated yet")}">
        ${PTS.map(p => `<option value="${p ?? ""}"${p === it.points ? " selected" : ""}>${p ?? "?"}</option>`).join("")}</select>
      <input type="text" value="${esc(it.text)}" maxlength="2000" aria-label="Item text">
      <button class="btn icon" type="button" data-do="up" aria-label="Move up"${n === 0 ? " disabled" : ""}>↑</button>
      <button class="btn icon" type="button" data-do="down" aria-label="Move down"${n === open.length - 1 ? " disabled" : ""}>↓</button>
      <button class="btn icon" type="button" data-do="run" aria-label="Run now">▶</button>
      <button class="btn icon" type="button" data-do="delete" aria-label="Delete">✕</button>
    </li>`).join("") || '<li class="note">Backlog is empty.</li>';
}

async function backlogCall(fn) {
  $("blError").textContent = "";
  try { await fn(`api/p/${enc(blProject())}/backlog`); } catch (err) { $("blError").textContent = err.message; }
  await poll();
  renderBacklog();
}

// A dialog's project picker opens on the board filter, else the last project picked there, else the first.
function pickProject(sel, key) {
  renderSelect(sel, filter || store.get(key) || projects[0] || "", false);
  if (!sel.value && projects.length) sel.value = projects[0];
}

// The latest triage report (scrum/triage/latest.md) for the picked project, collapsed; hidden when there is none.
// Run all disarms on every open, project change and finished call, so a stale "Run all?" never fires for another project.
function disarmRunAll() {
  const b = $("blRunAll");
  delete b.dataset.armed; b.textContent = "Run all"; b.classList.remove("primary");
}
async function showProjectBacklog() {
  disarmRunAll();
  renderBacklog();
  const p = blProject();
  const res = p ? await fetch(`p/${enc(p)}/triage/latest.md`, {cache: "no-store"}).catch(() => null) : null;
  const md = res?.ok ? await res.text() : "";
  if (p !== blProject()) return;
  $("blTriage").hidden = !md;
  $("blTriageBody").innerHTML = !md ? "" : window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
}
$("backlogBtn").addEventListener("click", () => {
  pickProject($("blProject"), "scrum.backlogProject");
  showProjectBacklog();
  $("backlog").showModal();
});
$("blProject").addEventListener("change", e => { store.set("scrum.backlogProject", e.target.value); showProjectBacklog(); });
$("blRunAll").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Run all?"; b.classList.add("primary"); return; }
  b.disabled = true;
  backlogCall(url => post(`${url}/run-all`, {}).then(() => $("backlog").close())).then(disarmRunAll);
});
$("blAskme").value = store.get("scrum.askme");
$("blAskme").addEventListener("change", e => store.set("scrum.askme", e.target.value));
$("blAdd").addEventListener("submit", e => {
  e.preventDefault();
  const input = e.target.text;
  backlogCall(async url => { await post(url, {op: "add", text: input.value}); input.value = ""; });
});
$("blList").addEventListener("click", e => {
  const b = e.target.closest("button[data-do]");
  if (!b) return;
  const index = +b.closest("li").dataset.i, act = b.dataset.do;
  // Run and Delete ask once on the button itself; no native confirm().
  if ((act === "run" || act === "delete") && !b.dataset.armed) {
    b.dataset.armed = "1"; b.textContent = act === "run" ? "Run?" : "Delete?"; b.classList.add(act === "run" ? "primary" : "danger");
    return;
  }
  b.disabled = true;
  const askme = $("blAskme").value;
  backlogCall(url => act === "run" ? post(`${url}/run`, {index, ...(askme ? {askme: +askme} : {})}).then(() => $("backlog").close())
    : post(url, act === "delete" ? {op: "delete", index} : {op: "move", index, delta: act === "up" ? -1 : 1}));
});
$("blList").addEventListener("change", e => {
  const index = +e.target.closest("li").dataset.i;
  backlogCall(url => post(url, e.target.tagName === "SELECT"
    ? {op: "edit", index, points: e.target.value ? +e.target.value : null} : {op: "edit", index, text: e.target.value}));
});
$("blList").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur(); });

// Digest: proposals from scrum/digests/<NNN>/proposals.json. Approve applies a global edit (backed up) or queues a repo
// edit on that repo's backlog; serve.py decides which. The last decision in a digest trims its job folders.
let digestData = null, digestText = "";
const dgProject = () => $("dgProject").value;
const propRow = (digestId, p) => `<div class="prop" data-digest="${esc(digestId)}" data-pid="${esc(p.id)}">
    <span class="path">${esc(p.target)}</span><span>${esc(p.why)}</span>
    <div class="diff"><div><span class="note">Old</span><pre>${esc(p.old)}</pre></div><div><span class="note">New</span><pre>${esc(p.new)}</pre></div></div>
    <div class="acts">${p.status === "pending"
      ? `<button class="btn primary" type="button" data-decide="approve" data-agent-hint="A file outside every registered repo is edited in place after a backup to ~/.claude/backups/ai-settings/. A file inside a repo is not touched: the edit is added to that repo's backlog instead.">Approve</button>
         <button class="btn" type="button" data-decide="reject">Reject</button>`
      : `<span class="note" role="status">${esc(p.status)}</span>`}</div></div>`;

function renderDigests() {
  $("dgNow").hidden = !projects.length;
  if (!projects.length) return $("dgList").innerHTML = '<p class="note">No projects yet. Run /trevskills-scrum in a repo first.</p>';
  const d = digestData;
  $("dgNow").disabled = !d || d.running || !d.undigested;
  $("dgNow").textContent = d?.running ? "Digesting…" : "Digest now";
  if (!d) return $("dgList").innerHTML = '<p class="empty">loading…</p>';
  $("dgList").innerHTML = d.digests.map(g => `<section class="dg"><h3>Digest ${esc(g.id)} · ${g.jobs.length} job${g.jobs.length === 1 ? "" : "s"}</h3>
      ${g.error ? `<p class="error">${esc(g.error)}</p>` : g.proposals.map(p => propRow(g.id, p)).join("") || '<p class="empty">No proposals</p>'}</section>`).join("")
    || '<p class="empty">No digests</p>';
}

async function loadDigests() {
  const p = dgProject();
  if (!p) return renderDigests();
  const data = await getJson(`api/p/${enc(p)}/digests`, null, STALE);
  if (dgProject() !== p) return;  // a newer project pick is already loading
  if (!data?.digests) return $("dgError").textContent = data || "Couldn't load digests. Is serve.py running?";
  const text = JSON.stringify(data);
  if (text === digestText) return;  // unchanged: keep the DOM (and focus) as it is
  digestText = text; digestData = data;
  renderDigests();
}

async function digestCall(url, body) {
  $("dgError").textContent = "";
  try { await post(url, body); } catch (err) { $("dgError").textContent = err.message; }
  digestText = "";  // re-render even if nothing changed, so a failed click's buttons come back
  await loadDigests();
}

$("digestBtn").addEventListener("click", () => {
  pickProject($("dgProject"), "scrum.digestProject");
  digestData = null; digestText = ""; $("dgError").textContent = "";
  renderDigests();
  $("digest").showModal();
  loadDigests();
});
$("dgProject").addEventListener("change", e => {
  store.set("scrum.digestProject", e.target.value);
  digestData = null; digestText = ""; $("dgError").textContent = "";
  renderDigests(); loadDigests();
});
$("dgNow").addEventListener("click", () => {
  $("dgNow").disabled = true;
  digestCall(`api/p/${enc(dgProject())}/digest`, {});
});
$("dgList").addEventListener("click", e => {
  const b = e.target.closest("button[data-decide]");
  if (!b) return;
  const row = b.closest(".prop");
  row.querySelectorAll("button").forEach(x => { x.disabled = true; });
  digestCall(`api/p/${enc(dgProject())}/digests/${enc(row.dataset.digest)}/${enc(row.dataset.pid)}`, {decision: b.dataset.decide});
});

// The pipeline order is fixed by SKILL.md, so it lives here; everything about each agent comes from api/agents.
const PIPELINE = [
  {step: "Orchestrator", note: "main session", hint: "The /trevskills-scrum skill runs in the main Claude session, spawns every agent and moves the job between stages."},
  "scrum-spec-writer", "scrum-builder",
  {step: "Check gate", note: "test · lint · build", hint: "Runs the project's test, typecheck, lint and build commands; a failure goes back to the builder."},
  ["scrum-review-security", "scrum-review-ux", "scrum-review-ui", "scrum-review-code"],
  "scrum-approver",
  {step: "PR / merge", note: "squash-merge", hint: "On APPROVE the orchestrator pushes scrum/<id>, opens a PR, waits for CI and squash-merges."}];
const CODEX = {step: "Codex", note: "read-only", hint: "codex exec review runs alongside scrum-review-code; the reviewer confirms each finding and tags it (codex)."};
let agents = [], skills = null;
const modelLabel = a => a.name === "scrum-approver" ? `${a.model} · sonnet if all green` : a.model || "—";
const stepNode = s => `<div class="node step" data-agent-hint="${esc(s.hint)}"><b>${esc(s.step)}</b><span>${esc(s.note)}</span></div>`;
const agentNode = name => {
  const a = agents.find(x => x.name === name);
  return a ? `<button class="node" type="button" data-agent="${esc(a.name)}"><b>${esc(a.name)}</b><span>${esc(modelLabel(a))}</span></button>` : "";
};
const ARROW = '<div class="arrow" aria-hidden="true">↓</div>';

function renderFlow() {
  const known = PIPELINE.flat().filter(x => typeof x === "string");
  const extra = agents.map(a => a.name).filter(n => !known.includes(n));
  const rows = [...PIPELINE, ...extra].map(x => typeof x === "string" ? agentNode(x) : Array.isArray(x)
    ? `<div class="lanes">${x.map(n => `<div class="lane">${agentNode(n)}${n === "scrum-review-code" ? stepNode(CODEX) : ""}</div>`).join("")}</div>`
    : stepNode(x));
  const row = name => 2 * PIPELINE.indexOf(name) + 1;  // every node row is followed by an arrow row
  $("flow").innerHTML = rows.join(ARROW) + `<div class="loop" style="grid-row:${row("scrum-builder")}/${row("scrum-approver") + 1}"
    data-agent-hint="When the approver decides CHANGES or REWORK, the job goes back to the builder for another round."><span>changes · rework</span></div>`;
  alignLoop();
}

// The loop's ends meet the middle of the builder and approver nodes, whose height changes when a label wraps.
// Nodes are centred and content-sized, so a negative left margin stretches the loop from its own column back to the
// narrower node's right edge; it runs behind the wider one (nodes sit above it), and --tip moves the arrowhead out to
// the builder's own edge. Spanning both columns instead would push the auto-placed nodes out of the loop's rows.
function alignLoop() {
  const flow = $("flow"), loop = flow.querySelector(".loop"), node = n => flow.querySelector(`[data-agent="${n}"]`);
  const b = node("scrum-builder"), a = node("scrum-approver");
  if (!loop || !b || !a || flow.hidden) return;
  const left = Math.min(b.offsetLeft + b.offsetWidth, a.offsetLeft + a.offsetWidth) - 2;
  const col = parseFloat(getComputedStyle(flow).gridTemplateColumns);  // width of the node column = where the loop's column starts
  loop.style.margin = `${b.offsetHeight / 2 - 1}px 8px ${a.offsetHeight / 2 - 1}px ${left - col}px`;
  loop.style.setProperty("--tip", `${b.offsetLeft + b.offsetWidth - left}px`);
}
window.addEventListener("resize", () => { if ($("agents").open) alignLoop(); });

function showAgents(name) {
  const a = name && agents.find(x => x.name === name);
  $("flow").hidden = !!a; $("agDetail").hidden = !a; $("agBack").hidden = !a;
  if (!a) return alignLoop();
  $("agDetail").innerHTML = `<dl class="facts">
      <dt>Agent</dt><dd><b>${esc(a.name)}</b></dd>
      <dt>Model</dt><dd>${esc(modelLabel(a))}</dd>
      <dt>Tools</dt><dd>${esc(a.tools || "—")}</dd>
      <dt>Description</dt><dd>${esc(a.description || "—")}</dd>
      <dt>Skills</dt><dd>${a.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("") || '<span class="empty">None</span>'}
        <button class="btn icon" id="agAdd" type="button" aria-label="Add skill" aria-expanded="false">+</button></dd></dl>
    <form id="agPicker" hidden><input type="text" id="agFilter" placeholder="Filter skills" aria-label="Filter skills" autocomplete="off">
      <div id="agSkills"></div></form>
    <div class="md">${window.marked ? marked.parse(a.body) : `<pre>${esc(a.body)}</pre>`}</div>`;
  $("agDetail").dataset.agent = a.name;
}

function renderSkills() {
  const a = agents.find(x => x.name === $("agDetail").dataset.agent), q = $("agFilter").value.trim().toLowerCase();
  const left = (skills || []).filter(s => !a.skills.includes(s.name));
  const hits = left.filter(s => s.name.toLowerCase().includes(q));
  $("agSkills").innerHTML = !skills ? '<p class="empty">loading…</p>'
    : hits.map(s => `<button class="btn" type="button" data-skill="${esc(s.name)}">${esc(s.name)}</button>`).join("")
      || `<p class="empty">${left.length ? "No match." : "No other skills installed."}</p>`;
}

async function addSkill(skill, btn) {
  if (btn.disabled) return;  // already pending: one POST per button
  const name = $("agDetail").dataset.agent;
  $("agError").textContent = ""; btn.disabled = true; btn.textContent = "Adding…";
  try {
    const updated = await post(`api/agents/${enc(name)}/skills`, {skill});
    agents = agents.map(x => x.name === name ? updated : x);
    renderFlow(); showAgents(name);
  } catch (err) { btn.disabled = false; btn.textContent = skill; $("agError").textContent = err.message; }
}

$("agentsBtn").addEventListener("click", async () => {
  $("agError").textContent = ""; skills = null;
  $("flow").innerHTML = '<p class="empty">loading…</p>';
  showAgents(null);
  $("agents").showModal();
  const list = await getJson("api/agents", null, STALE);
  if (!Array.isArray(list)) {
    $("flow").innerHTML = "";
    return $("agError").textContent = list || "Couldn't load agents. Is serve.py running?";
  }
  agents = list;
  renderFlow();
});
$("agBack").addEventListener("click", () => showAgents(null));
$("flow").addEventListener("click", e => {
  const b = e.target.closest("[data-agent]");
  if (b) { $("agError").textContent = ""; showAgents(b.dataset.agent); }
});
$("agDetail").addEventListener("click", async e => {
  if (e.target.id === "agAdd") {
    const open = $("agPicker").hidden;
    $("agPicker").hidden = !open; e.target.setAttribute("aria-expanded", open);
    if (!open) return;
    renderSkills(); $("agFilter").focus();
    if (!skills) {
      const list = await getJson("api/skills", null, STALE);
      if (!Array.isArray(list)) { $("agError").textContent = list || "Couldn't load installed skills."; return $("agPicker").hidden = true; }
      skills = list;
      renderSkills();
    }
  }
  const b = e.target.closest("button[data-skill]");
  if (b) addSkill(b.dataset.skill, b);
});
$("agDetail").addEventListener("input", e => { if (e.target.id === "agFilter") renderSkills(); });
$("agDetail").addEventListener("submit", e => {  // Enter in the filter picks the first match
  e.preventDefault();
  const b = $("agSkills").querySelector("button[data-skill]");
  if (b) addSkill(b.dataset.skill, b);
});

// AI-Settings: items come from api/ai-settings; precedence is managed > local > project > user. Only `editable` items
// (Markdown CLAUDE.md, CLAUDE.local.md, rules, memory) get a textarea; serve.py backs up every save, and Undo restores
// the newest backup. Everything else is a read-only <pre>.
const AI_GROUPS = [["global", "Global"], ["registered", "Registered"], ["mac", "This Mac"]];
const AI_LOADING = '<p class="empty">loading…</p>';
let aiData = null, aiCat = "", aiItem = null;  // aiItem: the editable item on screen, with its last saved version
let aiFindings = null;  // the last Security scan; it covers every scope, so a scope change keeps it
let aiAudit = null, aiOff = new Set();  // the current scope's audit, and rows Disabled on this visit (they offer Undo)
const aiFail = () => { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't load AI settings. Is serve.py running?"; };
const aiRow = it => `<button class="node${it.status === "overridden" ? " over" : ""}" type="button" data-id="${esc(it.id)}">
    <b>${esc(it.name)}</b><span><span class="skill">${esc(it.scope)}</span>${it.status ? ` <span class="chip ${it.status === "wins" ? "PASS" : "pending"}">${esc(it.status)}</span>` : ""}</span>
    <span class="path">${esc(it.path)}</span></button>`;

function renderAi() {
  $("aiBack").hidden = true;
  $("aiCats").innerHTML = aiData.categories.map(c => `<button type="button" data-cat="${esc(c.key)}" aria-pressed="${c.key === aiCat}"><span>${esc(c.label)}</span><span>${c.count}</span></button>`).join("")
    + `<button type="button" data-cat="security" aria-pressed="${aiCat === "security"}" data-agent-hint="Scans every scope's config files for risky hooks, allow rules, skills and MCP secrets. Reads files only."><span>Security</span><span>${aiFindings ? aiFindings.length : ""}</span></button>`
    + `<button type="button" data-cat="audit" aria-pressed="${aiCat === "audit"}" data-agent-hint="Usage, always-loaded tokens and problems per item, with a Keep / Improve / Retire / Merge verdict. Disable flips one settings key and can be undone."><span>Audit</span><span>${aiAudit ? aiAudit.rows.length : ""}</span></button>`;
  if (aiCat === "security") return renderFindings();
  if (aiCat === "audit") return renderAudit();
  const cat = aiData.categories.find(c => c.key === aiCat);
  $("aiList").innerHTML = cat.items.map(aiRow).join("") || '<p class="empty">None</p>';
}

async function aiLoadScope() {
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = true; $("aiList").innerHTML = AI_LOADING;
  aiAudit = null; aiOff.clear();
  const data = await getJson(`api/ai-settings?scope=${enc(sid)}`, null);
  if ($("aiScope").value !== sid) return;  // a newer scope pick is already loading
  if (!data) return aiFail();
  aiData = data;
  if (!["security", "audit"].includes(aiCat) && !aiData.categories.some(c => c.key === aiCat)) aiCat = aiData.categories[0].key;
  renderAi();
}

$("aiBtn").addEventListener("click", async () => {
  $("aiError").textContent = ""; $("aiScope").innerHTML = ""; $("aiCats").innerHTML = ""; $("aiBack").hidden = true;
  $("aiList").innerHTML = AI_LOADING; aiData = null; aiCat = ""; aiFindings = null; aiAudit = null; aiOff.clear();
  $("aiSettings").showModal();
  const scopes = await getJson("api/ai-settings", null);
  if (!scopes) return aiFail();
  $("aiScope").innerHTML = AI_GROUPS.filter(([g]) => scopes[g]?.length).map(([g, label]) => `<optgroup label="${label}">${
    scopes[g].map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
  $("aiScope").value = "global";
  aiLoadScope();
});
$("aiScope").addEventListener("change", aiLoadScope);
$("aiBack").addEventListener("click", renderAi);
$("aiCats").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b || !aiData) return;
  aiCat = b.dataset.cat; $("aiError").textContent = "";
  if (aiCat === "security") aiFindings = null;  // every click runs a fresh scan
  aiAudit = null; aiOff.clear();  // leaving or re-entering Audit reloads it and drops Undo
  renderAi();
});
const findingRow = f => `<div class="node finding"><span class="chip ${f.severity === "low" ? "pending" : esc(f.severity)}">${esc(f.severity)}</span>
    <b>${esc(f.file)}${f.line == null ? "" : `:${esc(f.line)}`}</b><span class="path">${esc(f.fix)}</span></div>`;
async function renderFindings() {
  if (aiFindings) {
    $("aiList").innerHTML = aiFindings.map(findingRow).join("") || '<p class="empty">No risky config found</p>';
    return;
  }
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson("api/ai-settings/security", null);
  if (aiCat !== "security" || !$("aiBack").hidden || aiFindings) return;  // moved on, or a newer scan already landed
  if (!data?.findings) { $("aiList").innerHTML = ""; $("aiError").textContent = "Couldn't run the security scan. Is serve.py running?"; return; }
  aiFindings = data.findings;
  renderAi();
}
const AUDIT_GROUPS = ["Retire", "Merge", "Improve", "Keep"];
const auditFlag = f => f.startsWith("overlap:") ? `overlap: ${aiAudit.rows.find(r => r.id === f.slice(8))?.name ?? "?"}` : f;
const auditRow = r => `<div class="node audit"><b>${esc(r.name)}</b><span><span class="skill">${esc(r.scope)}</span> ${esc(r.category)}</span>
    <span>uses ${r.lifetime ?? "—"} · recent ${r.recent ?? "—"} · ${r.tokens == null ? "—" : `~${r.tokens}`} tok</span>${r.flags.length ? `<span>${esc(r.flags.map(auditFlag).join(", "))}</span>` : ""}
    <span class="acts">${researchActs(r)}${aiOff.has(r.id) ? `<span class="note" role="status">Disabled</span><button class="btn" type="button" data-toggle="enable" data-row="${esc(r.id)}">Undo</button>`
      : r.disable ? `<button class="btn" type="button" data-toggle="disable" data-row="${esc(r.id)}">Disable</button>` : ""}</span>
    <span class="path">${esc(r.verdict.startsWith("Merge") ? `${r.verdict}. ${r.reason}` : r.reason)}</span></div>`;
// Research this: a read-only claude run per row whose log holds the suggested edits; Edit opens the 2/5 editor to apply them.
const researchActs = r => {
  const rs = r.research, log = rs && `p/${enc(rs.project)}/${esc(rs.log)}`;
  return (rs?.alive ? `<span class="note" role="status">Researching…</span><a href="${log}" target="_blank" rel="noopener">log</a>`
      : rs ? `<a href="${log}" target="_blank" rel="noopener">Suggestions</a>` : "")
    + `<button class="btn" type="button" data-research="${esc(r.id)}"${rs?.alive ? " disabled" : ""} data-agent-hint="Starts a read-only claude run that compares this item with current Anthropic docs and top repos and replies with suggested edits. It changes no files.">Research this</button>`
    + (["rules", "config"].includes(r.category) ? `<button class="btn" type="button" data-id="${esc(r.id)}">Edit</button>` : "");
};
// Called by poll(): flips a row from Researching… to Suggestions once its run has ended; no extra polling.
function auditRunsChanged() {
  let changed = false;
  for (const r of aiAudit?.rows || []) {
    const run = r.research && runs[`${r.research.project}/${r.research.key}`];
    if (run && run.alive !== r.research.alive) { r.research.alive = run.alive; changed = true; }
  }
  if (changed && aiCat === "audit" && $("aiBack").hidden && $("aiSettings").open) renderAudit();
}
async function renderAudit() {
  if (aiAudit) {
    $("aiList").innerHTML = AUDIT_GROUPS.map(g => [g, aiAudit.rows.filter(r => r.verdict.split(" ")[0] === g)]).filter(([, rows]) => rows.length)
      .map(([g, rows]) => `<h3>${g} (${rows.length})</h3>${rows.map(auditRow).join("")}`).join("") || '<p class="empty">Nothing to audit</p>';
    return;
  }
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiList").innerHTML = AI_LOADING;
  const data = await getJson(`api/ai-settings/audit?scope=${enc(sid)}`, null, {});
  if (aiCat !== "audit" || $("aiScope").value !== sid || !$("aiBack").hidden || aiAudit) return;  // moved on while loading
  if (!data?.rows) { $("aiList").innerHTML = ""; $("aiError").textContent = data ? STALE : "Couldn't run the audit. Is serve.py running?"; return; }
  aiAudit = data;
  renderAi();
}
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-research]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.research;
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const out = await post("api/ai-settings/research", {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows.find(r => r.id === id).research = {...out, alive: true};
    renderAudit();
  } catch (err) {
    if (aiAudit !== audit) return;
    b.disabled = false;
    $("aiError").textContent = err.status === 409 && /already running/.test(err.message) ? "Research is already running for this item."
      : err.status === 409 ? err.message : "Couldn't start research. Is serve.py running?";
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-toggle]");
  if (!b) return;
  const audit = aiAudit, id = b.dataset.row, on = b.dataset.toggle === "enable";
  $("aiError").textContent = ""; b.disabled = true;
  try {
    const row = await post(`api/ai-settings/${b.dataset.toggle}`, {id});
    if (aiAudit !== audit) return;  // left the tab or changed scope meanwhile
    audit.rows = audit.rows.map(r => r.id === id ? row : r);
    on ? aiOff.delete(id) : aiOff.add(id);
    renderAudit();
  } catch {
    if (aiAudit !== audit) return;
    b.disabled = false; $("aiError").textContent = "Couldn't change this setting. Is serve.py running?";
  }
});
$("aiList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const sid = $("aiScope").value;
  $("aiError").textContent = ""; $("aiBack").hidden = false; $("aiList").innerHTML = AI_LOADING;
  const it = await getJson(`api/ai-settings/item?id=${enc(b.dataset.id)}`, null);
  if ($("aiScope").value !== sid || $("aiBack").hidden) return;  // moved on while loading
  if (!it) return aiFail();
  aiItem = it.editable ? it : null;
  $("aiList").innerHTML = `<dl class="facts"><dt>Name</dt><dd><b>${esc(it.name)}</b></dd><dt>Scope</dt><dd><span class="skill">${esc(it.scope)}</span></dd>
    <dt>Path</dt><dd>${esc(it.path)}</dd></dl>${it.editable ? `<form id="aiEdit">
    <textarea id="aiText" spellcheck="false" aria-label="${esc(it.name)} content">${esc(it.content)}</textarea>
    <div><button class="btn primary" id="aiSave" type="submit" disabled>Save</button>
    <button class="btn" id="aiUndo" type="button" hidden>Undo</button><span class="note" id="aiStatus" role="status"></span></div></form>`
    : `<pre>${esc(it.content)}</pre>`}`;
  if (aiItem) aiItem.baseline = $("aiText").value;  // the textarea's own copy: browsers turn \r\n into \n
});
// Save and Undo both answer with the fresh item; a reply for an item the user already left is dropped.
async function aiWrite(route, body, busy, fail) {
  const form = $("aiEdit"), item = aiItem;
  $("aiError").textContent = ""; $("aiStatus").textContent = busy; $("aiSave").disabled = $("aiUndo").disabled = true;
  try {
    const it = await post(`api/ai-settings/${route}`, {id: item.id, ...body});
    if (!form.isConnected) return;
    aiItem = Object.assign(it, {baseline: it.content.replace(/\r\n?/g, "\n")});
    return true;
  } catch (err) {
    if (!form.isConnected) return;
    $("aiStatus").textContent = "";
    $("aiError").textContent = err.status === 409 ? "This file changed on disk. Go back and reopen it." : fail;
  } finally {
    if (form.isConnected) { $("aiSave").disabled = $("aiText").value === aiItem.baseline; $("aiUndo").disabled = false; }
  }
}
$("aiList").addEventListener("input", e => { if (e.target.id === "aiText") $("aiSave").disabled = e.target.value === aiItem.baseline; });
$("aiList").addEventListener("submit", async e => {
  e.preventDefault();
  if (await aiWrite("save", {content: $("aiText").value, version: aiItem.version}, "Saving…", "Couldn't save. Is serve.py running?")) {
    $("aiStatus").textContent = "Saved"; $("aiUndo").hidden = false;
  }
});
$("aiList").addEventListener("click", async e => {
  if (e.target.id !== "aiUndo") return;
  if (await aiWrite("undo", {}, "Undoing…", "Couldn't undo. Is serve.py running?")) {
    $("aiText").value = aiItem.content; aiItem.baseline = $("aiText").value; $("aiSave").disabled = true;
    $("aiStatus").textContent = "Undone"; $("aiUndo").hidden = true;
  }
});

$("board").addEventListener("click", e => {
  const el = e.target.closest(".card");
  const job = el && jobs.find(j => j.key === el.dataset.key);
  if (job) open(job);
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-file]");
  const job = b && jobs.find(j => j.key === $("viewer").dataset.key);
  if (job) show(job, b.dataset.file);
});
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => {
  if (e.target === d || e.target.closest(".close")) d.close();
}));

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
