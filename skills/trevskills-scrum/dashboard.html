<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevskills Scrum</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#76736b;--line:#e3e0d8;--accent:#2457d6;
  --pass:#1e8449;--changes:#c4520f;--invalid:#7a3fd6;--human:#d32f2f;--pending:#c8c4ba;
  --p1:#1e8449;--p2:#2f9e6a;--p3:#1f8fa6;--p5:#d4a514;--p8:#d9661a;--p13:#c0392b;--roadmap:var(--p5)}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#1d1c1a;--ink:#ecebe6;--muted:#9b978e;--line:#2f2d2a;--pending:#55524c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px}
h1{font-size:16px;margin:0}
#status,#routing,#machine,#cooldownState{color:var(--muted);font-size:12px}
#cooldown{min-height:44px;min-width:44px}#cooldownState{overflow-wrap:anywhere}
.volwrap{position:relative;display:inline-flex;align-self:center}
#volume{min-height:44px;min-width:44px;display:inline-grid;place-items:center;padding:0 10px}
#volume[aria-pressed="true"] .waves{display:none}#volume[aria-pressed="false"] .cross{display:none}
.volpop{display:none;position:absolute;top:100%;left:0;z-index:5;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.volwrap:hover .volpop,.volwrap:focus-within .volpop{display:flex;align-items:center}#volumeLevel{width:140px;min-height:44px;margin:0;accent-color:var(--accent)}
#machine .low{color:var(--changes)}#machine .danger{color:var(--human)}
#machine .ring{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;vertical-align:middle;font-size:9px;letter-spacing:-.5px;font-weight:600;color:var(--ink)}#machine .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--pct) * 1%),var(--pending) 0);mask:radial-gradient(circle,transparent 12px,black 12.5px)}
#machine .ring.ok{--ring:var(--pass)}#machine .ring.low{--ring:var(--p5)}#machine .ring.danger{--ring:var(--human)}#machine .ring.none{--ring:var(--pending)}
#routing{white-space:nowrap;min-height:44px}
#usage{width:min(640px,94vw);overscroll-behavior:contain}#usage .close{min-height:44px;min-width:44px}
#rank{width:min(480px,94vw);overscroll-behavior:contain}#rank .close,#rankBtn,#rankList .btn{min-height:44px;min-width:44px}
#rankList{list-style:none;margin:0;padding:0;display:grid;gap:6px}#rankList li{display:flex;align-items:center;gap:8px;min-width:0}
#colour{width:min(480px,94vw);overscroll-behavior:contain}#colour .close,#colourInput,#colourReset{min-height:44px;min-width:44px}
#colour article{display:grid;gap:12px;padding-top:14px}#colourSwatches{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:8px}
#colourSwatches button{min-height:44px;min-width:44px;border:2px solid transparent;border-radius:6px;background:hsl(var(--h) 50% 42%);cursor:pointer;touch-action:manipulation}
#colourSwatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
#colour label{display:flex;align-items:center;gap:8px}#colourInput{padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
#rankList .rnum{color:var(--muted);min-width:2ch;text-align:right}#rankList .rname{flex:1;min-width:0;overflow-wrap:anywhere}
.usage{width:100%;border-collapse:collapse;font-size:13px}.usage th,.usage td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.usage td:nth-child(2),.usage td:nth-child(3),.usage thead th:nth-child(2),.usage thead th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.usage.windows{margin-top:16px}.usage.windows td{overflow-wrap:anywhere}.usage.windows th{overflow-wrap:normal;min-width:8ch}.usage.windows td:nth-child(2),.usage.windows thead th:nth-child(2){text-align:left;white-space:normal}
main{display:grid;gap:12px;padding:0 16px 16px;overflow-x:auto}
.col h2 span{white-space:nowrap}
.col h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.col.human h2{color:var(--human)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card.human{border:2px solid var(--human);box-shadow:0 0 0 3px color-mix(in srgb,var(--human) 15%,transparent)}
.card.paused{border:2px solid var(--human)}
.card.roadmap{border:2px solid var(--roadmap);box-shadow:0 0 0 3px color-mix(in srgb,var(--roadmap) 15%,transparent)}
.card.roadmap .lanechip{color:var(--roadmap);border-color:var(--roadmap)}.card.roadmap:hover,.card.roadmap:focus-visible{border-color:var(--accent)}
.card.roadmap .line{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.roadmap b{color:var(--human);font-weight:inherit}
.id{font:12px ui-monospace,monospace;color:var(--muted)}
.title{display:block;margin:2px 0 4px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.row b{font:600 11px ui-monospace,monospace;color:var(--muted);width:22px}
.chip{font-size:11px;padding:1px 5px;border-radius:99px;color:#fff;background:var(--pending)}
.chip.PASS{background:var(--pass)}.chip.CHANGES,.chip.FAIL{background:var(--changes)}.chip.INVALID{background:var(--invalid)}
.chip.pending{background:transparent;color:var(--muted);border:1px dashed var(--pending)}
.chip.rt{background:transparent;color:var(--muted);border:1px solid var(--line)}.chip.rt.local{color:var(--accent);border-color:var(--accent)}
.meta{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.meta.activity{display:flex;gap:4px;white-space:nowrap}.activity>span{flex:none}
.activity .what{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:3px;margin-top:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}.bar.done>span{background:var(--pass)}.bar.human>span{background:var(--human)}
.reason{display:block;font-size:12px;color:var(--human);margin-top:6px}
.card .status{display:block;font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.card.human .status{color:var(--human)}
.stale{color:var(--changes)}
.meta.kid{margin-top:0;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:12px}
dialog{width:min(900px,94vw);max-height:88dvh;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:#0007}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.tabs button,#aiCats button{font:12px ui-monospace,monospace;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
.tabs button[aria-pressed="true"],.tabs button[aria-selected="true"],#aiCats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .close{margin-left:auto}
.vhead{position:sticky;top:0;z-index:1;background:var(--card)}.vhead .tabs{position:static}
#viewerTitle{margin:0;padding:10px 10px 0;font-size:16px;overflow-wrap:anywhere;color:var(--ink)}
#viewerStatus{padding:2px 10px 0;overflow-wrap:anywhere}#viewerStatus:empty{display:none}
article{padding:4px 20px 20px;overflow-wrap:anywhere}
article pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:6px;white-space:pre-wrap}
article a{color:var(--accent)}
body:has(dialog[open]){overflow:hidden}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--human);border-color:var(--human);color:#fff}
.btn.danger-outline{background:transparent;border-color:var(--human);color:var(--human)}
.card.aborted{opacity:.55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.tall{min-height:44px}
.btn.more{width:100%}
.btn.icon{min-width:32px;padding:6px 8px}
#filter{margin-left:auto}
#filter,#laneFilter,#blProject,#aiScope,#dgProject{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:32px}
.lanechip,.badge{display:inline-block;font:600 10px system-ui,sans-serif;padding:0 5px;border-radius:4px;margin-right:6px;white-space:nowrap}
.lanechip{color:var(--muted);border:1px solid var(--line)}
.badge{color:var(--changes);border:1px solid var(--changes)}
#diverged{padding:12px 20px;border-bottom:1px solid var(--line)}#diverged:empty{display:none}
#diverged h3{font-size:13px;margin:0 0 4px}#diverged ul{margin:0;padding-left:18px;overflow-wrap:anywhere}
.tag{display:inline-block;font:600 10px system-ui,sans-serif;letter-spacing:.03em;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;background:var(--c,hsl(var(--h) 50% 42%));cursor:pointer}
header{flex-wrap:wrap}
.running{display:block;font-size:12px;color:var(--accent);margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:0}
.sentback:empty{display:none}.sentback h3{font-size:13px;margin:8px 0 4px}.sentback ul{margin:0;padding-left:18px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.error{font-size:12px;color:var(--human);margin:0}
.error:empty{display:none}
#actions{display:grid;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.stop{border:1px solid var(--human);border-radius:8px;padding:8px 12px;background:color-mix(in srgb,var(--human) 8%,var(--card));min-width:0}
.stop b{color:var(--human)}.stop p{margin:4px 0 0;overflow-wrap:anywhere}
.stop .acts{display:grid;gap:8px;margin-top:8px}.stop .acts .btn{width:100%;font-size:15px;text-align:left;overflow-wrap:anywhere}
.stop .acts .badge{margin:0 0 0 2px;vertical-align:middle}.stop .acts .note{margin:-4px 0 0}
.stop .sendback{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
details.more summary{display:flex;align-items:center;min-height:44px;min-width:44px;width:max-content;cursor:pointer;color:var(--muted);font-size:13px}
details.more form{margin-top:4px}
#actions:empty{display:none}
#actions form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kids{display:grid;gap:6px}.kids .btn{flex:1;text-align:left}.btn.kid.human{border-color:var(--human)}
input[type=text],textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{flex:1 1 320px;min-height:64px;resize:vertical}
#backlog article{display:grid;gap:10px;padding-top:14px}
#backlog .tabs{align-items:center}#backlog .tabs select{min-height:44px}
#blAdd{display:flex;gap:6px;align-items:flex-start}
#blRunAll,#blRunAllAskme button{font:inherit;font-size:13px;min-height:44px;min-width:44px}  /* .btn look; .tabs button would make it mono */
#blRunAllAskme{display:flex;gap:4px}#blRunAllAskme[hidden]{display:none}
#blTriage summary{display:flex;align-items:center;min-height:44px;cursor:pointer;color:var(--muted);font-size:13px}
#blTriageBody{font-size:13px;overflow-wrap:anywhere}
#blAdd textarea,#blList li textarea{flex:1;min-width:0;min-height:44px;resize:none;field-sizing:content;line-height:20px;padding:11px 8px}  /* one line empty, grows with the text */
#blList li textarea:not(:focus){field-sizing:fixed;height:44px;white-space:nowrap;overflow:hidden}  /* a row collapses to one line until clicked */#blAdd .pts{min-height:44px;flex:none}
#blAdd .urg{font:inherit;font-size:13px;min-height:44px;flex:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
#blList{list-style:none;margin:0;padding:0}
#blList li{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
#blList .badge,#blList .lanechip{flex:none;margin-right:0}
#blList .btn{min-height:44px;min-width:44px}
#blList .grip{flex:none;align-self:stretch;display:flex;align-items:center;width:16px;cursor:grab;color:var(--muted);user-select:none}
#blList li.drop-before{box-shadow:inset 0 2px 0 var(--accent)}#blList li.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
#blList .needs{flex:0 1 auto;min-width:0;max-width:40%;font-size:12px;color:var(--changes);overflow-wrap:anywhere}#blList .needs.met{color:var(--muted)}
#blList li.setup{flex-wrap:wrap;border-left:3px solid var(--changes);padding-left:8px;background:color-mix(in srgb,var(--changes) 8%,transparent)}
#blList .setup-box{flex-basis:100%;order:1;min-width:0;font-size:12px;color:var(--changes);overflow-wrap:anywhere}
#blList .setup-list{margin:2px 0 0;padding-left:18px;color:var(--ink)}#blList .setup-list li{display:list-item;padding:0;border:0}
#blManual h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
#blManualList{list-style:none;margin:0;padding:0}
#blManualList label{display:flex;gap:8px;align-items:center;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere;min-width:0}
#blManualList input{width:20px;height:20px;flex:none;margin:0}
.pts{font:600 12px ui-monospace,monospace;width:46px;min-height:32px;border:0;border-radius:6px;color:#fff;background:var(--pending);text-align:center;cursor:pointer}
.pts.p1{background:var(--p1)}.pts.p2{background:var(--p2)}.pts.p3{background:var(--p3)}.pts.p5{background:var(--p5);color:#1c1b19}
.pts.p8{background:var(--p8)}.pts.p13{background:var(--p13)}
#agents{width:calc(100vw - 24px)}#aiSettings{width:min(1400px,96vw)}
#agents,#aiSettings{max-width:none;max-height:92dvh;overflow-x:hidden;overscroll-behavior:contain}
#agents .tabs,#aiSettings .tabs,#digest .tabs{align-items:center}
#agents [hidden],#aiSettings [hidden]{display:none}
#agents .tabs button,#agents .btn,#agents .links button,#aiSettings .tabs button,#aiCats button{min-height:44px;min-width:44px}
#agents article{display:grid;gap:10px;padding-top:14px}
#pipeBar,#pipeTabs,#agZoomBar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}#pipeBar{gap:4px 16px}
#agZoom{min-width:44px;text-align:center;font:12px ui-monospace,monospace}
#flow{display:grid;position:relative}
#flow>*{min-width:0}
#flow:has(>.loop){padding-right:44px}
.node{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:44px;text-align:left;
  font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.node{cursor:pointer;touch-action:manipulation}
button.node:hover,button.node:focus-visible{border-color:var(--accent);outline:none}
.node b{font:600 13px ui-monospace,monospace;overflow-wrap:anywhere}
.node span{font-size:12px;color:var(--muted)}
.node.step{background:var(--bg);border-style:dashed}
#flow>.node,#flow>.lane{width:auto;max-width:100%;justify-self:center}
.links{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.arrow{text-align:center;color:var(--muted);font-size:16px;line-height:24px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;align-items:start}
#flow>.lanes{grid-template-columns:repeat(auto-fit,minmax(200px,max-content));width:auto;max-width:100%;justify-self:center;justify-content:center}
.lane{display:grid;gap:4px}
#flow>.loop{position:absolute;right:8px;border:2px solid var(--changes);border-left:0;border-radius:0 8px 8px 0}
/* All and Maintenance: one column per flow; columns stack on a phone. */
.pcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;align-items:start}
.pcol{display:grid;align-content:start}
.pcol h3{font-size:13px;margin:0 0 6px;text-align:center}
.pcols .node{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;justify-content:flex-start}.pcols .links{align-self:stretch}
.fan{height:14px;margin:0 12.5%;border:2px solid var(--muted);border-bottom:0;border-radius:6px 6px 0 0;position:relative}
.fan::before{content:"";position:absolute;left:50%;top:-16px;height:14px;border-left:2px solid var(--muted)}
.loop::before{content:"";position:absolute;left:var(--tip,-2px);top:-7px;border:6px solid transparent;border-right:8px solid var(--changes);border-left:0}
.loop span{position:absolute;top:50%;right:4px;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;color:var(--changes)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.facts dt{color:var(--muted);font-size:12px;line-height:44px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
#doc .facts{margin-bottom:16px}#doc .facts dt{line-height:1.45}#doc .facts dd{min-height:0}  /* spec.md header rows: text only, nothing to tap */
.skill{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
#agPicker{display:grid;gap:8px}
#agSkills{display:flex;flex-wrap:wrap;gap:6px}
.md{border-top:1px solid var(--line)}
#aiScope{flex:1 1 160px;min-width:0;max-width:420px;min-height:44px;text-overflow:ellipsis}
#aiSettings>.error{padding:10px 20px 0}
#checkoutAlert{padding:0 16px 12px;overflow-wrap:anywhere}
#aiBody{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
#aiCats{display:grid;gap:4px;padding:14px 10px}
#aiCats button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#aiList{display:grid;gap:6px;padding-top:14px}
.node .chip{color:#fff}.node .chip.pending{color:var(--muted)}
.node .path{flex-basis:100%;overflow-wrap:anywhere}
.node.over{opacity:.55}
.node.finding{justify-content:flex-start}.finding .path{color:var(--ink)}
.node .chip.high{background:var(--human)}.node .chip.medium{background:var(--changes)}
#aiEdit{display:grid;gap:8px}
#aiText{width:100%;min-height:50dvh;font:13px/1.5 ui-monospace,monospace}
#aiEdit>div:not(#aiDiff){display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#aiEdit .btn,.audit .btn{min-height:44px;min-width:44px}
#aiList h3{font-size:13px;margin:10px 0 0}
.node.audit{justify-content:flex-start}.audit .acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.audit .acts a{display:inline-flex;align-items:center;min-height:44px}
#digest{overscroll-behavior:contain}
#digest article{display:grid;gap:10px;padding-top:14px}
#digest .btn,#digest .tabs button,#dgProject{min-height:44px;min-width:44px}
#viewer .btn{min-height:44px}
#dgNow{justify-self:start}
.dg{display:grid;gap:8px}.dg h3{font-size:13px;margin:6px 0 0}
.prop{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.prop .path{font:600 12px ui-monospace,monospace;overflow-wrap:anywhere}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.diff div{min-width:0}.diff pre{margin:4px 0 0}
.prop .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prop .id{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.prop .chip{background:transparent;color:var(--muted);border:1px solid var(--line)}.prop .chip.applied{color:var(--pass);border-color:var(--pass)}.prop .chip.skipped{color:var(--changes);border-color:var(--changes)}
.prop .diff div:first-child pre{text-decoration:line-through;color:var(--human)}.prop .diff div:last-child pre{color:var(--pass)}
@media (max-width:640px){#colour,#agents,#aiSettings,#digest,#backlog,#viewer,#usage,#rank{width:100%;max-width:none;max-height:100dvh;border-radius:0;border-inline:0}#viewer{height:100dvh}#agents article,#aiSettings article,#digest article,#backlog article,#viewer article,#usage article,#rank article,#colour article{padding-inline:12px}
  #tabs{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain}#tabs>*{flex:none}#tabs .close{position:sticky;right:0;background:var(--card)}
  #tabs{padding-right:0}#tabs .close{min-height:44px;min-width:44px}
  header>*{min-width:0}#filter,#laneFilter{max-width:100%}#routing{white-space:normal}
  .diff{grid-template-columns:minmax(0,1fr)}#dgProject{font-size:16px}

<body>
<header><h1>Trevskills Scrum</h1><span id="status" aria-live="polite">loading…</span>
  <span id="machine" hidden data-agent-hint="This Mac's RAM, swap in use as a share of physical RAM, CPU load and free disk, from GET /api/machine on every 2 s poll. RAM is the first ring: its filled arc is RAM in use and the free % sits inside it; swap has no text: it turns the ring red when the swap verdict blocks starts and yellow when swap is past its limit but blocks nothing and shows in the ring's tooltip. New claims, resumes and auto-continue starts wait (board.machine_ok) below 20% free RAM, above 25% swap or below 10 GB free disk; the ring is green when RAM is fine, yellow within 10 points of its limit and red past it; swap adds yellow (past its limit) or red (its verdict), and the ring shows the worse (grey with no RAM reading); disk turns orange within 10 points (10 GB) of their limit and red past it. CPU is a second ring right after RAM: the 5-minute load average as a percent of all cores (a full arc is 100%, every core with one runnable thread), with the % inside, which can pass 100; new claims, resumes and auto-continue starts also wait above 150%, the ring is yellow within 10 points of that and red past it, grey with — when there is no reading, its tooltip gives the reading, the core count, busy % (CPU time busy, which also blocks above 90%) and the 150% limit, and Trevor's own Play, Resume and Run skip it. Trailing red text names a wait that no red reading already shows, such as the session ceiling. The usage segment is Claude's 5h and 7d used % from ~/.claude/usage.json and the live-session allowance board.usage_allowance gives automated claims (red at 0, orange above it, absent when there is no taper); usage: unknown means the file is missing or over 5 min old. The allowance tapers only automated claims: Trevor's Play and Resume are never tapered. Fable near limit means 5h use reached 65% or 7d 75% (the planner and big spec-writers still run on Fable); Fable paused, using Opus means 5h reached 80% or 7d 85%, so new spawns use Opus until the window resets."></span>
  <button class="btn" id="cooldown" type="button" hidden data-agent-hint="Cool down: POST /api/cooldown creates ~/.claude/trevskills-scrum/cooldown (SCRUM_COOLDOWN), and while it exists cool-down holds only new work, every automatic start of it: backlog claims (next, Run all, cloud-claim), Run-all and BigBoy parents' child claims (FIX tickets too), wake-waiting jobs and --then retries, auto continue, the next roadmap step and the bad-window digest (board.machine_ok with claim=True), and chat hand-offs go to the top of the backlog. Work already started finishes: auto-resumes, queued Plays, orphan respawns, a BigBoy parent's final review, and continue.py's Resume POSTs; nothing is stopped. Trevor's own Play, Resume, Setup done, closed-question answers, Run now and Digest still start work. The state text counts the headless sessions still running (board.live_sessions) and reads idle at 0, when serve.py plays one done sound. Resume work removes the file.">Cool down</button><span id="cooldownState" hidden aria-live="polite"></span>
  <button class="btn" id="routing" type="button" hidden data-agent-hint="Claude 5h and weekly used, from ~/.claude/usage.json (written by board.py statusline), and Codex 5h and weekly quota used, from the newest Codex rollout file. Refreshed every 60 s. Opens the Usage dialog."></button>
  <select id="filter" aria-label="Show project"><option value="">All projects</option></select>
  <button class="btn" id="rankBtn" type="button" data-agent-hint="Opens the Rank dialog. Rank is the order of ~/.claude/trevskills-scrum/projects.json: auto continue starts opted-in projects in this order, and the project lists follow it. POST /api/projects/rank moves one project.">Rank</button>
  <select id="laneFilter" aria-label="Show pipeline"><option value="">All pipelines</option><option>roadmap</option><option>fast</option><option>standard</option><option>debug</option><option>bigboy</option><option>runall</option><option>lilguy</option></select>
  <span class="volwrap"><button class="btn" id="volume" type="button" aria-pressed="false" aria-label="Mute sounds" data-agent-hint="Scrum sounds (done, needs-human, question). Click mutes or unmutes; hover or focus shows the 0-100 slider. Saved per browser in localStorage (scrum.volume, scrum.muted) and POSTed to /api/volume, which writes ~/.claude/trevskills-scrum/volume (SCRUM_VOLUME); board.play reads that file on every sound and runs afplay -v level/100, or nothing when muted or at 0."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg></button><span class="volpop"><input type="range" id="volumeLevel" min="0" max="100" step="1" aria-label="Sound volume"></span></span>
  <button class="btn" id="backlogBtn" type="button">Backlog</button>
  <button class="btn" id="digestBtn" type="button">Digest</button>
  <button class="btn" id="agentsBtn" type="button">Pipelines</button>
  <button class="btn" id="aiBtn" type="button">AI-Settings</button></header>
<p class="error" id="checkoutAlert" role="alert" hidden></p>
<main id="board"></main>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="vhead"><h2 id="viewerTitle"></h2><p class="note" id="viewerStatus"></p><div class="tabs" id="tabs"></div></div><div id="diverged"></div><div id="actions"></div><article id="doc"></article></dialog>

  <div class="tabs"><b>Backlog</b><select id="blProject" aria-label="Backlog project"></select><button class="btn" id="blRunAll" type="button" data-agent-hint="Opens /trevskills-scrum run-all in a new Terminal window: a triage first merges near-duplicates, retires items already done and estimates unpointed ones, then open items are scheduled as parallel jobs where their files don't overlap. Disabled when this project has no open items. Stop it by closing that window. The first click shows the Askme picker and turns this button into Cancel.">Run all</button><div id="blRunAllAskme" role="group" aria-label="Askme for this run" hidden data-agent-hint="Askme level for this Run all batch; picking one starts it. Off runs every item headless. 1 asks only what blocks the build, 2 a moderate number, 3 is thorough: the Run all Terminal session asks Trevor about every item the triage left open before any job starts, and saves each item&#39;s answers to its feature.md under ## Q&amp;A."><button type="button" data-askme="">Off</button><button type="button" data-askme="1">1</button><button type="button" data-askme="2">2</button><button type="button" data-askme="3">3</button></div><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <form id="blAdd"><select name="urgency" class="urg" aria-label="Urgency" data-agent-hint="Later (the default) adds the item at the bottom of the backlog, where its priority decides when it is claimed. Next adds it first with {p:5}, so the next claim (B next, Run all, auto continue) takes it before anything else; the newest Next wins. Now adds no backlog line: it starts the item as a job at once, like Run now, and closes this dialog; the points pick is ignored."><option value="later" selected>Later</option><option value="next">Next</option><option value="now">Now</option></select><select name="points" class="pts px" aria-label="Difficulty points"></select><textarea name="text" rows="1" maxlength="2000" required placeholder="Add a backlog item" aria-label="New backlog item" data-agent-hint="Enter adds the item. Drop or paste images here: each uploads to scrum/attachments/ and adds a [screenshot: path] token to the item text."></textarea><button class="btn primary icon" type="submit" aria-label="Add item">+</button></form>
    <p class="error" id="blError" role="alert"></p>

<script>
const STAGES = ["spec", "build", "check", "review", "approve", "merging", "cloud", "stalled", "needs-human", "done"];
// Aborted jobs are finished too: they sit, dimmed, in the done column rather than a column of their own.
// A stalled or limit-held job (queued Play included) waits on its retry in the stalled column.
const colOf = job => job.stage === "aborted" ? "done" : isStalled(job) || limitHeld(job) ? "stalled" : playQueued(job) ? "waiting" : job.stage;
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const STALE_MS = 30 * 60 * 1000; // ponytail: fixed threshold; make it a URL param if long builds trip it
const PTS = [null, 1, 2, 3, 5, 8, 13];
const ptsOptions = sel => PTS.map(p => `<option value="${p ?? ""}"${p === sel ? " selected" : ""}>${p ?? "?"}</option>`).join("");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = v => typeof v === "number" && isFinite(v) ? `${Math.round(v)}%` : "—";
// Epoch seconds or a local ISO string as local "YYYY-MM-DD HH:MM"; "—" for anything else.
const when = v => { const d = new Date(typeof v === "number" ? v * 1000 : typeof v === "string" && v ? v : NaN), p = n => String(n).padStart(2, "0"); return isNaN(d) ? "—" : `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
// Allowlist for markdown link/image URLs: http, https, mailto, or schemeless (relative, #fragment, ?query); null otherwise.
// Marked writes `&` into href/src as-is and the browser decodes entities there, so any `&` before the first / ? # is unsafe.
const safeUrl = href => { const s = String(href ?? "").replace(/[\x00-\x20]/g, "").toLowerCase(); return !s || /^[^\/?#]*&/.test(s) || (/^[a-z][a-z0-9+.-]*:/.test(s) && !/^(https?|mailto):/.test(s)) ? null : href; };
// Agents write the markdown, so any raw HTML in it is shown as text, never run, and an unsafe URL renders as plain text.
// Each override takes marked v12's positional args or a v13+ token object; `false` falls back to marked's default output.
if (window.marked) marked.use({renderer: {
  html: h => esc(typeof h === "object" ? h.text : h),
  link(h, title, text) { const o = typeof h === "object"; return safeUrl(o ? h.href : h) !== null ? false : o ? this.parser.parseInline(h.tokens) : text; },
  // v12 hands image() alt text already escaped; the v13+ token's text is raw.
  image(h, title, text) { const o = typeof h === "object"; return safeUrl(o ? h.href : h) !== null ? false : o ? esc(h.text) : text; },
}});
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
  .then(async r => { const data = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), {status: r.status}); return data; });
// A 404 from one of our own routes means serve.py predates this dashboard.html; callers pass STALE as `missing` to say so.
const STALE = "Dashboard server is out of date. Restart serve.py.";
// A dropped or failed read (a busy serve.py) repeats that URL's last good body instead of the fallback, so one slow
// request never empties a column or hides the usage button; `missed` counts them for poll's status line. etags holds
// the ETag of each lastGood body: sent as If-None-Match, a 304 means that body still holds, so nothing re-downloads.
const lastGood = {}, etags = {};
let missed = 0;
const getJson = (url, fallback, missing = fallback) => fetch(url, {cache: "no-store",
    headers: etags[url] && url in lastGood ? {"If-None-Match": etags[url]} : {}})
  .then(r => r.status === 304 && url in lastGood ? lastGood[url]
    : r.ok ? r.json().then(v => { const tag = r.headers?.get("ETag"); if (tag) etags[url] = tag; else delete etags[url]; return (lastGood[url] = v); })
    : r.status === 404 ? (delete lastGood[url], delete etags[url], missing) : Promise.reject())
  .catch(() => { missed++; return url in lastGood ? lastGood[url] : fallback; });
// One run at a time: a call while the last is still in flight shares it, so slow polls never stack up behind
// Chrome's 6 connections per host.
const single = fn => { let p = null; return () => p || (p = fn().finally(() => { p = null; })); };
const SLOW = "Server is slow: showing the last good data.";

let projects = [], jobs = [], runs = {}, backlogs = {}, manuals = {}, roadmaps = {}, routes = {}, routesFinal = new Set(), lastText = "", filter = store.get("scrum.filter"), laneFilter = store.get("scrum.lane");
// No lane key = standard; a promoted fast job is standard too.
const laneOf = job => job.lane || "standard";
const shown = () => jobs.filter(j => (!filter || j.project === filter) && (!laneFilter || (laneFilter === "roadmap" ? !!roadmapSteps[j.key] : laneOf(j) === laneFilter)));
// 32-bit FNV-1a over the name's characters.
const fnv1a = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
// Twelve hues 30° apart. In name order each project takes its hash slot, or the next free one, so no two of up to 12 share
// a colour and the map is the same whatever order the projects arrive in. A 13th onward reuses its hash slot.
function projectHues(names) {
  const taken = new Set(), out = {};
  for (const n of [...names].sort()) {
    let slot = fnv1a(n) % 12;
    for (let i = 0; i < 12 && taken.has(slot); i++) slot = (slot + 1) % 12;
    taken.add(slot);
    out[n] = slot * 30;
  }
  return out;
}
let projectHue = {};  // poll() rebuilds it from projects
const hue = p => projectHue[p] ?? fnv1a(p) % 12 * 30;
// A stored colour (poll() fills it from GET /api/projects): a hue, or a #rrggbb set as --c, which the .tag CSS prefers.
let projectColour = {};
const tagStyle = p => { const c = projectColour[p]; return typeof c === "string" ? `--h:${hue(p)};--c:${esc(c)}` : `--h:${Number.isInteger(c) ? c : hue(p)}`; };
const tag = p => `<span class="tag" data-project="${esc(p)}" style="${tagStyle(p)}">${esc(p)}</span>`;

// Pinned by test_dashboard_lane_label.
function laneLabel(job) {
  const lane = laneOf(job);
  return lane === "standard" && (job.files || []).includes("promoted.md") ? "fast→standard" : lane;
}
// Bullet texts under a `## Diverged` heading, minus a lone "none", skipping fenced code (same rule as board.py diverged()).
// A fence opens on 3+ backticks or tildes and closes only on a run of the same char, at least as long, with nothing after it.
// Pinned by test_dashboard_extracts_diverged_bullets.
function divergedBullets(md) {
  let inside = false, fence = null;
  const out = [];
  for (const line of md.split(/\r?\n/)) {
    const run = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
    if (fence) {
      if (run && run[1][0] === fence[0] && run[1].length >= fence.length && !run[2].trim()) fence = null;
      continue;
    }
    if (run) fence = run[1];
    else if (line.startsWith("## ")) inside = line === "## Diverged";
    else if (inside && line.startsWith("- ") && line.slice(2).trim().toLowerCase() !== "none") out.push(line.slice(2).trim());
  }
  return out;
}

// One tag per valid routing.log line, in file order: role minus "scrum-" and runner; model, seconds and outcome in the title.
// Pinned by test_dashboard_routing.
function routeTags(text) {
  const tags = String(text ?? "").split("\n").flatMap(line => {
    try { const r = JSON.parse(line); return r?.role && r?.runner ? [r] : []; } catch { return []; }
  }).map(r => `<span class="chip rt${["cloud", "local"].includes(r.runner) ? " " + r.runner : ""}" title="${esc(`${r.model ?? "—"} · ${r.duration_s ?? "—"}s · ${r.outcome ?? "—"}`)}">${esc(String(r.role).replace(/^scrum-/, ""))} ${esc(r.runner)}</span>`);
  return tags.length ? `<span class="row">${tags.join("")}</span>` : "";
}
const chip = (verdict, label) => `<span class="chip ${esc(verdict)}" title="${esc(label)}: ${esc(verdict)}">${esc(label)}</span>`;
const roundRow = (r, i) => `<span class="row"><b>R${i + 1}</b>${chip(r.check || "pending", "check")}${REVIEWERS.map(([k, l]) => chip(r[k] || "pending", l)).join("")}</span>`;
// Rough % done from the card's own data, or null for no bar (aborted / unknown stage). Pinned by test_dashboard_progress_estimate.
function progress(job) {
  const rounds = job.rounds || [], last = rounds[rounds.length - 1] || {};
  const reviewed = REVIEWERS.filter(([k]) => last[k] && last[k] !== "pending").length;
  const table = {spec: 5, build: 15, check: 30, review: 45 + 30 * reviewed / 4, approve: 80, merging: 90,
                 "needs-human": rounds.length ? 85 : 10, done: 100};
  if (!Object.hasOwn(table, job.stage)) return null;
  let pct = table[job.stage];
  // A rework round never drops the card back below where round 1 left it.
  if (job.round >= 1 && ["build", "check", "review"].includes(job.stage))
    pct = Math.max(pct, Math.min(70, 30 + 20 * job.round / Math.max(job.limit || 0, 1)));
  return Math.round(pct);
}

const ago = at => {
  const s = Math.max(0, Math.round(Date.now() / 1000 - at));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
};
// Also re-runs statusLine on cards and the modal, so "Building, N min" advances with no board change.
const tickAgo = () => {
  document.querySelectorAll("[data-at]").forEach(el => { el.textContent = ago(+el.dataset.at); });
  document.querySelectorAll(".card[data-key] > .status").forEach(el => {
    const j = jobs.find(x => x.key === el.parentElement.dataset.key);
    if (j) el.textContent = statusLine(j);
  });
  const j = $("viewer").open && jobs.find(x => x.key === $("viewer").dataset.key);
  if (j && $("viewerStatus")) $("viewerStatus").textContent = statusLine(j);
};

// A running job whose interactive session is stopped on a permission prompt, a question or a reply (board.py hook).
const paused = job => !!job.waiting && WATCHED.includes(job.stage);
// A BigBoy child that can't start until Trevor clicks Setup done.
const setupWait = job => job.stage === "waiting" && job.setup === "pending";
// A job Trevor paused (board.py cmd_pause): it keeps its stage column until he clicks Play in its panel.
const heldByTrevor = job => !!job.paused;
// board.py WATCHED and stalled(): stalled and not paused, legacy (needs-human, reason "stalled in <stage>: ") or new
// (its own WATCHED stage with board `stalled` true); a leftover `stalled` on another stage is ignored.
const WATCHED = ["spec", "build", "check", "review", "approve", "merging"];
const isStalled = job => !job.paused && (job.stalled ? WATCHED.includes(job.stage) : job.stage === "needs-human" && (job.reason || "").startsWith("stalled in "));
// serve.py limit_held(): held in its stage until the usage limit resets.
const limitHeld = job => !!job.limitResetAt && WATCHED.includes(job.stage) && !job.paused;
// A stalled job whose Resume the machine guard queued (serve.py play_queued): nothing left for Trevor to do.
const playQueued = job => (job.stage === "needs-human" || !!job.stalled) && !!job.play_queued;
const kidOf = (job, id) => jobs.find(j => j.key === `${job.project}/${id}`);
const needsYou = kid => !!kid && ((kid.stage === "needs-human" && !playQueued(kid) && !isStalled(kid)) || heldByTrevor(kid) || setupWait(kid));
// board.py WAITING_ON: a running parent whose children wait on Trevor. Only ids still waiting on him are kept.
const WAITING_ON = "waiting on you in: ";
const waitingOn = job => job.stage === "running" && (job.reason || "").startsWith(WAITING_ON)
  ? job.reason.slice(WAITING_ON.length).split(", ").filter(id => needsYou(kidOf(job, id))) : [];
const waitingNote = (job, cls) => {
  const ids = waitingOn(job);
  return ids.length ? `<span class="${cls}">Waiting on you in: ${esc(ids.join(", "))}</span>` : "";
};
// One row per child of a parent; a row on the board opens that child's modal through the goto handler.
const childLinks = job => !job.children?.length ? "" : `<div class="kids">${job.children.map(id => {
  const k = kidOf(job, id);
  return !k ? `<p class="note kid"><span class="id">${esc(id)}</span> —</p>`
    : `<form data-act="goto" data-key="${esc(k.key)}"><button class="btn tall kid${needsYou(k) ? " human" : ""}" type="submit">${esc(k.ticket || "Child")} <span class="id">${esc(k.id)}</span> ${esc(k.stage)}</button></form>`;
}).join("")}</div>`;
const jobTitle = job => `<span class="id">${esc(job.id)}</span> ${esc(job.title || job.id)}`;
// "4:21 PM", built by hand so every engine gives the same text (serve.py writes outcome times the same way).
const clock = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")} ${d.getHours() < 12 ? "AM" : "PM"}`;
// A live /api/runs entry (dashboard run or Discuss session): "Rework running since 4:21 PM".
const runsByKey = list => Object.fromEntries([...list].sort((a, b) => (b.action === "discuss") - (a.action === "discuss")).map(r => [`${r.project}/${r.id}`, r]));
const runLine = run => `${run.action.charAt(0).toUpperCase()}${run.action.slice(1)} running since ${clock(new Date(run.started * 1000))}`;
// serve.py's record_outcomes line: what the last dashboard run did when it left a needs-human job where it was.
const outcomeLine = (job, tag, cls) => job.stage === "needs-human" && job.outcome ? `<${tag} class="${cls}" role="status">${esc(job.outcome)}</${tag}>` : "";
// Approve & merge drops whatever is in the feedback box, so arming it says so.
const feedbackWarning = text => (text || "").trim() ? '<span class="error" role="alert">You typed feedback. Send it back instead?</span>' : "";
// rework.md entries (SKILL.md rework: `## <ISO date>` then the feedback), newest first. Text before the first heading is skipped.
const reworkEntries = md => String(md ?? "").split(/^## /m).slice(1).map(entry => {
  const [at, ...text] = entry.split(/\r?\n/);
  return {at: at.trim(), text: text.join("\n").trim()};
}).reverse();
const sentAt = at => isNaN(new Date(at)) ? at : when(at);  // a heading that is no date shows as written
// The modal's Sent back list, from reworkMd (filled by loadRework); the wrapper is always there so a late fetch can fill it.
const reworkMd = {};
const reworkList = job => {
  if (job.stage !== "needs-human" || !(job.files || []).includes("rework.md")) return "";
  const rows = reworkEntries(reworkMd[job.key]);
  return `<div class="sentback">${!rows.length ? "" : `<h3>Sent back</h3><ul>${rows.map(r =>
    `<li><span class="note">${esc(sentAt(r.at))}</span> ${esc(r.text)}</li>`).join("")}</ul>`}</div>`;
};
// When anything last happened: the board update or serve.py's newest activity event (run log, worktree files...).
const staleAt = job => Math.max(Date.parse(job.updatedAt), (job.activity?.at || 0) * 1000);
// Card meta "P1/2 · S2/10" for a roadmap job, "" for every other job. roadmapLookup() rebuilds it each poll.
let roadmapSteps = {};
const roadmapMeta = job => roadmapSteps[job.key]?.text || "";
// BigBoy parent: merged count, then one line per child with the tickets it waits on. Child: which parent it belongs to.
function bigboyLines(job) {
  const rm = roadmapMeta(job);
  if (job.children?.length) {
    const kids = job.children.map(id => kidOf(job, id) || {id, stage: "—"});
    const ticketOf = id => kids.find(k => k.id === id)?.ticket || id;
    return (rm ? `<span class="meta">${rm}</span>` : "") + `<span class="meta">T${kids.filter(k => k.stage === "done").length}/${kids.length} merged</span>`
      + kids.map(k => `<span class="meta kid">${esc(k.ticket || k.id)} ${esc(k.stage)}${k.depends_on?.length ? ` ← ${esc(k.depends_on.map(ticketOf).join(", "))}` : ""}</span>`).join("");
  }
  return job.parent ? `<span class="meta">${rm ? `${rm} · ` : ""}${esc(job.ticket || "Child")} of ${esc(job.parent)}</span>`
    : rm ? `<span class="meta">${rm}</span>` : "";
}

// Roadmap position per job key: a step's own job, then any child whose parent is a step's job (own step wins).
function roadmapLookup(all) {
  const out = {};
  for (const [p, rm] of Object.entries(roadmaps)) for (const ph of rm?.phases || []) for (const st of ph.steps)
    if (st.job) out[`${p}/${st.job}`] = {p: ph.n, s: st.n, text: `P${ph.n}/${rm.phases.length} · S${st.n}/${ph.steps.length}`};
  for (const j of all) if (j.parent && !out[j.key] && out[`${j.project}/${j.parent}`]) out[j.key] = out[`${j.project}/${j.parent}`];
  return out;
}
// Per-project roadmap card: where the roadmap is, the current step, what runs next, and what blocks it. No roadmap = "".
// A <button>, so Enter and Space open it; the board click handler sends data-roadmap to openRoadmap().
function roadmapCard(p) {
  const rm = roadmaps[p], cur = rm?.current;
  if (!rm) return "";
  const ph = cur && rm.phases.find(x => x.n === cur.p), st = ph?.steps.find(x => x.n === cur.s), n = rm.next, b = rm.blocker;
  const next = `next: ${n ? `${n.p !== cur?.p ? `P${n.p} ` : ""}S${n.s} ${n.request}` : "none"}`;
  const block = b ? `${b.job} ${b.reason}`.trim() : "none";
  // Each line is one row that ellipsizes; the full text stays in its title.
  const line = (text, cls = "meta", html = esc(text)) => `<span class="${cls} line" title="${esc(text)}">${html}</span>`;
  return `<button class="card roadmap" data-roadmap="${esc(p)}">${tag(p)}<span class="lanechip">roadmap</span>${line(rm.name, "title")}
    ${line(cur ? `P${cur.p}/${rm.phases.length} ${ph?.title ?? ""} · S${cur.s}/${ph?.steps.length ?? 0}` : "done")}
    ${cur ? line(st?.request ?? "") + line(next) + line(`blocker: ${block}`, "meta", `blocker: ${b ? `<b>${esc(block)}</b>` : "none"}`) : ""}</button>`;
}
// A roadmap card's column: done when finished, else its current step's job's column, else spec (no job yet, or not on the board).
function roadmapCol(p) {
  const rm = roadmaps[p], cur = rm?.current;
  if (!cur) return "done";
  const st = rm.phases.find(x => x.n === cur.p)?.steps.find(x => x.n === cur.s), job = st?.job && jobs.find(j => j.key === `${p}/${st.job}`);
  return job ? colOf(job) : "spec";
}
// Projects whose roadmap card is visible: the project filter applies, and only All pipelines or roadmap show it.
const roadmapShown = () => projects.filter(p => roadmaps[p] && (!filter || p === filter) && (!laneFilter || laneFilter === "roadmap"));

function card(job) {
  // A stalled or limit-held job waits on its retry, not on Trevor: no red, a stalled badge, never stale.
  const stall = isStalled(job), held = limitHeld(job), hold = heldByTrevor(job);
  const human = (job.stage === "needs-human" && !playQueued(job) && !stall) || paused(job), setup = setupWait(job), run = runs[job.key], act = job.activity, pct = progress(job);
  // waiting/plan/running sit idle by design (a BigBoy parent or a child waiting its turn), and cloud runs elsewhere, so they never go stale.
  const stale = !human && !hold && !held && !stall && !["done", "needs-human", "aborted", "waiting", "plan", "running", "cloud"].includes(job.stage) && Date.now() - staleAt(job) > STALE_MS;
  const staleText = `<span class="stale">stale since ${esc(new Date(staleAt(job)).toLocaleString())}</span>`;
  return `<button class="card${human || setup ? " human" : ""}${hold ? " paused" : ""}${job.stage === "aborted" ? " aborted" : ""}" data-key="${esc(job.key)}">
    ${tag(job.project)}<span class="lanechip">${esc(laneLabel(job))}</span>${job.fable ? '<span class="lanechip">Fable</span>' : ""}${job.diverged ? '<span class="badge">diverged</span>' : ""}<span class="id">${esc(job.id)}</span><span class="title">${esc(job.title)}</span>${hold ? '<span class="badge">paused</span>' : ""}${stall || held ? `<span class="badge" data-agent-hint="The session stopped (usage limit, RAM guard, crash or the 30-minute watchdog). serve.py resumes it by itself at the retry time; Resume in its panel starts it now.">${job.nextRetryAt ? `stalled · retry ${esc(when(job.nextRetryAt))}` : "stalled"}</span>` : ""}
    ${bigboyLines(job)}
    ${waitingNote(job, "meta")}
    ${(job.rounds || []).map(roundRow).join("")}
    ${job.routed ? routeTags(routes[job.key]) : ""}
    ${pct == null ? "" : `<span class="bar${job.stage === "done" ? " done" : human ? " human" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Estimated progress" title="~${pct}% (estimate)"><span style="width:${pct}%"></span></span>`}
    ${outcomeLine(job, "span", "meta")}
    <span class="status">${esc(statusLine(job))}</span>
    ${job.stage === "aborted" ? `<span class="reason">${esc(job.reason || "Aborted")}</span>` : ""}
    ${job.stage === "done" && (job.reason || "").startsWith("merged, not live") ? `<span class="reason" role="status">${esc(job.reason)}</span>` : ""}
    ${job.reopened_to ? `<span class="meta">Reopened as ${esc(job.reopened_to)}</span>` : ""}
    ${run?.alive ? `<span class="running">${esc(runLine(run))}</span>` : ""}
    ${act && !["done", "aborted"].includes(job.stage)
      ? `<span class="meta activity"><span class="what" title="${esc(act.text)}">${esc(act.text)}</span><span>·</span>${stale ? staleText : `<span data-at="${+act.at}">${ago(act.at)}</span>`}</span>`
      : `<span class="meta">${job.pr ? "PR ready · " : ""}${stale ? staleText : esc(new Date(job.updatedAt).toLocaleTimeString())}</span>`}
  </button>`;
}

// The Done column shows this many cards; Load more adds DONE_STEP. Kept outside the DOM so a poll re-render keeps it.
const DONE_STEP = 10;
let doneShown = DONE_STEP;
// Newest first: the job whose board entry changed last leads its column.
const newestFirst = (a, b) => (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0);

function render() {
  const list = shown(), rcards = roadmapShown().map(p => [roadmapCol(p), roadmapCard(p)]);
  const rIn = s => rcards.filter(([c]) => c === s).map(([, html]) => html);
  const cols = [...STAGES, ...new Set([...list.map(colOf), ...rcards.map(([c]) => c)].filter(s => !STAGES.includes(s)))];
  const count = s => list.filter(j => colOf(j) === s).length + rIn(s).length;
  // Empty stages stay visible but narrow, so the columns holding jobs get the room.
  $("board").style.gridTemplateColumns = cols.map(s => count(s) ? "minmax(230px,2fr)" : "minmax(96px,.5fr)").join(" ");
  const moreFocused = !!document.activeElement?.matches?.("#board [data-more]");
  const rmFocused = document.activeElement?.matches?.("#board [data-roadmap]") && document.activeElement.dataset.roadmap;
  $("board").innerHTML = cols.map(stage => {
    const all = list.filter(j => colOf(j) === stage).sort(newestFirst);
    const inCol = stage === "done" ? all.slice(0, doneShown) : all;
    const more = inCol.length < all.length ? `<button class="btn tall more" type="button" data-more>Load more</button>` : "";
    return `<section class="col${stage === "needs-human" ? " human" : ""}" data-col="${esc(stage)}"><h2><span>${esc(stage)}</span> <span>· ${count(stage)}</span></h2>
      ${rIn(stage).join("") + inCol.map(card).join("") + more || '<p class="empty">—</p>'}</section>`;
  }).join("");
  if (moreFocused) $("board").querySelector("[data-more]")?.focus();
  if (rmFocused) [...$("board").querySelectorAll("[data-roadmap]")].find(c => c.dataset.roadmap === rmFocused)?.focus();
  const open = projects.filter(p => !filter || p === filter).reduce((n, p) => n + (backlogs[p] || []).filter(i => !i.done).length, 0);
  $("backlogBtn").textContent = `Backlog · ${open}`;
  $("status").textContent = projects.length ? ""
    : "No projects yet. Run /trevskills-scrum in a repo and it shows up here.";
}

function renderSelect(sel, value, withAll) {
  const want = (withAll ? [""] : []).concat(projects).join("\n");
  if (sel.dataset.list !== want) {
    sel.dataset.list = want;
    sel.innerHTML = (withAll ? '<option value="">All projects</option>' : "") + projects.map(p => `<option>${esc(p)}</option>`).join("");
  }
  sel.value = value;
}

// "danger" past board.machine_ok's limit (above it for swap and CPU load, below it for RAM and disk), "low" within 10 points
// (10 GB) of it, else "ok"; an unknown reading is ok, except CPU's, which is "none" (its grey ring). CPU is the 5-minute
// load average as a percent of all cores, against max_cpu_load_pct.
function machineLevel(value, kind, s) {
  if (value == null) return kind === "cpu" ? "none" : "ok";
  const [bad, near] = kind === "swap" ? [value > s.max_swap_pct, value > s.max_swap_pct - 10]
    : kind === "cpu" ? [value > s.max_cpu_load_pct, value > s.max_cpu_load_pct - 10]
    : kind === "ram" ? [value < s.min_free_ram_pct, value < s.min_free_ram_pct + 10]
    : [value < s.min_free_disk_gb, value < s.min_free_disk_gb + 10];
  return bad ? "danger" : near ? "low" : "ok";
}

// The meter's usage segment: red at allowance 0, orange at 1 or more, plain with no taper or no data; then the Fable guard's warning or paused text.
function usagePart(u) {
  if (!u) return "";
  if (u === "unknown") return '<span class="ok">usage: unknown</span>';
  const pct = v => v == null ? "—" : Math.round(v) + "%";
  const level = u.allowance == null ? "ok" : u.allowance === 0 ? "danger" : "low";
  const fable = u.fable === "warn" ? ' · <span class="low">Fable near limit</span>'
    : u.fable === "paused" ? ' · <span class="danger">Fable paused, using Opus</span>' : "";
  return `<span class="${level}">5h ${pct(u.five_hour_pct)} · 7d ${pct(u.seven_day_pct)}${u.allowance == null ? "" : ` · allowance ${esc(u.allowance)}`}</span>${fable}`;
}

// The Cool down button and its state text, from the same api/machine poll; a click's pending (disabled) state survives it.
function renderCooldown(m) {
  const btn = $("cooldown"), state = $("cooldownState");
  if (!btn || !state) return;
  btn.hidden = state.hidden = !m;
  if (!m) return;
  btn.dataset.on = m.cooldown ? "1" : "";
  btn.textContent = m.cooldown ? "Resume work" : "Cool down";
  const n = m.sessions || 0;
  btn.dataset.sessions = n;
  state.innerHTML = !m.cooldown ? "" : n ? `Cooling down · ${esc(n)} session${n === 1 ? "" : "s"} finishing`
    : "Idle, safe to restart <code>sudo shutdown -r now</code>";
}

function renderMachine(m) {
  const el = $("machine");
  if (!el) return;
  el.hidden = !m;
  if (!m) return;
  const part = (kind, label, v, unit) =>
    `<span class="${machineLevel(v, kind, m)}">${label} ${v == null ? "—" : Math.round(v) + unit}</span>`;
  // RAM is a ring: the filled arc is RAM in use, the free % sits inside it. Swap has no text of its own: it only
  // turns the ring red when board.machine_ok's verdict is the swap one, yellow when it is past its limit but blocks nothing,
  // and shows in its tooltip, since free RAM and swap are independent.
  const ram = m.free_ram_pct, levels = [machineLevel(ram, "ram", m), /^swap used/.test(m.verdict || "") ? "danger" : m.swap_pct > m.max_swap_pct ? "low" : "ok"];
  const level = ram == null ? "none" : levels.includes("danger") ? "danger" : levels.includes("low") ? "low" : "ok";
  // One ring markup for RAM and CPU: the arc fills pct %, text sits inside, label follows.
  const ring = (lvl, pct, text, label, tip) =>
    `<span class="ring ${lvl}" role="img" style="--pct:${pct}" aria-label="${tip}" title="${tip}">${text}</span> ${label}`;
  const pctText = v => v == null ? "—" : Math.round(v) + "%";
  const tip = `RAM ${ram == null ? "—" : Math.round(ram) + "% free"} · swap ${pctText(m.swap_pct)}`;
  // CPU is the 5-minute load average as a percent of all cores; it can pass 100, so the arc caps there. Busy % is tooltip only.
  const cpu = m.cpu_load_pct, cpuLevel = machineLevel(cpu, "cpu", m);
  const cpuTip = `CPU load ${pctText(cpu)} of ${m.cpu_cores == null ? "—" : esc(m.cpu_cores)} cores · busy ${pctText(m.cpu_busy_pct)} · limit ${esc(m.max_cpu_load_pct)}%`;
  // A red reading already says what the verdict says, so the verdict shows only when it names something else (the session ceiling).
  const shownRed = level === "danger" || machineLevel(m.free_disk_gb, "disk", m) === "danger" || cpuLevel === "danger";
  el.innerHTML = [ring(level, ram == null ? 0 : Math.round(100 - ram), pctText(ram), "RAM", tip),
    ring(cpuLevel, cpu == null ? 0 : Math.min(100, Math.round(cpu)), pctText(cpu), "CPU", cpuTip),
    part("disk", "disk", m.free_disk_gb, " GB"), usagePart(m.usage)].filter(Boolean).join(" · ")
    + (m.verdict && !shownRed ? ` · <span class="danger">${esc(m.verdict)}</span>` : "");
}

// Every project's board.checkoutAlert (its live checkout cannot go live), one per line, whatever the project filter.
function renderCheckoutAlert(boards) {
  const el = $("checkoutAlert");
  if (!el) return;
  const alerts = boards.map(b => b && b.checkoutAlert).filter(Boolean);
  const html = alerts.map(esc).join("<br>");
  if (el.innerHTML !== html) el.innerHTML = html;  // unchanged text is not rewritten, so role=alert does not re-announce it
  el.hidden = !alerts.length;
}

async function poll() {
  getJson("api/machine", null).then(m => { renderMachine(m); renderCooldown(m); });  // not awaited: memory_pressure never delays the board
  missed = 0;
  try {
    const res = await fetch("api/projects", {cache: "no-store"});
    if (res.status === 404) return $("status").textContent = STALE;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const list = await res.json();
    const ps = projects = list.map(p => p.name);
    projectHue = projectHues(projects);
    projectColour = Object.fromEntries(list.map(p => [p.name, p.colour ?? null]));
    if (filter && !projects.includes(filter)) filter = "";
    const [boards, items, checks, runList, roadmapList] = await Promise.all([
      Promise.all(ps.map(p => getJson(`p/${enc(p)}/board.json`, {jobs: []}))),
      Promise.all(ps.map(p => getJson(`api/p/${enc(p)}/backlog`, []))),
      Promise.all(ps.map(p => getJson(`api/p/${enc(p)}/manual-checks`, []))),
      getJson("api/runs", []),
      Promise.all(ps.map(p => getJson(`api/p/${enc(p)}/roadmap`, null)))]);
    renderCheckoutAlert(boards);
    roadmaps = Object.fromEntries(ps.map((p, i) => [p, roadmapList[i]]));
    const all = boards.flatMap((b, i) => (b.jobs || []).map(j => ({...j, project: ps[i], key: `${ps[i]}/${j.id}`})));
    roadmapSteps = roadmapLookup(all);
    runs = runsByKey(runList);
    // A done or aborted job's routing.log can't change, so it is fetched once; active ones refetch every poll, sending
    // the last ETag so an unchanged log comes back as a bodyless 304 and keeps its text.
    const final = j => ["done", "aborted"].includes(j.stage);
    await Promise.all(all.filter(j => j.routed && !(final(j) && routesFinal.has(j.key))).map(j => {
      const url = `p/${enc(j.project)}/jobs/${enc(j.id)}/routing.log`;
      return fetch(url, {cache: "no-store", headers: etags[url] && j.key in routes ? {"If-None-Match": etags[url]} : {}})
        .then(r => r.status === 304 && j.key in routes ? routes[j.key]
          : r.ok ? r.text().then(t => { const tag = r.headers.get("ETag"); if (tag) etags[url] = tag; else delete etags[url]; return t; }) : "")
        .catch(() => "").then(t => { routes[j.key] = t; if (final(j)) routesFinal.add(j.key); });
    }));
    auditRunsChanged();
    const nextBacklogs = Object.fromEntries(ps.map((p, i) => [p, items[i]]));
    const nextManuals = Object.fromEntries(ps.map((p, i) => [p, checks[i]]));
    const backlogChanged = JSON.stringify([nextBacklogs, nextManuals]) !== JSON.stringify([backlogs, manuals]);
    backlogs = nextBacklogs;
    manuals = nextManuals;
    renderSelect($("filter"), filter, true);
    if ($("rank")?.open) renderRank();
    const text = JSON.stringify([all, runs, backlogs, roadmaps, filter, routes, projectColour]);
    if (text !== lastText) {
      jobs = all; lastText = text; render(); paintTags();
      const openJob = $("viewer").open && jobs.find(j => j.key === $("viewer").dataset.key);
      if (openJob && !$("actions").contains(document.activeElement)) renderActions(openJob);
      if (openJob) renderDiverged(openJob);
      if (openJob) loadRework(openJob);
    }
    if (backlogChanged && $("backlog").open && !editingBacklog()) renderBacklog();
    if ($("digest").open) loadDigests();
    tickAgo();
    if (missed) $("status").textContent = SLOW;
    else if ($("status").textContent === SLOW) $("status").textContent = "";
  } catch (e) {
    $("status").textContent = `Can't reach the dashboard server (${e.message}). Open the Trevskills Scrum app, or run python3 ~/.claude/skills/trevskills-scrum/serve.py`;
  }
}

$("filter").addEventListener("change", e => { filter = e.target.value; store.set("scrum.filter", filter); lastText = ""; poll(); });
$("laneFilter").value = laneFilter;
if ($("laneFilter").value !== laneFilter) laneFilter = "";  // a stored value that is no longer an option
$("laneFilter").addEventListener("change", e => { laneFilter = e.target.value; store.set("scrum.lane", laneFilter); render(); });

// spec.md's header lines (UI surface, Hard stops, Human setup, Lane) above the first "## " as plain labelled rows:
// [head HTML, the markdown without those lines]. No header lines: ["", md] unchanged. Unknown values pass through.
const specHeader = md => {
  const LABELS = {"UI surface": "Changes the UI", "Hard stops": "Needs Trevor's sign-off for", "Human setup": "Manual setup", "Lane": "Track"};
  const HARD_STOPS = {none: "none", schema: "database schema", money: "money", auth: "login", secrets: "secrets"};
  const TRACKS = {fast: ["fast", "small change, shorter checks"], standard: ["full", "the full build, check and review pipeline"],
    debug: ["bug fix", "reproduce the bug with a test first, then fix it"], bigboy: ["bigboy", "too big for one job: split into smaller child jobs"]};
  const lines = md.split("\n"), end = lines.findIndex(l => l.startsWith("## ")), rows = [];
  const rest = lines.filter((l, i) => {
    const m = (end < 0 || i < end) && /^(UI surface|Hard stops|Human setup|Lane):\s*(.*)$/.exec(l);
    if (!m) return true;
    const v = m[2].trim(), [track, hint] = m[1] === "Lane" ? TRACKS[v] || [v] : [];
    const shown = m[1] === "Hard stops" ? v.split(",").map(s => HARD_STOPS[s.trim()] || s.trim()).join(", ") : track ?? v;
    rows.push(`<dt>${LABELS[m[1]]}</dt><dd${hint ? ` title="${esc(hint)}"` : ""}>${esc(shown)}</dd>`);
    return false;
  });
  return rows.length ? [`<dl class="facts">${rows.join("")}</dl>`, rest.join("\n")] : ["", md];
};

async function show(job, file) {
  [...$("tabs").querySelectorAll("button[data-file]")].forEach(b => b.setAttribute("aria-pressed", b.dataset.file === file));
  const url = `${job.docBase ?? `p/${enc(job.project)}/jobs/${enc(job.id)}/`}${file.split("/").map(enc).join("/")}`;
  try {
    const res = await fetch(url, {cache: "no-store"});
    // board.json files is a snapshot: a job file missing on disk drops its tab instead of showing the 404.
    if (res.status === 404 && !job.base) {
      [...$("tabs").querySelectorAll("button[data-file]")].find(b => b.dataset.file === file)?.remove();
      const next = $("tabs").querySelector("button[data-file]");
      if (next) return show(job, next.dataset.file);
      $("doc").innerHTML = '<p class="empty">No files yet.</p>';
      return;
    }
    if (!res.ok) throw new Error(`${res.status}`);
    const md = await res.text();
    // spec.md: the "# " title, then its header rows (built outside marked, so they show without it), then the rest.
    const [head, rest] = file === "spec.md" ? specHeader(md) : ["", md];
    const title = head && /^# .*$/m.exec(rest), cut = title ? title.index + title[0].length : 0;
    const render = s => window.marked ? marked.parse(s) : `<pre>${esc(s)}</pre>`;
    $("doc").innerHTML = (cut ? render(rest.slice(0, cut)) : "") + head + render(rest.slice(cut));
  } catch (e) {
    $("doc").innerHTML = `<p class="empty">Couldn't load ${esc(file)} (${esc(e.message)}).</p>`;
  }
}

function open(job) {
  $("viewer").dataset.key = job.key;
  $("viewerTitle").innerHTML = jobTitle(job);
  const files = job.files || [];
  const pr = (job.pr ? `<a href="${esc(job.pr)}" target="_blank" rel="noopener">PR ↗</a>` : "")
    + (job.cloud ? `<a href="${esc(job.cloud)}" target="_blank" rel="noopener">Cloud session ↗</a>` : "");
  $("tabs").innerHTML = tag(job.project) + files.map(f => `<button data-file="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("")
    + pr + '<button class="close" aria-label="Close">✕</button>';
  $("doc").innerHTML = files.length ? "" : '<p class="empty">No files yet.</p>';
  $("diverged").innerHTML = "";  // the previous job's bullets must not show while this job's files load
  renderActions(job);
  renderDiverged(job);
  loadRework(job);
  if (!$("viewer").open) $("viewer").showModal();
  const first = files.includes("decision.md") ? "decision.md" : files.includes("spec.md") ? "spec.md" : files[0];
  if (first) show(job, first);
}

// The roadmap card's viewer: the project's roadmap.md, rendered by show(), with no job actions. The key is never a
// board job key (those are project/id), so a poll leaves #actions and #diverged empty.
const roadmapDoc = p => ({key: `${p}#roadmap`, project: p, id: "roadmap", docBase: `p/${enc(p)}/`});
function openRoadmap(p) {
  const rm = roadmaps[p];
  if (!rm) return;
  const doc = roadmapDoc(p);
  $("viewer").dataset.key = doc.key;
  $("viewerTitle").textContent = rm.name;
  $("viewerStatus").textContent = "";
  $("tabs").innerHTML = tag(p) + '<button data-file="roadmap.md" aria-pressed="false">roadmap.md</button><button class="close" aria-label="Close">✕</button>';
  $("doc").innerHTML = $("actions").innerHTML = $("diverged").innerHTML = "";
  if (!$("viewer").open) $("viewer").showModal();
  show(doc, "roadmap.md");
}

// Diverged bullets are read from the served files, not board.json; a file that fails to load is skipped.
// Writes #diverged once, after the fetches, so a poll refresh doesn't blank the section first.
// divergedGen: only the latest call may write, so a slow older call (from open() or poll()) can't overwrite a newer render.
// Pinned by test_dashboard_render_diverged_ignores_stale_fetch.
let divergedGen = 0;
async function renderDiverged(job) {
  const gen = ++divergedGen;

  if (!job.diverged) return el.innerHTML = "";
  const files = ["spec.md", "build.md", "assessment.md", "plan.md"].filter(f => (job.files || []).includes(f));
  const found = await Promise.all(files.map(f => fetch(`p/${enc(job.project)}/jobs/${enc(job.id)}/${f}`, {cache: "no-store"})
    .then(r => r.ok ? r.text() : "").catch(() => "").then(md => divergedBullets(md).map(b => [f, b]))));
  if (gen !== divergedGen) return;
