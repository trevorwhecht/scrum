<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevskills Scrum</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#76736b;--line:#e3e0d8;--accent:#2457d6;
  --pass:#1e8449;--changes:#c4520f;--invalid:#7a3fd6;--human:#d32f2f;--pending:#c8c4ba;
  --p1:#1e8449;--p2:#2f9e6a;--p3:#1f8fa6;--p5:#d4a514;--p8:#d9661a;--p13:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#1d1c1a;--ink:#ecebe6;--muted:#9b978e;--line:#2f2d2a;--pending:#55524c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:16px}
h1{font-size:16px;margin:0}
#status,#routing{color:var(--muted);font-size:12px}
#routing{white-space:nowrap}
main{display:grid;gap:12px;padding:0 16px 16px;overflow-x:auto}
#roadmaps{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:0 16px 12px}#roadmaps:empty{display:none}
.rm{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.rm>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm>span+span{color:var(--muted)}.rm b{color:var(--human);font-weight:inherit}
.col h2 span{white-space:nowrap}
.col h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.col.human h2{color:var(--human)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card.human{border:2px solid var(--human);box-shadow:0 0 0 3px color-mix(in srgb,var(--human) 15%,transparent)}
.id{font:12px ui-monospace,monospace;color:var(--muted)}
.title{display:block;margin:2px 0 4px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:4px}
.row b{font:600 11px ui-monospace,monospace;color:var(--muted);width:22px}
.chip{font-size:11px;padding:1px 5px;border-radius:99px;color:#fff;background:var(--pending)}
.chip.PASS{background:var(--pass)}.chip.CHANGES,.chip.FAIL{background:var(--changes)}.chip.INVALID{background:var(--invalid)}
.chip.pending{background:transparent;color:var(--muted);border:1px dashed var(--pending)}
.chip.rt{background:transparent;color:var(--muted);border:1px solid var(--line)}.chip.rt.local{color:var(--accent);border-color:var(--accent)}
.meta{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.meta.activity{display:flex;gap:4px;white-space:nowrap}.activity>span{flex:none}
.activity .what{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:3px;margin-top:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}.bar.done>span{background:var(--pass)}.bar.human>span{background:var(--human)}
.reason{display:block;font-size:12px;color:var(--human);margin-top:6px}
.stale{color:var(--changes)}
.meta.kid{margin-top:0;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:12px}
dialog{width:min(900px,94vw);max-height:88dvh;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:#0007}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.tabs button,#aiCats button{font:12px ui-monospace,monospace;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
.tabs button[aria-pressed="true"],.tabs button[aria-selected="true"],#aiCats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .close{margin-left:auto}
.vhead{position:sticky;top:0;z-index:1;background:var(--card)}.vhead .tabs{position:static}
#viewerTitle{margin:0;padding:10px 10px 0;font-size:16px;overflow-wrap:anywhere;color:var(--ink)}
article{padding:4px 20px 20px;overflow-wrap:anywhere}
article pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:6px;white-space:pre-wrap}
article a{color:var(--accent)}
body:has(dialog[open]){overflow:hidden}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--human);border-color:var(--human);color:#fff}
.btn.danger-outline{background:transparent;border-color:var(--human);color:var(--human)}
.card.aborted{opacity:.55}
.card.dcard{cursor:default}.dcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.tall{min-height:44px}
.btn.icon{min-width:32px;padding:6px 8px}
#filter{margin-left:auto}
#filter,#laneFilter,#blProject,#blAskme,#aiScope,#dgProject{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:32px}
.lanechip,.badge{display:inline-block;font:600 10px system-ui,sans-serif;padding:0 5px;border-radius:4px;margin-right:6px;white-space:nowrap}
.lanechip{color:var(--muted);border:1px solid var(--line)}
.badge{color:var(--changes);border:1px solid var(--changes)}
#diverged{padding:12px 20px;border-bottom:1px solid var(--line)}#diverged:empty{display:none}
#diverged h3{font-size:13px;margin:0 0 4px}#diverged ul{margin:0;padding-left:18px;overflow-wrap:anywhere}
.tag{display:inline-block;font:600 10px system-ui,sans-serif;letter-spacing:.03em;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;background:hsl(var(--h) 50% 42%)}
header{flex-wrap:wrap}
.running{display:block;font-size:12px;color:var(--accent);margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:0}
.error{font-size:12px;color:var(--human);margin:0}
.error:empty{display:none}
#actions{display:grid;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.waiting{border:1px solid var(--human);border-radius:8px;padding:8px 12px;background:color-mix(in srgb,var(--human) 8%,var(--card))}
.waiting b{color:var(--human)}.waiting p{margin:4px 0 0;overflow-wrap:anywhere}
#actions:empty{display:none}
#actions form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kids{display:grid;gap:6px}.kids .btn{flex:1;text-align:left}.btn.kid.human{border-color:var(--human)}
input[type=text],textarea{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{flex:1 1 320px;min-height:64px;resize:vertical}
#backlog article{display:grid;gap:10px;padding-top:14px}
#backlog .tabs{align-items:center}#blAskmeLabel{display:flex;align-items:center;gap:4px;font-size:13px}#backlog .tabs select{min-height:44px}
#blAdd{display:flex;gap:6px}
#blRunAll{font:inherit;font-size:13px;min-height:44px;min-width:44px}  /* .btn look; .tabs button would make it mono */
#blTriage summary{display:flex;align-items:center;min-height:44px;cursor:pointer;color:var(--muted);font-size:13px}
#blTriageBody{font-size:13px;overflow-wrap:anywhere}
#blAdd input{flex:1;min-width:0}
#blList{list-style:none;margin:0;padding:0}
#blList li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#blList li input{flex:1;min-width:0}
.pts{font:600 12px ui-monospace,monospace;width:46px;min-height:32px;border:0;border-radius:6px;color:#fff;background:var(--pending);text-align:center;cursor:pointer}
.pts.p1{background:var(--p1)}.pts.p2{background:var(--p2)}.pts.p3{background:var(--p3)}.pts.p5{background:var(--p5);color:#1c1b19}
.pts.p8{background:var(--p8)}.pts.p13{background:var(--p13)}
#agents{width:calc(100vw - 24px)}#aiSettings{width:min(1400px,96vw)}
#agents,#aiSettings{max-width:none;max-height:92dvh;overflow-x:hidden;overscroll-behavior:contain}
#agents .tabs,#aiSettings .tabs,#digest .tabs{align-items:center}
#agents [hidden],#aiSettings [hidden]{display:none}
#agents .tabs button,#agents .btn,#agents .links button,#aiSettings .tabs button,#aiCats button{min-height:44px;min-width:44px}
#agents article{display:grid;gap:10px;padding-top:14px}
#pipeBar,#pipeTabs,#agZoomBar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}#pipeBar{gap:4px 16px}
#agZoom{min-width:44px;text-align:center;font:12px ui-monospace,monospace}
#flow{display:grid;position:relative}
#flow>*{min-width:0}
#flow:has(>.loop){padding-right:44px}
.node{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:44px;text-align:left;
  font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.node{cursor:pointer;touch-action:manipulation}
button.node:hover,button.node:focus-visible{border-color:var(--accent);outline:none}
.node b{font:600 13px ui-monospace,monospace;overflow-wrap:anywhere}
.node span{font-size:12px;color:var(--muted)}
.node.step{background:var(--bg);border-style:dashed}
#flow>.node,#flow>.lane{width:auto;max-width:100%;justify-self:center}
.links{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.arrow{text-align:center;color:var(--muted);font-size:16px;line-height:24px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;align-items:start}
.lane{display:grid;gap:4px}
#flow>.loop{position:absolute;right:8px;border:2px solid var(--changes);border-left:0;border-radius:0 8px 8px 0}
/* All and Maintenance: one column per flow; columns stack on a phone. */
.pcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;align-items:start}
.pcol{display:grid;align-content:start}
.pcol h3{font-size:13px;margin:0 0 6px;text-align:center}
.pcols .node{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;justify-content:flex-start}.pcols .links{align-self:stretch}
.fan{height:14px;margin:0 12.5%;border:2px solid var(--muted);border-bottom:0;border-radius:6px 6px 0 0;position:relative}
.fan::before{content:"";position:absolute;left:50%;top:-16px;height:14px;border-left:2px solid var(--muted)}
.loop::before{content:"";position:absolute;left:var(--tip,-2px);top:-7px;border:6px solid transparent;border-right:8px solid var(--changes);border-left:0}
.loop span{position:absolute;top:50%;right:4px;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;color:var(--changes)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.facts dt{color:var(--muted);font-size:12px;line-height:44px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.skill{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
#agPicker{display:grid;gap:8px}
#agSkills{display:flex;flex-wrap:wrap;gap:6px}
.md{border-top:1px solid var(--line)}
#aiScope{flex:1 1 160px;min-width:0;max-width:420px;min-height:44px;text-overflow:ellipsis}
#aiSettings>.error{padding:10px 20px 0}
#aiBody{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
#aiCats{display:grid;gap:4px;padding:14px 10px}
#aiCats button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#aiList{display:grid;gap:6px;padding-top:14px}
.node .chip{color:#fff}.node .chip.pending{color:var(--muted)}
.node .path{flex-basis:100%;overflow-wrap:anywhere}
.node.over{opacity:.55}
.node.finding{justify-content:flex-start}.finding .path{color:var(--ink)}
.node .chip.high{background:var(--human)}.node .chip.medium{background:var(--changes)}
#aiEdit{display:grid;gap:8px}
#aiText{width:100%;min-height:50dvh;font:13px/1.5 ui-monospace,monospace}
#aiEdit>div:not(#aiDiff){display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#aiEdit .btn,.audit .btn{min-height:44px;min-width:44px}
#aiList h3{font-size:13px;margin:10px 0 0}
.node.audit{justify-content:flex-start}.audit .acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.audit .acts a{display:inline-flex;align-items:center;min-height:44px}
#digest{overscroll-behavior:contain}
#digest article{display:grid;gap:10px;padding-top:14px}
#digest .btn,#digest .tabs button,#dgProject{min-height:44px;min-width:44px}
#dgNow{justify-self:start}
.dg{display:grid;gap:8px}.dg h3{font-size:13px;margin:6px 0 0}
.prop{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.prop .path{font:600 12px ui-monospace,monospace;overflow-wrap:anywhere}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.diff div{min-width:0}.diff pre{margin:4px 0 0}
.prop .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:640px){#agents,#aiSettings,#digest,#backlog,#viewer{width:100%;max-width:none;max-height:100dvh;border-radius:0;border-inline:0}#agents article,#aiSettings article,#digest article,#backlog article,#viewer article{padding-inline:12px}
  #tabs{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain}#tabs>*{flex:none}#tabs .close{position:sticky;right:0;background:var(--card)}
  .diff{grid-template-columns:minmax(0,1fr)}#dgProject{font-size:16px}
  #aiBody{grid-template-columns:minmax(0,1fr)}#aiCats{display:flex;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
  #aiCats button{flex:none}#aiScope,#aiText{font-size:16px}
  .pcols{grid-auto-flow:row}.fan{display:none}#pipeBar{order:1;flex-basis:100%}.facts{grid-template-columns:minmax(0,1fr)}.facts dt{line-height:1.45}}
@media (max-width:640px){main{grid-template-columns:minmax(0,1fr)!important}#blList li{flex-wrap:wrap}#blList li input{flex-basis:100%;order:-1}#backlog .tabs select,#filter,#laneFilter{font-size:16px}
  #backlog .tabs{flex-wrap:nowrap}#blProject{min-width:0;flex:1 1 auto}#backlog .tabs .close{min-height:44px;min-width:44px}}
</style>
</head>
<body>
<header><h1>Trevskills Scrum</h1><span id="status" aria-live="polite">loading…</span>
  <span id="routing" hidden data-agent-hint="Codex 5h and weekly quota used, from the newest Codex rollout file, and whether local Ollama answers. local/route.py moves the Codex review to Ollama when either window passes its threshold in local/routing.json. Refreshed every 60 s."></span>
  <select id="filter" aria-label="Show project"><option value="">All projects</option></select>
  <select id="laneFilter" aria-label="Show pipeline"><option value="">All pipelines</option><option>fast</option><option>standard</option><option>debug</option><option>bigboy</option><option>runall</option><option>lilguy</option></select>
  <button class="btn" id="backlogBtn" type="button">Backlog</button>
  <button class="btn" id="digestBtn" type="button">Digest</button>
  <button class="btn" id="agentsBtn" type="button">Pipelines</button>
  <button class="btn" id="aiBtn" type="button">AI-Settings</button></header>
<section id="roadmaps" aria-label="Roadmaps"></section>
<main id="board"></main>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="vhead"><h2 id="viewerTitle"></h2><div class="tabs" id="tabs"></div></div><div id="diverged"></div><div id="actions"></div><article id="doc"></article></dialog>
<dialog id="backlog" aria-label="Backlog">
  <div class="tabs"><b>Backlog</b><select id="blProject" aria-label="Backlog project"></select><label id="blAskmeLabel">Askme <select id="blAskme" aria-label="Askme" data-agent-hint="Askme level for Run now. Off starts the job headless. 1 asks only what blocks the build, 2 a moderate number, 3 is thorough: Run now then opens an interactive Terminal window that asks Trevor questions before the spec writer runs, and saves the answers to feature.md under ## Q&amp;A."><option value="">Off</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><button class="btn" id="blRunAll" type="button" data-agent-hint="Opens /trevskills-scrum run-all in a new Terminal window: a triage first merges near-duplicates, retires items already done and estimates unpointed ones, then open items are scheduled as parallel jobs where their files don't overlap. Disabled when this project has no open items. Stop it by closing that window.">Run all</button><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <form id="blAdd"><input type="text" name="text" maxlength="2000" required placeholder="Add a backlog item" aria-label="New backlog item"><button class="btn primary icon" type="submit" aria-label="Add item">+</button></form>
    <p class="error" id="blError" role="alert"></p>
    <ol id="blList"></ol>
    <details id="blTriage" hidden><summary>Last triage</summary><div id="blTriageBody"></div></details>
  </article>
</dialog>
<dialog id="digest" aria-label="Digest">
  <div class="tabs"><b>Digest</b><select id="dgProject" aria-label="Digest project"></select><button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <button class="btn primary" id="dgNow" type="button" data-agent-hint="Starts /trevskills-scrum digest headless: a Sonnet agent reads every done job not yet digested, and an Opus agent proposes edits to agents, rules, skills and memory. Disabled while one runs or when there is nothing new.">Digest now</button>
    <p class="error" id="dgError" role="alert"></p>
    <div id="dgList"></div>
  </article>
</dialog>
<dialog id="agents" aria-label="Pipelines">
  <div class="tabs"><button id="agBack" type="button" hidden>← Back</button><b>Pipelines</b>
    <span id="pipeBar"><span id="pipeTabs" role="tablist" aria-label="Pipeline"></span>
      <span id="agZoomBar"><button id="agZoomOut" type="button" aria-label="Zoom out">−</button><span id="agZoom" aria-live="polite">100%</span><button id="agZoomIn" type="button" aria-label="Zoom in">+</button></span></span>
    <button class="close" type="button" aria-label="Close">✕</button></div>
  <article>
    <p class="error" id="agError" role="alert"></p>
    <div id="flow" role="tabpanel"></div>
    <div id="agDetail" hidden></div>
  </article>
</dialog>
<dialog id="aiSettings" aria-label="AI-Settings">
  <div class="tabs"><button id="aiBack" type="button" hidden>← Back</button><b>AI-Settings</b>
    <select id="aiScope" aria-label="Scope" data-agent-hint="Global shows managed and user config. A project shows everything that applies inside it: managed, local, project and user."></select>
    <button class="close" type="button" aria-label="Close">✕</button></div>
  <p class="error" id="aiError" role="alert"></p>
  <div id="aiBody"><nav id="aiCats" aria-label="Categories"></nav><article id="aiList"></article></div>
</dialog>
<script>
const STAGES = ["spec", "build", "check", "review", "approve", "merging", "cloud", "needs-human", "done"];
// Aborted jobs are finished too: they sit, dimmed, in the done column rather than a ninth column.
const colOf = job => job.stage === "aborted" ? "done" : job.stage;
const REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const STALE_MS = 30 * 60 * 1000; // ponytail: fixed threshold; make it a URL param if long builds trip it
const PTS = [null, 1, 2, 3, 5, 8, 13];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Allowlist for markdown link/image URLs: http, https, mailto, or schemeless (relative, #fragment, ?query); null otherwise.
// Marked writes `&` into href/src as-is and the browser decodes entities there, so any `&` before the first / ? # is unsafe.
const safeUrl = href => { const s = String(href ?? "").replace(/[\x00-\x20]/g, "").toLowerCase(); return !s || /^[^\/?#]*&/.test(s) || (/^[a-z][a-z0-9+.-]*:/.test(s) && !/^(https?|mailto):/.test(s)) ? null : href; };
// Agents write the markdown, so any raw HTML in it is shown as text, never run, and an unsafe URL renders as plain text.
// Each override takes marked v12's positional args or a v13+ token object; `false` falls back to marked's default output.
if (window.marked) marked.use({renderer: {
  html: h => esc(typeof h === "object" ? h.text : h),
  link(h, title, text) { const o = typeof h === "object"; return safeUrl(o ? h.href : h) !== null ? false : o ? this.parser.parseInline(h.tokens) : text; },
  // v12 hands image() alt text already escaped; the v13+ token's text is raw.
  image(h, title, text) { const o = typeof h === "object"; return safeUrl(o ? h.href : h) !== null ? false : o ? esc(h.text) : text; },
}});
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
  .then(async r => { const data = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), {status: r.status}); return data; });
// A 404 from one of our own routes means serve.py predates this dashboard.html; callers pass STALE as `missing` to say so.
const STALE = "Dashboard server is out of date. Restart serve.py.";
const getJson = (url, fallback, missing = fallback) => fetch(url, {cache: "no-store"})
  .then(r => r.ok ? r.json() : r.status === 404 ? missing : fallback).catch(() => fallback);

let projects = [], jobs = [], runs = {}, backlogs = {}, digests = {}, roadmaps = {}, routes = {}, routesFinal = new Set(), lastText = "", filter = store.get("scrum.filter"), laneFilter = store.get("scrum.lane");
// No lane key = standard; a promoted fast job is standard too.
const laneOf = job => job.lane || "standard";
const shown = () => jobs.filter(j => (!filter || j.project === filter) && (!laneFilter || laneOf(j) === laneFilter));
const hue = p => [...p].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 17);
const tag = p => `<span class="tag" style="--h:${hue(p)}">${esc(p)}</span>`;

// Pinned by test_dashboard_lane_label.
function laneLabel(job) {
  const lane = laneOf(job);
  return lane === "standard" && (job.files || []).includes("promoted.md") ? "fast→standard" : lane;
}
// Bullet texts under a `## Diverged` heading, minus a lone "none", skipping fenced code (same rule as board.py diverged()).
// Pinned by test_dashboard_extracts_diverged_bullets.
function divergedBullets(md) {
  let inside = false, fence = false;
  const out = [];
  for (const line of md.split(/\r?\n/)) {
    if (/^\s*(```|~~~)/.test(line)) fence = !fence;
    else if (fence) continue;
    else if (line.startsWith("## ")) inside = line === "## Diverged";
    else if (inside && line.startsWith("- ") && line.slice(2).trim().toLowerCase() !== "none") out.push(line.slice(2).trim());
  }
  return out;
}

// One tag per valid routing.log line, in file order: role minus "scrum-" and runner; model, seconds and outcome in the title.
// Pinned by test_dashboard_routing.
function routeTags(text) {
  const tags = String(text ?? "").split("\n").flatMap(line => {
    try { const r = JSON.parse(line); return r?.role && r?.runner ? [r] : []; } catch { return []; }
  }).map(r => `<span class="chip rt${["cloud", "local"].includes(r.runner) ? " " + r.runner : ""}" title="${esc(`${r.model ?? "—"} · ${r.duration_s ?? "—"}s · ${r.outcome ?? "—"}`)}">${esc(String(r.role).replace(/^scrum-/, ""))} ${esc(r.runner)}</span>`);
  return tags.length ? `<span class="row">${tags.join("")}</span>` : "";
}
const chip = (verdict, label) => `<span class="chip ${esc(verdict)}" title="${esc(label)}: ${esc(verdict)}">${esc(label)}</span>`;
const roundRow = (r, i) => `<span class="row"><b>R${i + 1}</b>${chip(r.check || "pending", "check")}${REVIEWERS.map(([k, l]) => chip(r[k] || "pending", l)).join("")}</span>`;
// Rough % done from the card's own data, or null for no bar (aborted / unknown stage). Pinned by test_dashboard_progress_estimate.
function progress(job) {
  const rounds = job.rounds || [], last = rounds[rounds.length - 1] || {};
  const reviewed = REVIEWERS.filter(([k]) => last[k] && last[k] !== "pending").length;
  const table = {spec: 5, build: 15, check: 30, review: 45 + 30 * reviewed / 4, approve: 80, merging: 90,
                 "needs-human": rounds.length ? 85 : 10, done: 100};
  if (!Object.hasOwn(table, job.stage)) return null;
  let pct = table[job.stage];
  // A rework round never drops the card back below where round 1 left it.
  if (job.round >= 1 && ["build", "check", "review"].includes(job.stage))
    pct = Math.max(pct, Math.min(70, 30 + 20 * job.round / Math.max(job.limit || 0, 1)));
  return Math.round(pct);
}

const ago = at => {
  const s = Math.max(0, Math.round(Date.now() / 1000 - at));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
};
const tickAgo = () => document.querySelectorAll("[data-at]").forEach(el => { el.textContent = ago(+el.dataset.at); });

// A running job whose interactive session is stopped on a permission prompt, a question or a reply (board.py hook).
const paused = job => !!job.waiting && ["spec", "build", "check", "review", "approve", "merging"].includes(job.stage);
// A BigBoy child that can't start until Trevor clicks Setup done.
const setupWait = job => job.stage === "waiting" && job.setup === "pending";
const kidOf = (job, id) => jobs.find(j => j.key === `${job.project}/${id}`);
const needsYou = kid => !!kid && (kid.stage === "needs-human" || setupWait(kid));
// board.py WAITING_ON: a running parent whose children wait on Trevor. Only ids still waiting on him are kept.
const WAITING_ON = "waiting on you in: ";
const waitingOn = job => job.stage === "running" && (job.reason || "").startsWith(WAITING_ON)
  ? job.reason.slice(WAITING_ON.length).split(", ").filter(id => needsYou(kidOf(job, id))) : [];
const waitingNote = (job, cls) => {
  const ids = waitingOn(job);
  return ids.length ? `<span class="${cls}">Waiting on you in: ${esc(ids.join(", "))}</span>` : "";
};
// One row per child of a parent; a row on the board opens that child's modal through the goto handler.
const childLinks = job => !job.children?.length ? "" : `<div class="kids">${job.children.map(id => {
  const k = kidOf(job, id);
  return !k ? `<p class="note kid"><span class="id">${esc(id)}</span> —</p>`
    : `<form data-act="goto" data-key="${esc(k.key)}"><button class="btn tall kid${needsYou(k) ? " human" : ""}" type="submit">${esc(k.ticket || "Child")} <span class="id">${esc(k.id)}</span> ${esc(k.stage)}</button></form>`;
}).join("")}</div>`;
const jobTitle = job => `<span class="id">${esc(job.id)}</span> ${esc(job.title || job.id)}`;
// When anything last happened: the board update or serve.py's newest activity event (run log, worktree files...).
const staleAt = job => Math.max(Date.parse(job.updatedAt), (job.activity?.at || 0) * 1000);
// Card meta "P1/2 · S2/10" for a roadmap job, "" for every other job. roadmapLookup() rebuilds it each poll.
let roadmapSteps = {};
const roadmapMeta = job => roadmapSteps[job.key]?.text || "";
// BigBoy parent: merged count, then one line per child with the tickets it waits on. Child: which parent it belongs to.
function bigboyLines(job) {
  const rm = roadmapMeta(job);
  if (job.children?.length) {
    const kids = job.children.map(id => kidOf(job, id) || {id, stage: "—"});
    const ticketOf = id => kids.find(k => k.id === id)?.ticket || id;
    return (rm ? `<span class="meta">${rm}</span>` : "") + `<span class="meta">T${kids.filter(k => k.stage === "done").length}/${kids.length} merged</span>`
      + kids.map(k => `<span class="meta kid">${esc(k.ticket || k.id)} ${esc(k.stage)}${k.depends_on?.length ? ` ← ${esc(k.depends_on.map(ticketOf).join(", "))}` : ""}</span>`).join("");
  }
  return job.parent ? `<span class="meta">${rm ? `${rm} · ` : ""}${esc(job.ticket || "Child")} of ${esc(job.parent)}</span>`
    : rm ? `<span class="meta">${rm}</span>` : "";
}

// Roadmap position per job key: a step's own job, then any child whose parent is a step's job (own step wins).
function roadmapLookup(all) {
  const out = {};
  for (const [p, rm] of Object.entries(roadmaps)) for (const ph of rm?.phases || []) for (const st of ph.steps)
    if (st.job) out[`${p}/${st.job}`] = {p: ph.n, s: st.n, text: `P${ph.n}/${rm.phases.length} · S${st.n}/${ph.steps.length}`};
  for (const j of all) if (j.parent && !out[j.key] && out[`${j.project}/${j.parent}`]) out[j.key] = out[`${j.project}/${j.parent}`];
  return out;
}
// Per-project banner: where the roadmap is, what runs next, and what blocks it. No roadmap = no element.
function roadmapBanner(p) {
  const rm = roadmaps[p], cur = rm?.current;
  if (!rm) return "";
  const ph = cur && rm.phases.find(x => x.n === cur.p), n = rm.next, b = rm.blocker;
  const row1 = `${p} roadmap · ${cur ? `P${cur.p}/${rm.phases.length} ${ph.title} · S${cur.s}/${ph.steps.length}` : "done"}`;
  const next = `next: ${n ? `${n.p !== cur?.p ? `P${n.p} ` : ""}S${n.s} ${n.request}` : "none"}`;
  const block = b ? `${b.job} ${b.reason}`.trim() : "none";
  return `<div class="rm"><span title="${esc(row1)}">${esc(row1)}</span>${cur
    ? `<span title="${esc(`${next} · blocker: ${block}`)}">${esc(next)} · blocker: ${b ? `<b>${esc(block)}</b>` : "none"}</span>` : ""}</div>`;
}

function card(job) {
  const human = job.stage === "needs-human" || paused(job), setup = setupWait(job), run = runs[job.key], act = job.activity, pct = progress(job);
  // waiting/plan/running sit idle by design (a BigBoy parent or a child waiting its turn), and cloud runs elsewhere, so they never go stale.
  const stale = !human && !["done", "needs-human", "aborted", "waiting", "plan", "running", "cloud"].includes(job.stage) && Date.now() - staleAt(job) > STALE_MS;
  const staleText = `<span class="stale">stale since ${esc(new Date(staleAt(job)).toLocaleString())}</span>`;
  return `<button class="card${human || setup ? " human" : ""}${job.stage === "aborted" ? " aborted" : ""}" data-key="${esc(job.key)}">
    ${tag(job.project)}<span class="lanechip">${esc(laneLabel(job))}</span>${job.diverged ? '<span class="badge">diverged</span>' : ""}<span class="id">${esc(job.id)}</span><span class="title">${esc(job.title)}</span>
    ${bigboyLines(job)}
    ${waitingNote(job, "meta")}
    ${(job.rounds || []).map(roundRow).join("")}
    ${job.routed ? routeTags(routes[job.key]) : ""}
    ${pct == null ? "" : `<span class="bar${job.stage === "done" ? " done" : human ? " human" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Estimated progress" title="~${pct}% (estimate)"><span style="width:${pct}%"></span></span>`}
    ${paused(job) ? `<span class="reason">${esc(job.waiting)}</span>` : ""}
    ${human && !paused(job) && job.reason ? `<span class="reason">${esc(splitReason(job.reason).problem)}</span>` : ""}
    ${setup ? `<span class="reason">Human setup: ${esc(job.setup_text || "—")}</span>` : ""}
    ${job.stage === "aborted" ? `<span class="reason">${esc(job.reason || "Aborted")}</span>` : ""}
    ${job.stage === "done" && (job.reason || "").startsWith("merged, not live") ? `<span class="reason" role="status">${esc(job.reason)}</span>` : ""}
    ${job.reopened_to ? `<span class="meta">Reopened as ${esc(job.reopened_to)}</span>` : ""}
    ${run?.alive ? `<span class="running">● ${esc(run.action)} running…</span>` : ""}
    ${act && !["done", "aborted"].includes(job.stage)
      ? `<span class="meta activity"><span class="what" title="${esc(act.text)}">${esc(act.text)}</span><span>·</span>${stale ? staleText : `<span data-at="${+act.at}">${ago(act.at)}</span>`}</span>`
      : `<span class="meta">${job.pr ? "PR ready · " : ""}${stale ? staleText : esc(new Date(job.updatedAt).toLocaleTimeString())}</span>`}
  </button>`;
}

// A pending digest proposal: Trevor decides it here or in the Digest dialog. A div, so its buttons don't nest in a <button>.
function digestCard(project, digestId, p) {
  return `<div class="card human dcard" data-project="${esc(project)}" data-digest="${esc(digestId)}" data-pid="${esc(p.id)}">
    ${tag(project)}<span class="reason">Digest ${esc(digestId)} ${esc(p.id)}${p.obvious_reason ? `: ${esc(p.obvious_reason)}` : ""}</span>
    <span class="meta kid">${esc(p.target)}</span>
    <div class="acts"><button class="btn tall primary" type="button" data-decide="approve">Approve</button><button class="btn tall" type="button" data-decide="reject">Reject</button></div>
    <p class="error" role="alert"></p></div>`;
}
// Digest cards follow the project filter like job cards; they have no lane, so the lane filter leaves them alone.
const digestCards = () => projects.filter(p => !filter || p === filter).flatMap(p => (digests[p]?.digests || [])
  .flatMap(g => g.proposals.filter(x => x.status === "pending").map(x => digestCard(p, g.id, x))));

function render() {
  const list = shown(), dcards = digestCards();
  const cols = [...STAGES, ...new Set(list.map(colOf).filter(s => !STAGES.includes(s)))];
  const count = s => list.filter(j => colOf(j) === s).length + (s === "needs-human" ? dcards.length : 0);
  // Roadmap banners follow the project filter only: a banner is per project, not per job.
  $("roadmaps").innerHTML = projects.filter(p => !filter || p === filter).map(roadmapBanner).join("");
  // Empty stages stay visible but narrow, so the columns holding jobs get the room.
  $("board").style.gridTemplateColumns = cols.map(s => count(s) ? "minmax(230px,2fr)" : "minmax(96px,.5fr)").join(" ");
  $("board").innerHTML = cols.map(stage => {
    const inCol = list.filter(j => colOf(j) === stage), extra = stage === "needs-human" ? dcards.join("") : "";
    return `<section class="col${stage === "needs-human" ? " human" : ""}"><h2><span>${esc(stage)}</span> <span>· ${count(stage)}</span></h2>
      ${inCol.map(card).join("") + extra || '<p class="empty">—</p>'}</section>`;
  }).join("");
  const open = projects.filter(p => !filter || p === filter).reduce((n, p) => n + (backlogs[p] || []).filter(i => !i.done).length, 0);
  $("backlogBtn").textContent = `Backlog · ${open}`;
  $("status").textContent = projects.length
    ? `${list.length} job${list.length === 1 ? "" : "s"} · ${projects.length} project${projects.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`
    : "No projects yet. Run /trevskills-scrum in a repo and it shows up here.";
}

function renderSelect(sel, value, withAll) {
  const want = (withAll ? [""] : []).concat(projects).join("\n");
  if (sel.dataset.list !== want) {
    sel.dataset.list = want;
    sel.innerHTML = (withAll ? '<option value="">All projects</option>' : "") + projects.map(p => `<option>${esc(p)}</option>`).join("");
  }
  sel.value = value;
}

async function poll() {
  try {
    const res = await fetch("api/projects", {cache: "no-store"});
    if (res.status === 404) return $("status").textContent = STALE;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    projects = (await res.json()).map(p => p.name);
    if (filter && !projects.includes(filter)) filter = "";
    const [boards, items, runList, digestList, roadmapList] = await Promise.all([
      Promise.all(projects.map(p => getJson(`p/${enc(p)}/board.json`, {jobs: []}))),
      Promise.all(projects.map(p => getJson(`api/p/${enc(p)}/backlog`, []))),
      getJson("api/runs", []),
      Promise.all(projects.map(p => getJson(`api/p/${enc(p)}/digests?brief=1`, null))),  // the cards need no old/new
      Promise.all(projects.map(p => getJson(`api/p/${enc(p)}/roadmap`, null)))]);
    digests = Object.fromEntries(projects.map((p, i) => [p, digestList[i]]));
    roadmaps = Object.fromEntries(projects.map((p, i) => [p, roadmapList[i]]));
    const all = boards.flatMap((b, i) => (b.jobs || []).map(j => ({...j, project: projects[i], key: `${projects[i]}/${j.id}`})));
    roadmapSteps = roadmapLookup(all);
    runs = Object.fromEntries(runList.map(r => [`${r.project}/${r.id}`, r]));
    // A done or aborted job's routing.log can't change, so it is fetched once; active ones refetch every poll.
    const final = j => ["done", "aborted"].includes(j.stage);
    await Promise.all(all.filter(j => j.routed && !(final(j) && routesFinal.has(j.key)))
      .map(j => fetch(`p/${enc(j.project)}/jobs/${enc(j.id)}/routing.log`, {cache: "no-store"})
        .then(r => r.ok ? r.text() : "").catch(() => "").then(t => { routes[j.key] = t; if (final(j)) routesFinal.add(j.key); })));
    auditRunsChanged();
    const nextBacklogs = Object.fromEntries(projects.map((p, i) => [p, items[i]]));
    const backlogChanged = JSON.stringify(nextBacklogs) !== JSON.stringify(backlogs);
    backlogs = nextBacklogs;
    renderSelect($("filter"), filter, true);
    const text = JSON.stringify([all, runs, backlogs, digests, roadmaps, filter, routes]);
    if (text !== lastText) {
      jobs = all; lastText = text; render();
      const openJob = $("viewer").open && jobs.find(j => j.key === $("viewer").dataset.key);
      if (openJob && !$("actions").contains(document.activeElement)) renderActions(openJob);
      if (openJob) renderDiverged(openJob);
    }
    if (backlogChanged && $("backlog").open && !editingBacklog()) renderBacklog();
    if ($("digest").open) loadDigests();
    tickAgo();
  } catch (e) {
    $("status").textContent = `Can't reach the dashboard server (${e.message}). Open the Trevskills Scrum app, or run python3 ~/.claude/skills/trevskills-scrum/serve.py`;
  }
}

$("filter").addEventListener("change", e => { filter = e.target.value; store.set("scrum.filter", filter); lastText = ""; poll(); });
$("laneFilter").value = laneFilter;
if ($("laneFilter").value !== laneFilter) laneFilter = "";  // a stored value that is no longer an option
$("laneFilter").addEventListener("change", e => { laneFilter = e.target.value; store.set("scrum.lane", laneFilter); render(); });

async function show(job, file) {
  [...$("tabs").querySelectorAll("button[data-file]")].forEach(b => b.setAttribute("aria-pressed", b.dataset.file === file));
  const url = `p/${enc(job.project)}/jobs/${enc(job.id)}/${file.split("/").map(enc).join("/")}`;
  try {
    const res = await fetch(url, {cache: "no-store"});
    if (!res.ok) throw new Error(`${res.status}`);
    const md = await res.text();
    $("doc").innerHTML = window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
  } catch (e) {
    $("doc").innerHTML = `<p class="empty">Couldn't load ${esc(file)} (${esc(e.message)}).</p>`;
  }
}

function open(job) {
  $("viewer").dataset.key = job.key;
  $("viewerTitle").innerHTML = jobTitle(job);
  const files = job.files || [];
  const pr = (job.pr ? `<a href="${esc(job.pr)}" target="_blank" rel="noopener">PR ↗</a>` : "")
    + (job.cloud ? `<a href="${esc(job.cloud)}" target="_blank" rel="noopener">Cloud session ↗</a>` : "");
  $("tabs").innerHTML = tag(job.project) + files.map(f => `<button data-file="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("")
    + pr + '<button class="close" aria-label="Close">✕</button>';
  $("doc").innerHTML = files.length ? "" : '<p class="empty">No files yet.</p>';
  $("diverged").innerHTML = "";  // the previous job's bullets must not show while this job's files load
  if (!termState[job.key]?.pending) delete termState[job.key];
  renderActions(job);
  renderDiverged(job);
  if (!$("viewer").open) $("viewer").showModal();
  const first = files.includes("decision.md") ? "decision.md" : files.includes("spec.md") ? "spec.md" : files[0];
  if (first) show(job, first);
}

// Diverged bullets are read from the served files, not board.json; a file that fails to load is skipped.
// Writes #diverged once, after the fetches, so a poll refresh doesn't blank the section first.
async function renderDiverged(job) {
  const el = $("diverged");
  if (!job.diverged) return el.innerHTML = "";
  const files = ["spec.md", "build.md", "assessment.md", "plan.md"].filter(f => (job.files || []).includes(f));
  const found = await Promise.all(files.map(f => fetch(`p/${enc(job.project)}/jobs/${enc(job.id)}/${f}`, {cache: "no-store"})
    .then(r => r.ok ? r.text() : "").catch(() => "").then(md => divergedBullets(md).map(b => [f, b]))));
  const items = found.flat();
  if ($("viewer").dataset.key !== job.key) return;
  el.innerHTML = !items.length ? "" : `<h3 data-agent-hint="Every bullet under a ## Diverged heading in this job's spec.md, build.md, assessment.md and plan.md: where an agent departed from feature.md or spec.md, and why.">Diverged</h3>
    <ul>${items.map(([f, b]) => `<li><span class="lanechip">${esc(f)}</span>${esc(b)}</li>`).join("")}</ul>`;
}

// Abort works on any unfinished job: it stops a dashboard-started run and marks the job aborted (code is kept).
const abortForm = job => ["done", "aborted"].includes(job.stage) ? "" : `<form data-act="abort">
    <label hidden><input type="checkbox" name="requeue"> Put back in backlog</label>
    <button class="btn danger-outline" type="submit">Abort job</button></form>`;
// Pause stops the job's session and parks it as a stalled job (board.py PAUSABLE); Play is the resume form below.
const PAUSABLE = ["spec", "build", "check", "review", "approve", "merging", "plan", "running"];
const pauseForm = job => !PAUSABLE.includes(job.stage) ? "" : `<form data-act="pause"><button class="btn tall" type="submit">Pause</button></form>`;
// A stalled job (board.py watchdog) resumes; one Trevor paused (board.py PAUSED_RE) shows the same form as Play.
const PAUSED_RE = /^stalled in \w+: paused by Trevor/;
const resumeForm = reason => !/^stalled in /.test(reason) ? ""
  : `<form data-act="resume"><button class="btn primary tall" type="submit">${PAUSED_RE.test(reason) ? "Play" : "Resume"}</button></form>`;
// Setup done: Trevor did a BigBoy child's manual setup; serve.py marks it and starts whatever is now ready.
const setupForm = job => !setupWait(job) ? "" : `<form data-act="setup-done"><p class="note">Human setup: ${esc(job.setup_text || "—")}</p>
    <button class="btn primary tall" type="submit">Setup done</button></form>`;
// Reopen starts a new linked job from a finished one; once reopened, the button jumps to that job instead.
const reopenForm = job => !["done", "aborted"].includes(job.stage) ? ""
  : job.reopened_to ? `<form data-act="goto" data-key="${esc(`${job.project}/${job.reopened_to}`)}"><button class="btn" type="submit">Reopened as ${esc(job.reopened_to)}</button></form>`
  : `<form data-act="reopen"><textarea name="note" required maxlength="2000" placeholder="What should the follow-up job do?" aria-label="Note for the reopened job"></textarea>
    <button class="btn" type="submit">Reopen</button></form>`;

// Open terminal: kept per job outside the DOM, so a polling re-render keeps the pending state and the message.
const termState = {};
function termForm(job) {
  if (!job.tty && !job.runlog && !runs[job.key]?.log) return "";
  const st = termState[job.key] || {};
  return `<form data-act="terminal"><button class="btn" type="submit"${st.pending ? " disabled" : ""}>Open terminal</button>${
    st.err ? `<span class="error" role="alert">${esc(st.err)}</span>` : st.msg ? `<span class="note" role="status">${esc(st.msg)}</span>` : ""}</form>`;
}
const redrawTerm = key => {
  const job = jobs.find(j => j.key === key), form = $("actions").querySelector('form[data-act="terminal"]');
  if (job && form && $("viewer").dataset.key === key) form.outerHTML = termForm(job);
};
async function openTerminal(key) {
  const job = jobs.find(j => j.key === key);
  if (!job || termState[key]?.pending) return;
  termState[key] = {pending: true}; redrawTerm(key);
  try {
    const out = await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/terminal`, {});
    termState[key] = {msg: out.message || ""};
  } catch (err) { termState[key] = {err: err.message}; }
  redrawTerm(key);
}

// Splits a needs-human reason into problem and fix on the first " Fix: " the orchestrator writes.
const splitReason = reason => {
  const r = reason || "", i = r.indexOf(" Fix: ");
  if (i < 0) return {problem: r || "No reason recorded.", fix: "Click Discuss first."};
  const fix = r.slice(i + 6);
  return {problem: r.slice(0, i), fix: fix.charAt(0).toUpperCase() + fix.slice(1)};
};
const waitingBanner = job => {
  const p = paused(job);
  if (!p && job.stage !== "needs-human") return "";
  const {problem, fix} = p ? {problem: job.waiting, fix: "Answer it in the job's terminal."} : splitReason(job.reason);
  return `<div class="waiting" role="status"
    data-agent-hint="${p ? "This job's interactive session is paused on a permission prompt, a question or a reply. The first line is what it is waiting for; Open terminal brings that session to the front."
      : "This job stopped and needs Trevor. The first line is what is wrong; the second is the exact fix."}">
    <b>Waiting on you</b><p>${esc(problem)}</p><p>${esc(fix)}</p></div>`;
};

function renderActions(job) {
  const el = $("actions"), run = runs[job.key], reason = job.reason || "", banner = waitingBanner(job);
  const log = run ? ` · <a href="p/${enc(job.project)}/${esc(run.log)}" target="_blank" rel="noopener">log</a>` : "";
  const err = '<p class="error" role="alert"></p>', kids = waitingNote(job, "note") + childLinks(job);
  if (run?.alive) return el.innerHTML = banner + kids + `<p class="running">● ${esc(run.action)} running…${log}</p>` + termForm(job) + pauseForm(job) + abortForm(job) + err;
  const last = run ? `<p class="note">Last ${esc(run.action)} run ${run.exit === 0 ? "finished" : run.exit < 0 ? `stopped by ${PAUSED_RE.test(reason) ? "Pause" : "Abort"}` : `failed (exit ${esc(run.exit)})`}${log}</p>` : "";
  const why = job.stage === "aborted" && reason ? `<p class="note">${esc(reason)}</p>` : "";
  if (job.stage !== "needs-human") return el.innerHTML = banner + kids + why + last + setupForm(job) + reopenForm(job) + termForm(job) + pauseForm(job) + abortForm(job) + err;
  // An obsolete job has nothing to rework; a BigBoy parent has no worktree or builder (its children do the work).
  // A stalled job (board.py watchdog) never finished review or approval, so it resumes instead of merging.
  const noRework = /^obsolete/.test(reason) || !!job.children?.length, canApprove = job.worktree && !/^(blocked|spec writer|obsolete|stalled)/.test(reason);
  el.innerHTML = banner + kids + last + resumeForm(reason)
    + (canApprove ? `<form data-act="approve">
      ${/Hard stop: schema/.test(reason) ? '<label><input type="checkbox" name="migrated"> I already ran /trevskills-migrate (skip it)</label>' : ""}
      <button class="btn primary" type="submit">Approve &amp; merge</button></form>` : "")
    + (noRework ? "" : `<form data-act="rework"><textarea name="feedback" required maxlength="2000" placeholder="What should the builder change?" aria-label="Feedback for the builder"></textarea>
      <button class="btn" type="submit" data-act="discuss" formnovalidate data-agent-hint="Opens an interactive Claude session in a new Terminal window that explains why the job stopped and what a rework can or cannot fix, then runs the approve or rework you agree on.">Discuss first</button>
      <button class="btn" type="submit">Send back to builder</button></form>`) + termForm(job) + abortForm(job) + err;
}

$("actions").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, btn = e.submitter || form.querySelector("button"), act = btn.dataset.act || form.dataset.act, key = $("viewer").dataset.key;
  const job = jobs.find(j => j.key === key);
  if (act === "terminal") return openTerminal(key);
  if (act === "goto") { const linked = jobs.find(j => j.key === form.dataset.key); if (linked) open(linked); return; }
  if (act === "approve" && !form.dataset.armed) { form.dataset.armed = "1"; btn.textContent = "Confirm: merge into main"; return; }
  if (act === "abort" && !form.dataset.armed) {
    form.dataset.armed = "1"; form.querySelector("label").hidden = false;
    btn.textContent = "Confirm abort"; btn.className = "btn danger"; return;
  }
  btn.disabled = true;
  try {
    const body = act === "approve" ? {migrated: !!form.migrated?.checked} : act === "abort" ? {requeue: form.requeue.checked}
      : act === "reopen" ? {note: form.note.value} : act === "resume" || act === "pause" || act === "setup-done" ? {} : {feedback: form.feedback.value};
    const out = await post(`api/p/${enc(job.project)}/jobs/${enc(job.id)}/${act}`, body);
    if (act === "discuss") { btn.disabled = false; btn.textContent = "Opened in Terminal"; return; }
    await poll();
    const linked = act === "reopen" && jobs.find(j => j.key === `${job.project}/${out.id}`);
    if (linked) return open(linked);
    renderActions(jobs.find(j => j.key === key));
  } catch (err) {
    btn.disabled = false;
    $("actions").querySelector(".error").textContent = err.message;
  }
});

const blProject = () => $("blProject").value;
const editingBacklog = () => !!$("blList").querySelector("[data-armed]") || ($("blList").contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName));

      <input type="text" value="${esc(it.text)}" maxlength="2000" aria-label="Item text">

}

async function backlogCall(fn) {

// A dialog's project picker opens on the board filter, else the last project picked there, else the first.
function pickProject(sel, key) {

// The latest triage report (scrum/triage/latest.md) for the picked project, collapsed; hidden when there is none.

$("blList").addEventListener("click", e => {

// Digest: proposals from scrum/digests/<NNN>/proposals.json. Approve applies a global edit (backed up) or queues a repo
// edit on that repo's backlog; serve.py decides which. The last decision in a digest trims its job folders.
let digestData = null, digestText = "";
const dgProject = () => $("dgProject").value;
const diffHtml = (old, now) => `<div class="diff"><div><span class="note">Old</span><pre>${esc(old)}</pre></div><div><span class="note">New</span><pre>${esc(now)}</pre></div></div>`;
const propRow = (digestId, p) => `<div class="prop" data-digest="${esc(digestId)}" data-pid="${esc(p.id)}">
    <span class="path">${esc(p.target)}</span><span>${esc(p.why)}</span>
    ${diffHtml(p.old, p.new)}
    <div class="acts">${p.status === "pending"
      ? `<button class="btn primary" type="button" data-decide="approve" data-agent-hint="A file outside every registered repo is edited in place after a backup to ~/.claude/backups/ai-settings/. A file inside a repo is not touched: the edit is added to that repo's backlog instead.">Approve</button>
         <button class="btn" type="button" data-decide="reject">Reject</button>`
      : `<span class="note" role="status">${esc(p.status)}</span>`}</div></div>`;

function renderDigests() {
  $("dgNow").hidden = !projects.length;
  if (!projects.length) return $("dgList").innerHTML = '<p class="note">No projects</p>';
  const d = digestData;
  $("dgNow").disabled = !d || d.running || !d.undigested;
  $("dgNow").textContent = d?.running ? "Digesting…" : "Digest now";
  if (!d) return $("dgList").innerHTML = '<p class="empty">loading…</p>';
  $("dgList").innerHTML = d.digests.map(g => `<section class="dg"><h3>Digest ${esc(g.id)} · ${g.jobs.length} job${g.jobs.length === 1 ? "" : "s"}</h3>
      ${g.error ? `<p class="error">${esc(g.error)}</p>` : g.proposals.map(p => propRow(g.id, p)).join("") || '<p class="empty">No proposals</p>'}</section>`).join("")
    || '<p class="empty">No digests</p>';
}

async function loadDigests() {
  const p = dgProject();
  if (!p) return renderDigests();
  const data = await getJson(`api/p/${enc(p)}/digests`, null, STALE);
  if (dgProject() !== p) return;  // a newer project pick is already loading
  if (!data?.digests) return $("dgError").textContent = data || "Couldn't load digests. Is serve.py running?";
  const text = JSON.stringify(data);
  if (text === digestText) return;  // unchanged: keep the DOM (and focus) as it is
  digestText = text; digestData = data;
  renderDigests();
}

async function digestCall(url, body) {
  $("dgError").textContent = "";
  try { await post(url, body); } catch (err) { $("dgError").textContent = err.message; }
  digestText = "";  // re-render even if nothing changed, so a failed click's buttons come back
  await loadDigests();
}

$("digestBtn").addEventListener("click", () => {

  renderDigests();

  loadDigests();
});
$("dgProject").addEventListener("change", e => {
  store.set("scrum.digestProject", e.target.value);

  renderDigests(); loadDigests();
});
$("dgNow").addEventListener("click", () => {
  $("dgNow").disabled = true;
  digestCall(`api/p/${enc(dgProject())}/digest`, {});
});
$("dgList").addEventListener("click", e => {
